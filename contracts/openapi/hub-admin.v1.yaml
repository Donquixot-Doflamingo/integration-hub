    post:
      operationId: rollbackIntegration
      tags: [integrations]
      x-required-role: editor
      summary: Roll back by publishing a copy of an older version
      description: Creates and publishes version `n+1` with the content of `to_version` (e.g. v9 = v7). History stays linear (DESIGN §6.4). It runs the full validation (accounts may have been retired since).
      requestBody:
