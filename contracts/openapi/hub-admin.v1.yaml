                old_key: { key_id: key_01J9Z7F6G7H8J9K0M1N2P3Q4RS, tenant_id: orders-service, prefix: hk_live_7Qm2, description: orders prod, scopes: [invoke], state: expiring, created_at: '2026-10-01T10:00:00Z', expires_at: '2026-11-01T10:00:00Z', last_used_at: '2026-10-31T09:14:59Z', replaced_by: key_01J9Z7F6G7H8J9K0M1N2P3Q4RT }
                api_key: { key_id: key_01J9Z7F6G7H8J9K0M1N2P3Q4RT, tenant_id: orders-service, prefix: hk_live_Z9a1, description: orders prod, scopes: [invoke], state: active, created_at: '2026-10-31T10:00:00Z', expires_at: null, last_used_at: null, replaced_by: null }
                secret: hk_live_Z9a1EXAMPLEexampleEXAMPLE0000
