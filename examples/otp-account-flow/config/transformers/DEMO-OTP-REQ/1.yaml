# EXAMPLE ONLY (HUB-342). Fictional vendor "demo-kyc": there is no vendor documentation to cite
# (AGENTS §3.3 applies to real vendors only). Invented shape:
#   POST /v1/otp  {"action": "send",   "mobile": "+91..."}                      -> 200 {"status": "OTP_SENT", "txn_id", "expires_in", "ref"}
#   POST /v1/otp  {"action": "verify", "mobile", "txn_id", "otp"}               -> 200 {"status": "VERIFIED", "ref"}
#                                                                                 422 {"error": "OTP_MISMATCH" | "OTP_EXPIRED", "message"}
# Step 1 has no session; step 2 reads the vendor txn id from the session step 1 opened
# (session.vendor_txn_id, DESIGN §14). The bearer token is injected by the vendor's auth scheme:
# no credential appears in this file.
transformer: DEMO-OTP-REQ
version: 1
kind: request
capability: demo.mobile_otp@v1
vendor_endpoint: demo-kyc.otp@1
request:
  method: POST
  path: /v1/otp
  headers:
    Content-Type: '"application/json"'
    X-Client-Id:  account.config.client_id
  body:
    action: 'session.vendor_txn_id == nil ? "send" : "verify"'
    mobile: req.mobile
    txn_id: session.vendor_txn_id
    otp:    'session.vendor_txn_id == nil ? nil : req.otp'
