# Backend CI (HUB-022): lint, unit (-race), integration (compose Postgres 16 + Redis 7),
# build, the M0 smoke test (HUB-032) and the security scanners gosec + govulncheck (HUB-234;
# versions pinned in backend/Makefile). Frontend jobs live in frontend.yml.
name: backend

on:
  pull_request:
    paths: ["backend/**", "contracts/**", "deploy/**", "examples/**", ".github/workflows/backend.yml"]
  push:
    branches: [main]
    paths: ["backend/**", "contracts/**", "deploy/**", "examples/**", ".github/workflows/backend.yml"]

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: backend

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
          # Build the pinned version from the Go module proxy instead of downloading the release
          # binary from GitHub: the release download answered 504 twice in a row (HUB-442).
          install-mode: goinstall
          working-directory: backend

  sqlc:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Generated sqlc code is fresh
        run: make sqlc-check

  gosec:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: gosec (fails on medium/high findings not triaged with #nosec, SECURITY.md §8.1)
        run: make gosec

  govulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: govulncheck (fails on reachable known vulnerabilities, stdlib included)
        run: make vuln

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: make test
      - name: Transformer goldens (hubctl transform test)
        run: make goldens

  itest:
    runs-on: ubuntu-latest
    # The suite takes ~9-10 min since EP-14 (runs: 540-618 s); 10 min cancelled it on main and on
    # PR #46. HUB-443 tracks making it faster.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: make itest # starts deploy/docker-compose.yml (make up) first
      - if: always()
        run: docker compose -f ../deploy/docker-compose.yml down -v

  latency-budget:
    # HUB-413 (docs/tech/LATENCY.md): a 100 ms mockvendor stays at p50 <= 102 ms and p99 <= 110 ms
    # through the gateway stack, and the Hub adds <= 2 ms p50 / <= 10 ms p99 over direct calls.
    # Its own job, without -race (the race detector would be what it measures).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: make up # compose Postgres 16 + Redis 7
      - run: make latency-budget
      - if: always()
        run: docker compose -f ../deploy/docker-compose.yml down -v

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: make build

  monitoring:
    # HUB-232: alert rules pass promtool check + unit tests; alert rules and dashboards query only
    # metric and label names the code exports (Go catalogue test). Grafana itself is not run.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROMTOOL_VERSION: 3.4.2
      PROMTOOL_SHA256: 630177c6ad011193987904f09ffafec29d531abfeb5e43fa3714e376e5f28ddc # prometheus-3.4.2.linux-amd64.tar.gz
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Install promtool (pinned release, checksum verified)
        run: |
          tgz="$RUNNER_TEMP/prometheus.tar.gz"
          mkdir -p "$RUNNER_TEMP/bin"
          # GitHub release downloads answer 504 at times (HUB-442): retry with a pause; the checksum still decides.
          if curl -sSfL --retry 4 --retry-delay 10 --retry-all-errors -o "$tgz" "https://github.com/prometheus/prometheus/releases/download/v${PROMTOOL_VERSION}/prometheus-${PROMTOOL_VERSION}.linux-amd64.tar.gz"; then
            echo "${PROMTOOL_SHA256}  $tgz" | sha256sum -c -
            tar -xzf "$tgz" -C "$RUNNER_TEMP/bin" --strip-components=1 "prometheus-${PROMTOOL_VERSION}.linux-amd64/promtool"
          else
            # Fallback when the release download is down: the same promtool version from the official
            # image on Docker Hub, run with the workspace mounted at the same path.
            echo "::warning::promtool release download failed; using prom/prometheus:v${PROMTOOL_VERSION}"
            docker pull -q "prom/prometheus:v${PROMTOOL_VERSION}"
            printf '#!/bin/sh\nexec docker run --rm -u "$(id -u):$(id -g)" -v "%s:%s" -w "$PWD" --entrypoint promtool "prom/prometheus:v%s" "$@"\n' \
              "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE" "$PROMTOOL_VERSION" > "$RUNNER_TEMP/bin/promtool"
            chmod +x "$RUNNER_TEMP/bin/promtool"
          fi
          "$RUNNER_TEMP/bin/promtool" --version
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Alert rules and dashboards (make monitoring)
        run: make monitoring

  smoke-m0:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: compose up + hub gateway serves /healthz and /readyz
        working-directory: .
        run: deploy/smoke/m0.sh
