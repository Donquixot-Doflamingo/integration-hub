                api_key: { key_id: key_01J9Z7F6G7H8J9K0M1N2P3Q4RS, tenant_id: orders-service, prefix: hk_live_7Qm2, description: orders prod, scopes: [invoke], state: revoked, created_at: '2026-10-01T10:00:00Z', expires_at: '2026-10-31T10:00:00Z', last_used_at: '2026-10-31T09:14:59Z', replaced_by: null }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /api-keys/{key_id}/rotate:
    parameters:
      - $ref: '#/components/parameters/KeyId'
    post:
      operationId: rotateApiKey
      tags: [api-keys]
      x-required-role: admin
      summary: Rotate an API key with overlap
      description: Mints a replacement key with the same tenant and scopes. The old key stays valid for `overlap_ms` (state `expiring`) and is then revoked automatically. The new secret is shown once.
