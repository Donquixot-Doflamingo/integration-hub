# TEST ONLY (HUB-343). The default pair serves send; operations.verify gives verify its own
# pair (its own vendor endpoint). The failover target selects the same way.
integration: int_two_step
version: 1
operations:
  send:
    description: Send a code to mobile.
    idempotent: false
    request_schema:
      body:
        type: object
        required: [mobile]
        additionalProperties: false
        properties:
          mobile: { type: string, pattern: '^\+91[6-9][0-9]{9}$', x-pii: phone }
  verify:
    description: Verify the code the user typed.
    idempotent: true
    request_schema:
      body:
        type: object
        required: [mobile, code]
        additionalProperties: false
        properties:
          mobile: { type: string, pattern: '^\+91[6-9][0-9]{9}$', x-pii: phone }
          code: { type: string, pattern: '^[0-9]{4,8}$', x-pii: free_text }
targets:
  - vendor: stepvendor
    account: sv-primary
    transformer: { request: TS-SEND-REQ@1, response: TS-SEND-RES@1 }
    operations:
      verify: { request: TS-VERIFY-REQ@1, response: TS-VERIFY-RES@1 }
    weight: 100
failover:
  - vendor: stepvendor
    account: sv-backup
    transformer: { request: TS-SEND-REQ@1, response: TS-SEND-RES@1 }
    operations:
      verify: { request: TS-VERIFY-REQ@1, response: TS-VERIFY-RES@1 }
delivery:
  mode: sync
  ttl: 1h
  on_circuit_open: failover
audit: { payloads: masked, retention: 30d }
publish: { author: test, reason: "per-operation pairs" }
