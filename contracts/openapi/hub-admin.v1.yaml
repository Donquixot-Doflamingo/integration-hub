        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /requests/{request_id}/timeline:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    get:
      operationId: getRequestTimeline
      tags: [requests]
      x-required-role: tenant_viewer
      summary: Audit timeline of a request
      description: All audit events (DESIGN §13.1) in `seq` order. It always includes sha256 and byte size of each payload, even when the body is masked, sealed or metadata-only.
      responses:
        '200':
          description: Timeline.
          headers:
            X-Hub-Request-Id:
              $ref: '#/components/headers/X-Hub-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestTimeline'
              example:
                request_id: req_01J9Z3K8X2V7Q4M6N8P0R2S4T6
                payload_policy: masked
                events:
                  - { seq: 1, type: request.received, at: '2026-10-31T09:15:00.001Z', payload: { headers: { authorization: 'sha256:1c9e' }, body: { user: { id: 'hmac:7f1a' } } }, payload_ref: null, sha256: 3a7bd3e2360a3d29eea436fcfb7e44c735d117c42d1c1835420b6b9942dd4f1b, bytes: 214, sealed: false, truncated: false }
                  - { seq: 2, type: request.validated, at: '2026-10-31T09:15:00.002Z', payload: { operation: default, validate_input: true, warnings: [] }, payload_ref: null, sha256: 9b74c9897bac770ffc029102a200c5de4c6cb4b0c4c2a0a9e6c1d3b7f0e1a2b3, bytes: 96, sealed: false, truncated: false }
                  - { seq: 3, type: integration.resolved, at: '2026-10-31T09:15:00.002Z', payload: { integration_version: 7, vendor_id: clevertap, account_id: ct-brandA-in, transformers: { request: T1@7, response: R1@2 }, snapshot_version: 412, breaker_state: closed }, payload_ref: null, sha256: 1f40fc92da241694750979ee6cf582f2d5d7d28e18335de05abc54d0560e0f53, bytes: 188, sealed: false, truncated: false }
                  - { seq: 4, type: vendor.responded, at: '2026-10-31T09:15:00.214Z', payload: { status: 200, vendor_ref: a1b2c3d4e5 }, payload_ref: null, sha256: 6b86b273ff34fce19d6b804eff5a3f5747ada4eaa22f1d49c01e52ddb7875b4b, bytes: 61, sealed: false, truncated: false }
                  - { seq: 5, type: request.completed, at: '2026-10-31T09:15:02Z', payload: { status: succeeded, attempts: 1 }, payload_ref: null, sha256: d4735e3a265e16eee03f59718b9b5d03019c07d8b6c51f90da3a666eec13ab35, bytes: 40, sealed: false, truncated: false }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /requests/{request_id}/attempts:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    get:
      operationId: listRequestAttempts
      tags: [requests]
      x-required-role: tenant_viewer
      summary: Upstream attempts of a request
      description: One row per attempt. Each records the integration version it used (DESIGN §6.3).
      responses:
        '200':
          description: Attempts.
          headers:
            X-Hub-Request-Id:
              $ref: '#/components/headers/X-Hub-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttemptList'
              example:
                request_id: req_01J9Z3K8X2V7Q4M6N8P0R2S4T6
                items:
                  - { attempt_no: 1, integration_version: 7, vendor_id: clevertap, account_id: ct-brandA-in, endpoint_ref: upload@1, served_by: primary, started_at: '2026-10-31T09:15:00.003Z', duration_ms: 211, vendor_status: 200, error_code: null, breaker_state: closed, cred_version: 3 }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /requests/{request_id}/unseal:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    post:
      operationId: unsealRequest
      tags: [requests]
      x-required-role: admin
      summary: Unseal sealed payloads (audited)
      description: |
        Decrypts sealed payloads of the selected events (all events if `event_seqs` is omitted) and
        returns them in this response only. Nothing is stored decrypted. It always writes a
        `change_log` entry with the reason. The reason must be at least 10 characters and should
        cite a ticket. A request that is not sealed gives 409 `CONFLICT`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnsealRequest'
            example:
              event_seqs: [1, 4]
              reason: 'Customer dispute SUP-4411: verify bureau response'
      responses:
        '200':
          description: Unsealed events.
          headers:
            X-Hub-Request-Id:
              $ref: '#/components/headers/X-Hub-Request-Id'
            Cache-Control:
              description: Always `no-store`.
              schema:
                type: string
              example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnsealResult'
              example:
                change_id: chg_01J9Z4B2C3D4E5F6G7H8J9K0NK
                request_id: req_01J9Z3K8X2V7Q4M6N8P0R2S4T8
                events:
                  - { seq: 1, type: request.received, at: '2026-10-31T09:20:00Z', payload: { body: { pan: ABCDE1234F } }, payload_ref: null, sha256: 3a7bd3e2360a3d29eea436fcfb7e44c735d117c42d1c1835420b6b9942dd4f1b, bytes: 31, sealed: false, truncated: false }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  # ------------------------------------------------------------------ dlq
  /dlq:
    get:
      operationId: listDeadLetters
      tags: [dlq]
      x-required-role: tenant_viewer
      summary: List dead-lettered requests
      description: Kept for 14 days. Newest first.
      parameters:
        - $ref: '#/components/parameters/TenantFilter'
        - name: integration_id
          in: query
          description: Filter by integration.
          schema:
            $ref: '#/components/schemas/Slug'
          example: int_evt_brandA
        - name: vendor_id
          in: query
          description: Filter by vendor.
          schema:
            $ref: '#/components/schemas/Slug'
          example: clevertap
        - name: account_id
          in: query
          description: Filter by account.
          schema:
            $ref: '#/components/schemas/Slug'
          example: ct-brandA-in
        - name: reason
          in: query
          description: Filter by dead-letter reason (canonical error code or `poison`).
          schema:
            type: string
          example: UPSTREAM_REJECTED
        - name: replayed
          in: query
          description: Filter by whether the entry was already replayed.
          schema:
            type: boolean
          example: false
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of DLQ entries.
          headers:
            X-Hub-Request-Id:
              $ref: '#/components/headers/X-Hub-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeadLetterList'
              example:
                items:
                  - { request_id: req_01J9Z3M1A5B7C9D1E3F5G7H9JK, tenant_id: orders-service, integration_id: int_evt_brandA, vendor_id: clevertap, account_id: ct-brandA-in, reason: UPSTREAM_REJECTED, message: event name must not contain spaces, attempts: 1, dead_lettered_at: '2026-10-31T11:02:40Z', replayed_at: null, expires_at: '2026-11-14T11:02:40Z' }
                next_cursor: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /dlq/{request_id}:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    get:
      operationId: getDeadLetter
      tags: [dlq]
      x-required-role: tenant_viewer
      summary: Get a DLQ entry
      description: Includes the canonical payload, last vendor request and response (per payload policy), and attempt history.
      responses:
        '200':
          description: DLQ entry.
          headers:
            X-Hub-Request-Id:
              $ref: '#/components/headers/X-Hub-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeadLetterDetail'
              example:
                request_id: req_01J9Z3M1A5B7C9D1E3F5G7H9JK
                tenant_id: orders-service
                integration_id: int_evt_brandA
                vendor_id: clevertap
                account_id: ct-brandA-in
                reason: UPSTREAM_REJECTED
                message: event name must not contain spaces
                attempts: 1
                dead_lettered_at: '2026-10-31T11:02:40Z'
                replayed_at: null
                expires_at: '2026-11-14T11:02:40Z'
                canonical: { user: { id: 'hmac:7f1a' }, event: { name: order placed } }
                last_vendor_request: { method: POST, url: 'https://in1.api.clevertap.com/1/upload', headers: { X-CleverTap-Passcode: '***' } }
                last_vendor_response: { status: 400, body: { status: fail, error: E_INVALID_EVENT } }
                attempt_history:
                  - { attempt_no: 1, integration_version: 7, vendor_id: clevertap, account_id: ct-brandA-in, endpoint_ref: upload@1, served_by: primary, started_at: '2026-10-31T11:02:40Z', duration_ms: 140, vendor_status: 400, error_code: UPSTREAM_REJECTED, breaker_state: closed, cred_version: 3 }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /dlq/replay:
    post:
      operationId: replayDeadLetters
      tags: [dlq]
      x-required-role: editor
      summary: Replay DLQ entries by ids or by filter
      description: |
        Moves the matching entries back to `accepted`. They re-resolve and re-transform, so a
        transformer fix applies (DESIGN §10.6). Give exactly one of `request_ids` (≤ 1000) or
        `filter`. `dry_run: true` returns the match count without replaying. At most 10 000
        entries per call. `truncated: true` means call again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DlqReplayRequest'
            example:
              filter: { integration_id: int_evt_brandA, reason: UPSTREAM_REJECTED, from: '2026-10-31T00:00:00Z', to: '2026-10-31T12:00:00Z', replayed: false }
              dry_run: false
              reason: Fixed T1 event-name sanitising (T1@8)
      responses:
        '200':
          description: Replay result.
          headers:
            X-Hub-Request-Id:
              $ref: '#/components/headers/X-Hub-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DlqBulkResult'
              example:
                change_id: chg_01J9Z4B2C3D4E5F6G7H8J9K0NM
                matched: 42
                affected: 42
                truncated: false
                dry_run: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /dlq/purge:
    post:
      operationId: purgeDeadLetters
      tags: [dlq]
      x-required-role: admin
      summary: Purge DLQ entries by ids or by filter
      description: 'Permanently removes the DLQ entries. The request ledger and audit stay (retention rules apply). The same selection rules as replay apply. `dry_run: true` counts only.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DlqPurgeRequest'
            example:
              request_ids: [req_01J9Z3M1A5B7C9D1E3F5G7H9JK]
              dry_run: false
              reason: Test traffic from a misconfigured staging client
      responses:
        '200':
          description: Purge result.
          headers:
            X-Hub-Request-Id:
              $ref: '#/components/headers/X-Hub-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DlqBulkResult'
              example:
                change_id: chg_01J9Z4B2C3D4E5F6G7H8J9K0NP
                matched: 1
                affected: 1
                truncated: false
                dry_run: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  # ------------------------------------------------------------------ breakers
  /breakers:
    get:
      operationId: listBreakers
      tags: [breakers]
      x-required-role: viewer
      summary: List circuit breakers (per account + endpoint)
      description: The vendor health board. One row per `(account, endpoint)` that has seen traffic or is forced.
      parameters:
        - name: vendor_id
          in: query
          description: Filter by vendor.
          schema:
            $ref: '#/components/schemas/Slug'
          example: clevertap
        - name: account_id
          in: query
          description: Filter by account.
          schema:
            $ref: '#/components/schemas/Slug'
          example: ct-brandA-in
        - name: state
          in: query
          description: Filter by state.
          schema:
            $ref: '#/components/schemas/BreakerState'
          example: open
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of breakers.
          headers:
            X-Hub-Request-Id:
              $ref: '#/components/headers/X-Hub-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BreakerList'
              example:
                items:
                  - { account_id: ct-brandA-in, endpoint_ref: upload@1, vendor_id: clevertap, state: open, forced: none, failure_ratio: 0.82, window_calls: 57, consecutive_timeouts: 5, opened_at: '2026-10-31T09:40:00Z', open_until: '2026-10-31T09:41:00Z', reopen_count: 1, parked_count: 1290, parked_oldest_age_ms: 61000, updated_at: '2026-10-31T09:40:30Z' }
                next_cursor: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /breakers/{account_id}/{endpoint_ref}:
    parameters:
      - $ref: '#/components/parameters/AccountId'
      - $ref: '#/components/parameters/EndpointRef'
    get:
      operationId: getBreaker
      tags: [breakers]
      x-required-role: viewer
      summary: Get one breaker
      description: Breaker detail with recent transitions, probe results and the integrations that use it.
      responses:
        '200':
          description: Breaker.
          headers:
            X-Hub-Request-Id:
              $ref: '#/components/headers/X-Hub-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BreakerDetail'
              example:
                account_id: ct-brandA-in
                endpoint_ref: upload@1
                vendor_id: clevertap
                state: open
                forced: none
                failure_ratio: 0.82
                window_calls: 57
                consecutive_timeouts: 5
                opened_at: '2026-10-31T09:40:00Z'
                open_until: '2026-10-31T09:41:00Z'
                reopen_count: 1
                parked_count: 1290
                parked_oldest_age_ms: 61000
                updated_at: '2026-10-31T09:40:30Z'
                config: { window_ms: 30000, min_calls: 20, failure_ratio: 0.5, consecutive_timeouts: 5, open_ms: 30000, open_max_ms: 600000, half_open_probes: 3 }
                transitions:
                  - { at: '2026-10-31T09:39:30Z', from: closed, to: open, cause: failure_ratio, actor: null }
                  - { at: '2026-10-31T09:40:00Z', from: half_open, to: open, cause: probe_failed, actor: null }
                last_probe: { at: '2026-10-31T09:40:00Z', ok: false, status: 503, latency_ms: 40 }
                integrations: [int_evt_brandA]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /breakers/{account_id}/{endpoint_ref}/force-open:
    parameters:
      - $ref: '#/components/parameters/AccountId'
      - $ref: '#/components/parameters/EndpointRef'
    post:
      operationId: forceOpenBreaker
      tags: [breakers]
      x-required-role: admin
      summary: Force a breaker open
      description: Holds the breaker open (traffic follows `on_circuit_open`, async parks) until `duration_ms` elapses or `clearBreakerForce` is called. Shared across nodes in about 1 s.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BreakerForceOpen'
            example:
              duration_ms: 1800000
              reason: Vendor maintenance window 10:00-10:30 IST
      responses:
        '200':
          description: Forced open.
          headers:
            X-Hub-Request-Id:
              $ref: '#/components/headers/X-Hub-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BreakerChange'
              example:
                change_id: chg_01J9Z4B2C3D4E5F6G7H8J9K0NQ
                breaker: { account_id: ct-brandA-in, endpoint_ref: upload@1, vendor_id: clevertap, state: open, forced: open, forced_until: '2026-10-31T10:30:00Z', failure_ratio: 0.0, window_calls: 0, consecutive_timeouts: 0, opened_at: '2026-10-31T10:00:00Z', open_until: '2026-10-31T10:30:00Z', reopen_count: 0, parked_count: 0, parked_oldest_age_ms: null, updated_at: '2026-10-31T10:00:00Z' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /breakers/{account_id}/{endpoint_ref}/force-close:
    parameters:
      - $ref: '#/components/parameters/AccountId'
      - $ref: '#/components/parameters/EndpointRef'
    post:
      operationId: forceCloseBreaker
      tags: [breakers]
      x-required-role: admin
      summary: Force a breaker closed
      description: Closes the breaker and starts the ramped drain of parked envelopes (DESIGN §10.5). The breaker is held closed until `duration_ms` elapses or `clearBreakerForce` is called. Failures are still counted but do not trip it while forced.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BreakerForceClose'
            example:
              duration_ms: 600000
              reason: Probe endpoint broken on vendor side, real traffic healthy
      responses:
        '200':
          description: Forced closed.
          headers:
            X-Hub-Request-Id:
              $ref: '#/components/headers/X-Hub-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BreakerChange'
              example:
                change_id: chg_01J9Z4B2C3D4E5F6G7H8J9K0NR
                breaker: { account_id: ct-brandA-in, endpoint_ref: upload@1, vendor_id: clevertap, state: closed, forced: closed, forced_until: '2026-10-31T10:10:00Z', failure_ratio: 0.0, window_calls: 0, consecutive_timeouts: 0, opened_at: null, open_until: null, reopen_count: 0, parked_count: 1290, parked_oldest_age_ms: 120000, updated_at: '2026-10-31T10:00:00Z' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /breakers/{account_id}/{endpoint_ref}/clear-force:
    parameters:
      - $ref: '#/components/parameters/AccountId'
      - $ref: '#/components/parameters/EndpointRef'
    post:
      operationId: clearBreakerForce
      tags: [breakers]
      x-required-role: admin
      summary: Return a forced breaker to automatic control
      description: Removes a force-open or force-close. The breaker resumes normal state evaluation. It gives 409 `CONFLICT` if the breaker is not forced.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonBody'
            example:
              reason: Maintenance finished early
      responses:
        '200':
          description: Force cleared.
          headers:
            X-Hub-Request-Id:
              $ref: '#/components/headers/X-Hub-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BreakerChange'
              example:
                change_id: chg_01J9Z4B2C3D4E5F6G7H8J9K0NS
                breaker: { account_id: ct-brandA-in, endpoint_ref: upload@1, vendor_id: clevertap, state: half_open, forced: none, forced_until: null, failure_ratio: 0.0, window_calls: 0, consecutive_timeouts: 0, opened_at: '2026-10-31T10:00:00Z', open_until: null, reopen_count: 0, parked_count: 10, parked_oldest_age_ms: 900000, updated_at: '2026-10-31T10:15:00Z' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  # ------------------------------------------------------------------ change-log
  /change-log:
    get:
      operationId: listChangeLog
      tags: [change-log]
      x-required-role: viewer
      summary: List change-log entries
      description: Every admin mutation, newest first. `before`/`after` are omitted in the list. Secrets never appear (write-only fields are recorded as a fingerprint).
      parameters:
        - name: actor
          in: query
          description: Filter by actor (OIDC subject or email).
          schema:
            type: string
          example: priya@example.com
        - name: object_type
          in: query
          description: Filter by object type.
          schema:
            $ref: '#/components/schemas/ObjectType'
          example: integration
        - name: object_id
          in: query
          description: Filter by object id.
          schema:
            type: string
          example: int_evt_brandA
        - name: action
          in: query
          description: Filter by action (operationId of the mutation).
          schema:
            type: string
          example: publishIntegrationVersion
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of change-log entries.
          headers:
            X-Hub-Request-Id:
              $ref: '#/components/headers/X-Hub-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeLogList'
              example:
                items:
                  - { change_id: chg_01J9Z4B2C3D4E5F6G7H8J9K0N5, at: '2026-10-31T09:30:00Z', actor: priya@example.com, actor_roles: [editor], action: publishIntegrationVersion, object_type: integration, object_id: int_evt_brandA, reason: Canary 20% to the new workspace, snapshot_version: 413 }
                next_cursor: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /change-log/{change_id}:
    parameters:
      - name: change_id
        in: path
        required: true
        description: Change-log entry id.
        schema:
          $ref: '#/components/schemas/ChangeId'
        example: chg_01J9Z4B2C3D4E5F6G7H8J9K0N5
    get:
      operationId: getChangeLogEntry
      tags: [change-log]
      x-required-role: viewer
      summary: Get one change-log entry (with before/after)
      description: Full entry including `before` and `after` object snapshots.
      responses:
        '200':
          description: Change-log entry.
          headers:
            X-Hub-Request-Id:
              $ref: '#/components/headers/X-Hub-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeLogEntry'
              example:
                change_id: chg_01J9Z4B2C3D4E5F6G7H8J9K0N5
                at: '2026-10-31T09:30:00Z'
                actor: priya@example.com
                actor_roles: [editor]
                action: publishIntegrationVersion
                object_type: integration
                object_id: int_evt_brandA
                reason: Canary 20% to the new workspace
                snapshot_version: 413
                before: { active_version: 7 }
                after: { active_version: 8 }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    oidc:
      type: openIdConnect
      openIdConnectUrl: https://idp.internal/.well-known/openid-configuration
      description: |
        OIDC access token (Authorization: Bearer). Claims used: `sub`, `email`, `name`,
        `hub_roles` (array of admin|editor|viewer|tenant_viewer), `hub_tenants` (array, for
        tenant_viewer). In dev, `hub admin` runs an OIDC stub (DESIGN §19 M7).

  parameters:
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from a previous page's `next_cursor`.
      schema:
        type: string
        maxLength: 512
      example: eyJrIjoiMTIzIn0
    Limit:
      name: limit
      in: query
      description: Page size.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
      example: 50
    Q:
      name: q
      in: query
      description: Case-insensitive substring match on id and display name.
      schema:
        type: string
        maxLength: 128
      example: brand
    From:
      name: from
      in: query
      description: Inclusive lower bound (RFC 3339).
      schema:
        type: string
        format: date-time
      example: '2026-10-31T00:00:00Z'
    To:
      name: to
      in: query
      description: Exclusive upper bound (RFC 3339).
      schema:
        type: string
        format: date-time
      example: '2026-11-01T00:00:00Z'
    TenantFilter:
      name: tenant_id
      in: query
      description: Filter by tenant. For tenant_viewer it must be one of the caller's tenants (it defaults to all of them).
      schema:
        $ref: '#/components/schemas/Slug'
      example: orders-service
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: ETag from a previous GET. On mismatch the server returns 412 `PRECONDITION_FAILED`.
      schema:
        type: string
      example: '"3"'
    ReasonQuery:
      name: reason
      in: query
      required: true
      description: Change reason for DELETE operations (recorded in change_log).
      schema:
        $ref: '#/components/schemas/Reason'
      example: Endpoint replaced by reg_orders_cb_v2
    VendorId:
      name: vendor_id
      in: path
      required: true
      description: Vendor id.
      schema:
        $ref: '#/components/schemas/Slug'
      example: clevertap
    EndpointRef:
      name: endpoint_ref
      in: path
      required: true
      description: Vendor endpoint with version, `<name>@<version>`.
      schema:
        $ref: '#/components/schemas/EndpointRefValue'
      example: upload@1
    AccountId:
      name: account_id
      in: path
      required: true
      description: Account id.
      schema:
        $ref: '#/components/schemas/Slug'
      example: ct-brandA-in
    TransformerId:
      name: transformer_id
      in: path
      required: true
      description: Transformer id.
      schema:
        $ref: '#/components/schemas/TransformerIdValue'
      example: T1
    Version:
      name: version
      in: path
      required: true
      description: Version number.
      schema:
        type: integer
        minimum: 1
      example: 7
    IntegrationId:
      name: integration_id
      in: path
      required: true
      description: Integration id.
      schema:
        $ref: '#/components/schemas/Slug'
      example: int_evt_brandA
    TenantId:
      name: tenant_id
      in: path
      required: true
      description: Tenant id.
      schema:
        $ref: '#/components/schemas/Slug'
      example: orders-service
    KeyId:
      name: key_id
      in: path
      required: true
      description: API key id.
      schema:
        $ref: '#/components/schemas/KeyIdValue'
      example: key_01J9Z7F6G7H8J9K0M1N2P3Q4RS
    EndpointId:
      name: endpoint_id
      in: path
      required: true
      description: Registrar endpoint id.
      schema:
        $ref: '#/components/schemas/Slug'
      example: reg_orders_cb
    SnapshotVersion:
      name: snapshot_version
      in: path
      required: true
      description: Snapshot version.
      schema:
        type: integer
        minimum: 1
      example: 413
    RequestId:
      name: request_id
      in: path
      required: true
      description: Hub request id.
      schema:
        $ref: '#/components/schemas/RequestIdValue'
      example: req_01J9Z3K8X2V7Q4M6N8P0R2S4T6

  headers:
    X-Hub-Request-Id:
      description: Hub request id for this admin call (`req_` + ULID). Present on every response, success or error. Equals `error.request_id` on errors. Operators paste it into the request explorer and support tickets.
      required: true
      schema:
        $ref: '#/components/schemas/RequestIdValue'
      example: req_01J9Z3K8X2V7Q4M6N8P0R2S4T6
    ETag:
      description: Opaque entity tag (quoted revision or version).
      schema:
        type: string
      example: '"3"'

  responses:
    BadRequest:
      description: Invalid parameters or body.
      headers:
        X-Hub-Request-Id:
          $ref: '#/components/headers/X-Hub-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminErrorEnvelope'
          example:
            error:
              code: VALIDATION_FAILED
              message: Invalid request body
              retryable: false
              retry_after_ms: null
              details:
                - { pointer: /reason, keyword: required, message: "missing required property 'reason'" }
              meta: null
              request_id: req_01J9Z3M1A5B7C9D1E3F5G7H9KC
    Unauthorized:
      description: Missing, expired or invalid OIDC token.
      headers:
        X-Hub-Request-Id:
          $ref: '#/components/headers/X-Hub-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminErrorEnvelope'
          example:
            error:
              code: UNAUTHORIZED
              message: Token expired
              retryable: false
              retry_after_ms: null
              details: []
              meta: null
              request_id: req_01J9Z3M1A5B7C9D1E3F5G7H9KD
    Forbidden:
      description: The caller's role is below the operation's `x-required-role`, or the object is outside the tenant_viewer scope.
      headers:
        X-Hub-Request-Id:
          $ref: '#/components/headers/X-Hub-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminErrorEnvelope'
          example:
            error:
              code: FORBIDDEN
              message: Requires role 'admin'
              retryable: false
              retry_after_ms: null
              details: []
              meta: { required_role: admin }
              request_id: req_01J9Z3M1A5B7C9D1E3F5G7H9KE
    NotFound:
      description: Object not found (or not visible to this tenant_viewer).
      headers:
        X-Hub-Request-Id:
          $ref: '#/components/headers/X-Hub-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminErrorEnvelope'
          example:
            error:
              code: NOT_FOUND
              message: integration 'int_evt_brandZ' not found
              retryable: false
              retry_after_ms: null
              details: []
              meta: { object_type: integration, object_id: int_evt_brandZ }
              request_id: req_01J9Z3M1A5B7C9D1E3F5G7H9KF
    Conflict:
      description: State conflict (already exists, concurrent publish, invalid transition, object in use).
      headers:
        X-Hub-Request-Id:
          $ref: '#/components/headers/X-Hub-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminErrorEnvelope'
          example:
            error:
              code: CONFLICT
              message: Active version is 8, expected 7
              retryable: false
              retry_after_ms: null
              details: []
              meta: { expected_active_version: 7, actual_active_version: 8 }
              request_id: req_01J9Z3M1A5B7C9D1E3F5G7H9KG
    LifecycleConflict:
      description: Invalid lifecycle transition, or retire blocked by references.
      headers:
        X-Hub-Request-Id:
          $ref: '#/components/headers/X-Hub-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminErrorEnvelope'
          examples:
            RETIRE_BLOCKED:
              value:
                error:
                  code: RETIRE_BLOCKED
                  message: Account still referenced by pinned requests or open vendor sessions
                  retryable: true
                  retry_after_ms: 600000
                  details: []
                  meta: { pinned_requests: 12, open_sessions: 3, active_versions: [] }
                  request_id: req_01J9Z3M1A5B7C9D1E3F5G7H9KH
            CONFLICT:
              value:
                error:
                  code: CONFLICT
                  message: Cannot transition from 'active' to 'retired'
                  retryable: false
                  retry_after_ms: null
                  details: []
                  meta: { from: active, to: retired }
                  request_id: req_01J9Z3M1A5B7C9D1E3F5G7H9KJ
    PreconditionFailed:
      description: If-Match did not match the current ETag.
      headers:
        X-Hub-Request-Id:
          $ref: '#/components/headers/X-Hub-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminErrorEnvelope'
          example:
            error:
              code: PRECONDITION_FAILED
              message: Object changed since it was read
              retryable: false
              retry_after_ms: null
              details: []
              meta: { current_etag: '"4"' }
              request_id: req_01J9Z3M1A5B7C9D1E3F5G7H9KK
    PublishValidationFailed:
      description: Publish-time validation failed (DESIGN §6.4). The report is in `error.meta.report`, and failing checks are also in `details`.
      headers:
        X-Hub-Request-Id:
          $ref: '#/components/headers/X-Hub-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminErrorEnvelope'
          example:
            error:
              code: PUBLISH_VALIDATION_FAILED
              message: 2 publish checks failed
              retryable: false
              retry_after_ms: null
              details:
                - { pointer: /targets/1/account_id, keyword: accounts_not_retired, message: "account 'ct-brandB-us' is retired" }
                - { pointer: /delivery/mode, keyword: interactive_sync_only, message: interactive integration requires mode 'sync' }
              meta:
                report:
                  valid: false
                  checks:
                    - { check: accounts_not_retired, status: fail, message: "account 'ct-brandB-us' is retired", pointer: /targets/1/account_id }
                    - { check: interactive_sync_only, status: fail, message: interactive integration requires mode 'sync', pointer: /delivery/mode }
              request_id: req_01J9Z3M1A5B7C9D1E3F5G7H9KM
    InternalError:
      description: Unexpected server error.
      headers:
        X-Hub-Request-Id:
          $ref: '#/components/headers/X-Hub-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminErrorEnvelope'
          example:
            error:
              code: INTERNAL_ERROR
              message: Unexpected error
              retryable: true
              retry_after_ms: 1000
              details: []
              meta: null
              request_id: req_01J9Z3M1A5B7C9D1E3F5G7H9KN

  schemas:
    # ---------------- primitives
    Slug:
      description: Registry identifier. Case-sensitive.
      type: string
      pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{2,63}$'
    ChangeId:
      description: '`chg_` + ULID.'
      type: string
      pattern: '^chg_[0-9A-HJKMNP-TV-Z]{26}$'
    RequestIdValue:
      type: string
      pattern: '^req_[0-9A-HJKMNP-TV-Z]{26}$'
    KeyIdValue:
      type: string
      pattern: '^key_[0-9A-HJKMNP-TV-Z]{26}$'
    OperationName:
      description: Operation name callers invoke (`POST /v1/integrations/{id}/invoke/{operation}`). Single-operation integrations use `default`.
      type: string
      pattern: '^[a-z][a-z0-9_]{0,31}$'
    TransformerIdValue:
      type: string
      pattern: '^[A-Za-z][A-Za-z0-9_-]{0,63}$'
    TransformerRef:
      description: '`<transformer_id>@<version>`.'
      type: string
      pattern: '^[A-Za-z][A-Za-z0-9_-]{0,63}@[1-9][0-9]*$'
    EndpointRefValue:
      description: '`<endpoint name>@<version>`.'
      type: string
      pattern: '^[a-z][a-z0-9_]{0,63}@[1-9][0-9]*$'
    VendorEndpointRef:
      description: '`<vendor_id>.<endpoint name>@<version>`.'
      type: string
      pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{2,63}\.[a-z][a-z0-9_]{0,63}@[1-9][0-9]*$'
    Reason:
      description: Why the change is made. Recorded in change_log.
      type: string
      minLength: 3
      maxLength: 1024
    ReasonBody:
      type: object
      required: [reason]
      properties:
        reason:
          $ref: '#/components/schemas/Reason'
    ChangeRef:
      type: object
      required: [change_id]
      properties:
        change_id:
          $ref: '#/components/schemas/ChangeId'
    Role:
      type: string
      enum: [admin, editor, viewer, tenant_viewer]
    DeliveryMode:
      type: string
      enum: [sync, wait, async, async_callback]
    RequestState:
      type: string
      enum: [accepted, in_flight, succeeded, retry_scheduled, parked, dead_lettered, expired, failed]
    BreakerState:
      type: string
      enum: [closed, open, half_open]
    ObjectType:
      type: string
      enum: [vendor, vendor_endpoint, account, transformer, integration, tenant, api_key, registrar_endpoint, breaker, dlq, request, snapshot]
    Pagination:
      type: object
      required: [next_cursor]
      properties:
        next_cursor:
          type: [string, 'null']

    # ---------------- errors
    AdminErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/AdminError'
    AdminError:
      description: Same shape as the caller CanonicalError (`../schemas/events/canonical-error.json`), with the admin code superset and an optional `meta` object.
      type: object
      required: [code, message, retryable, request_id]
      properties:
        code:
          type: string
          enum:
            - VALIDATION_FAILED
            - UNAUTHORIZED
            - FORBIDDEN
            - NOT_FOUND
            - CONFLICT
            - PRECONDITION_FAILED
            - PUBLISH_VALIDATION_FAILED
            - RETIRE_BLOCKED
            - RATE_LIMITED
            - INTERNAL_ERROR
        message:
          type: string
        retryable:
          type: boolean
        retry_after_ms:
          type: [integer, 'null']
          minimum: 0
        details:
          type: array
          items:
            type: object
            required: [message]
            properties:
              pointer: { description: 'JSON pointer into the submitted document (the request body, or the integration spec for publish checks).', type: string }
              keyword: { description: 'Failing JSON Schema keyword, or the failing check name for PUBLISH_VALIDATION_FAILED.', type: string }
              message: { type: string }
              sample:
                description: Sample (golden fixture) name, for sample checks (`goldens_pass`, `endpoint_schema`, `input_schema`). Since 2.0.0.
                type: [string, 'null']
              field:
                description: |
                  JSON pointer of the offending field inside the checked object, for sample checks.
                  `endpoint_schema` and `goldens_pass`: the produced vendor request
                  `{path, query, headers, body}` (e.g. `/query/name`, `/body/d/0/identity`; `path` holds
                  the path parameters). `input_schema`: the sample input `{body, headers}` (e.g.
                  `/body/firstName`, `/headers/X-Request-Source`). Since 2.0.0.
                type: [string, 'null']
        meta:
          description: Code-specific structured data (e.g. `report` for PUBLISH_VALIDATION_FAILED, reference counts for RETIRE_BLOCKED).
          type: [object, 'null']
        request_id:
          $ref: '#/components/schemas/RequestIdValue'

    # ---------------- me
    Me:
      type: object
      required: [subject, roles, tenants, permissions]
      properties:
        subject: { type: string }
        email: { type: [string, 'null'] }
        name: { type: [string, 'null'] }
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
        tenants:
          description: Tenant scope for tenant_viewer. Empty means all tenants (non-tenant roles).
          type: array
          items:
            $ref: '#/components/schemas/Slug'
        permissions:
          description: Derived action permissions (`<area>:<action>`) for UI gating. The server always re-checks.
          type: array
          items: { type: string }
        token_expires_at:
          type: [string, 'null']
          format: date-time

    # ---------------- vendors
    AuthScheme:
      description: How the Hub authenticates to the vendor. `none` (since 2.0.0) is for public APIs; accounts of a `none` vendor have no credentials.
      type: string
      enum: [none, static_headers, bearer, basic, query_param, hmac_signing, oauth2_client_credentials, mtls]
    BreakerConfig:
      type: object
      properties:
        window_ms: { type: integer, minimum: 1000 }
        min_calls: { type: integer, minimum: 1 }
        failure_ratio: { type: number, minimum: 0, maximum: 1 }
        consecutive_timeouts: { type: integer, minimum: 1 }
        open_ms: { type: integer, minimum: 1000 }
        open_max_ms: { type: integer, minimum: 1000 }
        half_open_probes: { type: integer, minimum: 1 }
    VendorDefaults:
      type: object
      properties:
        rate_limit:
          type: object
          properties:
            per_account_rps: { type: number, minimum: 0 }
        breaker:
          $ref: '#/components/schemas/BreakerConfig'
        health_probe:
          type: object
          properties:
            endpoint: { $ref: '#/components/schemas/EndpointRefValue' }
            dry: { type: boolean }
            every_ms: { type: integer, minimum: 1000 }
    WebhookVerification:
      description: How inbound webhooks from this vendor are verified.
      type: object
      required: [scheme]
      properties:
        scheme:
          type: string
          enum: [none, hmac_sha256, basic, ip_allowlist]
        header: { type: string }
        max_skew_ms: { type: integer, minimum: 0 }
        ip_allowlist:
          type: array
          items: { type: string }
    VendorFields:
      type: object
      properties:
        display_name: { type: string, maxLength: 128 }
        auth_scheme: { $ref: '#/components/schemas/AuthScheme' }
        regions:
          description: Region code -> base URL. Egress allowlist.
          type: object
          minProperties: 1
          additionalProperties: { type: string, format: uri }
        defaults: { $ref: '#/components/schemas/VendorDefaults' }
        webhook_verification:
          oneOf:
            - $ref: '#/components/schemas/WebhookVerification'
            - type: 'null'
        docs_url: { type: [string, 'null'], format: uri }
    VendorCreate:
      allOf:
        - $ref: '#/components/schemas/VendorFields'
        - type: object
          required: [vendor_id, display_name, auth_scheme, regions, reason]
          properties:
            vendor_id: { $ref: '#/components/schemas/Slug' }
            reason: { $ref: '#/components/schemas/Reason' }
    VendorUpdate:
      allOf:
        - $ref: '#/components/schemas/VendorFields'
        - type: object
          required: [display_name, auth_scheme, regions, reason]
          properties:
            reason: { $ref: '#/components/schemas/Reason' }
    Vendor:
      allOf:
        - $ref: '#/components/schemas/VendorFields'
        - type: object
          required: [vendor_id, display_name, auth_scheme, regions, endpoints, revision, created_at, updated_at]
          properties:
            vendor_id: { $ref: '#/components/schemas/Slug' }
            endpoints:
              type: array
              items: { $ref: '#/components/schemas/VendorEndpoint' }
            revision: { type: integer, minimum: 1 }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
    VendorSummary:
      type: object
      required: [vendor_id, display_name, auth_scheme, regions, endpoint_count, account_count, revision, updated_at]
      properties:
        vendor_id: { $ref: '#/components/schemas/Slug' }
        display_name: { type: string }
        auth_scheme: { $ref: '#/components/schemas/AuthScheme' }
        regions:
          type: array
          items: { type: string }
        endpoint_count: { type: integer, minimum: 0 }
        account_count: { type: integer, minimum: 0 }
        revision: { type: integer, minimum: 1 }
        updated_at: { type: string, format: date-time }
    VendorList:
      allOf:
        - $ref: '#/components/schemas/Pagination'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/VendorSummary' }
    VendorChange:
      type: object
      required: [change_id, vendor]
      properties:
        change_id: { $ref: '#/components/schemas/ChangeId' }
        vendor: { $ref: '#/components/schemas/Vendor' }
    JsonSchemaDocument:
      description: |
        A JSON Schema 2020-12 document, as a JSON object. A field listed in `required` is required;
        every other declared field is optional. Annotations such as `x-pii` are allowed. The Hub
        compiles it; a document that does not compile is refused (or reported, for drafts).
      type: object
    EndpointRequestSchema:
      description: |
        The request a vendor endpoint version accepts (ADR-0023). Each key is optional; `{}` means the
        endpoint takes nothing besides its method and path. Request transformer samples are checked
        against it (`endpoint_schema`) at transformer creation and at integration validate/publish,
        never on live calls. Credential headers and query values set from `creds.*` are not part of
        the checked request: do not declare them.
      type: object
      properties:
        path:
          description: JSON Schema of the path parameters object (names from `{...}` in `path`).
          $ref: '#/components/schemas/JsonSchemaDocument'
        query:
          description: JSON Schema of the query parameters object.
          $ref: '#/components/schemas/JsonSchemaDocument'
        headers:
          description: JSON Schema of the non-credential headers object (header names as keys).
          $ref: '#/components/schemas/JsonSchemaDocument'
        body:
          description: JSON Schema of the body. Omit it for endpoints without a body.
          $ref: '#/components/schemas/JsonSchemaDocument'
    VendorEndpointFields:
      type: object
      properties:
        method: { type: string, enum: [GET, POST, PUT, PATCH, DELETE] }
        path: { type: string }
        timeout_ms: { type: integer, minimum: 1, default: 3000 }
        connect_timeout_ms: { type: integer, minimum: 1, default: 500 }
        idempotent: { type: boolean }
        batch_max: { type: [integer, 'null'], minimum: 1 }
        stream: { type: boolean, default: false }
        request_schema:
          description: Required on create and always returned (since 2.0.0).
          $ref: '#/components/schemas/EndpointRequestSchema'
        response_schema:
          description: Optional JSON Schema of the vendor's response body. Informational only (console, docs); never enforced. Null when not given. Since 2.0.0.
          type: [object, 'null']
    VendorEndpointCreate:
      allOf:
        - $ref: '#/components/schemas/VendorEndpointFields'
        - type: object
          required: [name, method, path, idempotent, request_schema, reason]
          properties:
            name: { type: string, pattern: '^[a-z][a-z0-9_]{0,63}$' }
            reason: { $ref: '#/components/schemas/Reason' }
    VendorEndpoint:
      allOf:
        - $ref: '#/components/schemas/VendorEndpointFields'
        - type: object
          required: [endpoint_ref, name, version, method, path, timeout_ms, connect_timeout_ms, idempotent, request_schema, created_at]
          properties:
            endpoint_ref: { $ref: '#/components/schemas/EndpointRefValue' }
            name: { type: string }
            version: { type: integer, minimum: 1 }
            created_at: { type: string, format: date-time }
    VendorEndpointList:
      allOf:
        - $ref: '#/components/schemas/Pagination'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/VendorEndpoint' }
    VendorEndpointChange:
      type: object
      required: [change_id, endpoint]
      properties:
        change_id: { $ref: '#/components/schemas/ChangeId' }
        endpoint: { $ref: '#/components/schemas/VendorEndpoint' }

    # ---------------- accounts
    AccountState:
      type: string
      enum: [active, draining, retired]
    CredentialSlot:
      description: Metadata of one credential version. Secrets are never returned.
      type: object
      required: [slot, cred_version, fingerprint, created_at]
      properties:
        slot: { type: string, enum: [active, next, previous] }
        cred_version: { type: integer, minimum: 1 }
        fingerprint: { description: 'Truncated SHA-256 of the ciphertext, for identification only.', type: string }
        created_at: { type: string, format: date-time }
        expires_at: { type: [string, 'null'], format: date-time }
    Credentials:
      description: Secret values (scheme-specific keys). Write-only. Never echoed or logged. Empty only for accounts of an auth `none` vendor (`AccountCreate`).
      type: object
      writeOnly: true
      additionalProperties: { type: string }
    AccountQuota:
      type: object
      properties:
        rps: { type: number, minimum: 0 }
        daily: { type: [integer, 'null'], minimum: 0 }
    Account:
      type: object
      required: [account_id, vendor_id, region, state, config, quota, credentials, integrations_using, pinned_requests, open_sessions, created_at, updated_at]
      properties:
        account_id: { $ref: '#/components/schemas/Slug' }
        vendor_id: { $ref: '#/components/schemas/Slug' }
        region: { type: string }
        state: { $ref: '#/components/schemas/AccountState' }
        config:
          description: Non-secret config (`account.config.*` in transformers).
          type: object
        quota: { $ref: '#/components/schemas/AccountQuota' }
        credentials:
          type: array
          items: { $ref: '#/components/schemas/CredentialSlot' }
        integrations_using:
          type: array
          items:
            type: object
            required: [integration_id, version, role]
            properties:
              integration_id: { $ref: '#/components/schemas/Slug' }
              version: { type: integer }
              role: { type: string, enum: [target, failover, shadow] }
        pinned_requests: { description: 'Queued requests pinned to this account (pending: pinned) or bound to its vendor sessions.', type: integer, minimum: 0 }
        open_sessions: { type: integer, minimum: 0 }
        dead_letter_count:
          description: Dead-lettered requests whose last attempt used this account, not yet replayed and still within retention (14 days). Computed from the DLQ store; may lag by up to a minute. Since 1.1.0.
          type: integer
          minimum: 0
          example: 1
        dead_letter_oldest_at:
          description: When the oldest of those entries was dead-lettered; `null` when there are none. Since 1.1.0.
          type: [string, 'null']
          format: date-time
          example: '2026-10-31T11:02:40Z'
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AccountSummary:
      type: object
      required: [account_id, vendor_id, region, state, active_cred_version, integrations_using, updated_at]
      properties:
        account_id: { $ref: '#/components/schemas/Slug' }
        vendor_id: { $ref: '#/components/schemas/Slug' }
        region: { type: string }
        state: { $ref: '#/components/schemas/AccountState' }
        active_cred_version: { type: [integer, 'null'] }
        next_cred_version: { type: [integer, 'null'] }
        credential_expires_at: { type: [string, 'null'], format: date-time }
        integrations_using: { type: integer, minimum: 0 }
        breaker_states:
          type: object
          properties:
            open: { type: integer }
            half_open: { type: integer }
            closed: { type: integer }
        dead_letter_count:
          description: Dead-lettered requests whose last attempt used this account, not yet replayed and still within retention (14 days). Computed from the DLQ store; may lag by up to a minute. Since 1.1.0.
          type: integer
          minimum: 0
          example: 1
        dead_letter_oldest_at:
          description: When the oldest of those entries was dead-lettered; `null` when there are none. Since 1.1.0.
          type: [string, 'null']
          format: date-time
          example: '2026-10-31T11:02:40Z'
        updated_at: { type: string, format: date-time }
    AccountList:
      allOf:
        - $ref: '#/components/schemas/Pagination'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/AccountSummary' }
    AccountCreate:
      type: object
      required: [account_id, vendor_id, region, config, reason]
      properties:
        account_id: { $ref: '#/components/schemas/Slug' }
        vendor_id: { $ref: '#/components/schemas/Slug' }
        region: { type: string }
        config: { type: object }
        quota: { $ref: '#/components/schemas/AccountQuota' }
        credentials:
          description: |
            Initial credentials (the `active` slot, cred version 1). Required, with at least one key,
            unless the vendor's auth scheme is `none`. For `none` it must be omitted or `{}`.
            400 `VALIDATION_FAILED` (pointer `/credentials`) otherwise. Optional in the schema since
            2.0.0.
          $ref: '#/components/schemas/Credentials'
        credential_expires_at: { type: [string, 'null'], format: date-time }
        reason: { $ref: '#/components/schemas/Reason' }
    AccountUpdate:
      type: object
      required: [reason]
      properties:
        config: { description: 'Merge-patch into config (null removes a key).', type: object }
        quota: { $ref: '#/components/schemas/AccountQuota' }
        reason: { $ref: '#/components/schemas/Reason' }
    AccountChange:
      type: object
      required: [change_id, account]
      properties:
        change_id: { $ref: '#/components/schemas/ChangeId' }
        account: { $ref: '#/components/schemas/Account' }
    ConnectionTestRequest:
      type: object
      properties:
        slot: { type: string, enum: [active, next], default: active }
        endpoint_ref: { description: 'Defaults to the vendor health-probe endpoint.', $ref: '#/components/schemas/EndpointRefValue' }
    ConnectionTestResult:
      type: object
      required: [ok, slot, cred_version, checked_at]
      properties:
        ok: { type: boolean }
        slot: { type: string, enum: [active, next] }
        cred_version: { type: integer }
        endpoint_ref: { $ref: '#/components/schemas/EndpointRefValue' }
        upstream_status: { type: [integer, 'null'] }
        latency_ms: { type: [integer, 'null'], minimum: 0 }
        error_code: { type: [string, 'null'] }
        message: { type: [string, 'null'] }
        checked_at: { type: string, format: date-time }
    CredentialAddNext:
      type: object
      required: [credentials, reason]
      properties:
        credentials:
          description: At least one key. Accounts of an auth `none` vendor have no credentials (409 `CONFLICT`).
          $ref: '#/components/schemas/Credentials'
          minProperties: 1
        expires_at: { type: [string, 'null'], format: date-time }
        reason: { $ref: '#/components/schemas/Reason' }
    CredentialPromote:
      type: object
      required: [expected_next_version, reason]
      properties:
        expected_next_version: { type: integer, minimum: 1 }
        reason: { $ref: '#/components/schemas/Reason' }
    CredentialDeleteOld:
      type: object
      required: [expected_previous_version, reason]
      properties:
        expected_previous_version: { type: integer, minimum: 1 }
        reason: { $ref: '#/components/schemas/Reason' }
    CredentialSlotsChange:
      type: object
      required: [change_id, account_id, credentials]
      properties:
        change_id: { $ref: '#/components/schemas/ChangeId' }
        account_id: { $ref: '#/components/schemas/Slug' }
        credentials:
          type: array
          items: { $ref: '#/components/schemas/CredentialSlot' }
    LifecycleTransition:
      type: object
      required: [target_state, reason]
      properties:
        target_state: { $ref: '#/components/schemas/AccountState' }
        reason: { $ref: '#/components/schemas/Reason' }

    # ---------------- transformers
    TransformerKind:
      type: string
      enum: [request, response, inbound]
    GoldenFixture:
      description: |
        One sample (golden fixture, DESIGN §7.6; the field keeps its historical name `fixtures`).
        Samples prove a transformer before it can be stored or published.

        * Request transformers: `input` (the caller's JSON body) + optional `input_headers` (the
          caller headers, read as `hdr.*`) + `expected_request` (the vendor request the transformer
          must produce: `method`, `path` (the resolved path), and optional `query`, `headers`
          (non-credential headers only) and `body`). The produced request must equal
          `expected_request` (check `goldens_pass`) and fit the vendor endpoint's `request_schema`
          (check `endpoint_schema`). At integration validate and publish, `input` and
          `input_headers` must also fit the operation's `request_schema` (check `input_schema`).
        * Response transformers: `vendor_response` (`status`, `headers`, `body`) + `expected_response`
          (the transformer's output) or `expected_error` (a canonical error from its `errors` rules).
      type: object
      required: [name]
      properties:
        name: { type: string, pattern: '^[a-z0-9][a-z0-9_-]{0,63}$' }
        input: { description: 'Caller body (request samples).', type: object }
        input_headers:
          description: Caller headers (request samples), header name -> value. Optional. Since 2.0.0.
          type: object
          additionalProperties: { type: string }
        account_config: { description: 'Non-secret account config injected as `account.config`.', type: object }
        expected_request: { description: 'Expected vendor request (request samples): method, path, query, headers, body. Credentials are never part of it.', type: object }
        vendor_response: { description: 'Vendor response (response samples): status, headers, body.', type: object }
        expected_response: { description: 'Expected transformer output (response samples).', type: object }
        expected_error: { description: 'Expected canonical error (response samples).', type: object }
    GoldensSummary:
      type: object
      required: [passed, total, failed]
      properties:
        passed: { type: boolean }
        total: { type: integer, minimum: 0 }
        failed: { type: integer, minimum: 0 }
    SchemaViolation:
      description: One JSON Schema violation found by a sample check (since 2.0.0).
      type: object
      required: [field, message]
      properties:
        field: { description: 'JSON pointer of the field in the checked object (produced request `{path, query, headers, body}`, or sample input `{body, headers}`).', type: string }
        keyword: { description: 'Failing JSON Schema keyword (e.g. `required`, `type`, `minLength`).', type: string }
        message: { type: string }
    TransformerVersion:
      type: object
      required: [transformer_id, version, ref, kind, vendor_endpoint, yaml, fixtures, goldens, author, reason, created_at]
      properties:
        transformer_id: { $ref: '#/components/schemas/TransformerIdValue' }
        version: { type: integer, minimum: 1 }
        ref: { $ref: '#/components/schemas/TransformerRef' }
        kind: { $ref: '#/components/schemas/TransformerKind' }
        vendor_endpoint:
          description: The endpoint a request (or inbound) transformer targets. Null for response transformers.
          oneOf:
            - $ref: '#/components/schemas/VendorEndpointRef'
            - type: 'null'
        yaml: { description: 'Transformer DSL source (DESIGN §7).', type: string }
        fixtures:
          description: The samples.
          type: array
          items: { $ref: '#/components/schemas/GoldenFixture' }
        docs_url: { type: [string, 'null'], format: uri }
        goldens: { $ref: '#/components/schemas/GoldensSummary' }
        author: { type: string }
        reason: { type: string }
        created_at: { type: string, format: date-time }
    TransformerVersionSummary:
      type: object
      required: [transformer_id, version, ref, author, reason, created_at, goldens_passed]
      properties:
        transformer_id: { $ref: '#/components/schemas/TransformerIdValue' }
        version: { type: integer }
        ref: { $ref: '#/components/schemas/TransformerRef' }
        author: { type: string }
        reason: { type: string }
        created_at: { type: string, format: date-time }
        goldens_passed: { type: boolean }
    TransformerVersionList:
      allOf:
        - $ref: '#/components/schemas/Pagination'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/TransformerVersionSummary' }
    TransformerSummary:
      type: object
      required: [transformer_id, kind, vendor_endpoint, latest_version, used_by_active_versions, updated_at]
      properties:
        transformer_id: { $ref: '#/components/schemas/TransformerIdValue' }
        kind: { $ref: '#/components/schemas/TransformerKind' }
        vendor_endpoint:
          description: Null for response transformers.
          oneOf:
            - $ref: '#/components/schemas/VendorEndpointRef'
            - type: 'null'
        latest_version: { type: integer }
        used_by_active_versions: { type: integer, minimum: 0 }
        updated_at: { type: string, format: date-time }
    Transformer:
      allOf:
        - $ref: '#/components/schemas/TransformerSummary'
        - type: object
          required: [latest]
          properties:
            latest: { $ref: '#/components/schemas/TransformerVersion' }
    TransformerList:
      allOf:
        - $ref: '#/components/schemas/Pagination'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/TransformerSummary' }
    TransformerVersionCreate:
      description: |
        `vendor_endpoint` is required for `kind: request` (and `inbound`) and must be absent or null
        for `kind: response`; 400 `VALIDATION_FAILED` (pointer `/vendor_endpoint`) otherwise. At
        least one sample is required for every kind.
      type: object
      required: [kind, yaml, fixtures, reason]
      properties:
        kind: { $ref: '#/components/schemas/TransformerKind' }
        vendor_endpoint:
          description: '`<vendor_id>.<endpoint name>@<version>`. Required for request (and inbound) transformers; absent or null for response transformers.'
          oneOf:
            - $ref: '#/components/schemas/VendorEndpointRef'
            - type: 'null'
        expected_latest_version: { description: 'Omit or null for a new transformer id.', type: [integer, 'null'] }
        yaml: { type: string, minLength: 1 }
        fixtures:
          description: The samples (at least one).
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/GoldenFixture' }
        docs_url: { type: [string, 'null'], format: uri }
        reason: { $ref: '#/components/schemas/Reason' }
    TransformerVersionChange:
      type: object
      required: [change_id, transformer_version]
      properties:
        change_id: { $ref: '#/components/schemas/ChangeId' }
        transformer_version: { $ref: '#/components/schemas/TransformerVersion' }
    TransformerDraft:
      description: Unsaved transformer. `vendor_endpoint` follows the same rule as in `TransformerVersionCreate`.
      type: object
      required: [kind, yaml]
      properties:
        kind: { $ref: '#/components/schemas/TransformerKind' }
        vendor_endpoint:
          oneOf:
            - $ref: '#/components/schemas/VendorEndpointRef'
            - type: 'null'
        yaml: { type: string }
    TransformerDryRunRequest:
      description: Exactly one of `ref` or `draft`.
      type: object
      properties:
        ref: { $ref: '#/components/schemas/TransformerRef' }
        draft: { $ref: '#/components/schemas/TransformerDraft' }
        account_id: { description: 'Account whose non-secret config and credentials (redacted) are injected.', $ref: '#/components/schemas/Slug' }
        input: { description: 'Caller body (request transformers).', type: object }
        input_headers: { description: 'Caller headers (`hdr.*`, request transformers). Replaces `headers` (2.0.0).', type: object, additionalProperties: { type: string } }
        session: { type: object }
        vendor_response:
          description: Vendor response (response transformers).
          type: object
          properties:
            status: { type: integer }
            headers: { type: object, additionalProperties: { type: string } }
            body: {}
    VendorRequestPreview:
      type: object
      required: [method, url, headers]
      properties:
        method: { type: string }
        url: { type: string }
        headers: { type: object, additionalProperties: { type: string } }
        body: {}
    TransformerDryRunResult:
      type: object
      required: [ok, kind, compile_errors]
      properties:
        ok: { type: boolean }
        kind: { $ref: '#/components/schemas/TransformerKind' }
        vendor_request:
          oneOf:
            - $ref: '#/components/schemas/VendorRequestPreview'
            - type: 'null'
        canonical_response: { description: 'Response transformer output, exactly what the caller would receive.', type: [object, 'null'] }
        canonical_error: { description: 'Canonical error produced by the response transformer `errors` rules.', type: [object, 'null'] }
        schema_errors:
          description: Request transformers only. Violations of the vendor endpoint's `request_schema` by the produced request (empty when it fits, or for other kinds). Since 2.0.0.
          type: array
          items: { $ref: '#/components/schemas/SchemaViolation' }
        compile_errors:
          type: array
          items:
            type: object
            required: [message]
            properties:
              path: { type: string }
              line: { type: integer }
              message: { type: string }
        duration_us: { type: integer, minimum: 0 }
    GoldensRunRequest:
      description: Exactly one of `ref` or (`draft` + `fixtures`).
      type: object
      properties:
        ref: { $ref: '#/components/schemas/TransformerRef' }
        draft: { $ref: '#/components/schemas/TransformerDraft' }
        fixtures:
          description: The samples to run with the draft.
          type: array
          items: { $ref: '#/components/schemas/GoldenFixture' }
    GoldensRunResult:
      type: object
      required: [passed, total, failed, results]
      properties:
        passed: { type: boolean }
        total: { type: integer }
        failed: { type: integer }
        results:
          type: array
          items:
            type: object
            required: [fixture, passed, diff]
            properties:
              fixture: { description: 'Sample name.', type: string }
              passed: { type: boolean }
              diff:
                description: Differences between the produced output and the expected one (`goldens_pass`).
                type: array
                items: { $ref: '#/components/schemas/DiffOp' }
              schema_errors:
                description: Request samples only. Violations of the vendor endpoint's `request_schema` by the produced request (`endpoint_schema`). Since 2.0.0.
                type: array
                items: { $ref: '#/components/schemas/SchemaViolation' }
              error: { type: [string, 'null'] }
        duration_ms: { type: integer, minimum: 0 }

    # ---------------- integrations
    OperationRequestSchema:
      description: |
        The caller's input for one operation (ADR-0023). Built in the console from a pasted sample,
        each field marked required or optional.
      type: object
      required: [body]
      properties:
        body:
          description: |
            JSON Schema 2020-12 of the caller's JSON body. Required for every operation; use
            `{type: object}` when a call has no fields. Fields listed in `required` are required,
            every other field is optional. `x-pii` tags (see contracts/README.md) drive audit masking
            and sealing. Request transformers read the body as `req.*`.
          $ref: '#/components/schemas/JsonSchemaDocument'
        headers:
          description: |
            Optional JSON Schema 2020-12 of the caller headers object (header names as keys, matched
            case-insensitively). It is the allowlist of caller headers the request transformer may
            read as `hdr.*`; other caller headers are not visible to it. The Hub's own headers
            (`Authorization`, `Idempotency-Key`, `Prefer`, `X-Request-Deadline`, `X-Hub-Session`,
            `traceparent`) can never be declared here.
          $ref: '#/components/schemas/JsonSchemaDocument'
    IntegrationOperation:
      description: One operation callers invoke. Part of the integration version, so a change goes through draft, validate, publish, diff and the change log.
      type: object
      required: [idempotent, request_schema]
      properties:
        description: { description: 'Caller-facing description (shown in discovery). No vendor, account or version in it.', type: [string, 'null'], maxLength: 1024 }
        idempotent:
          description: Repeating the operation has no extra side effect. Allows an immediate sync retry on timeout and `failover` without an `Idempotency-Key` (DESIGN §5.3, §10.2).
          type: boolean
        validate_input:
          description: |
            `true` (default): live calls are checked against `request_schema` (body and headers)
            before anything else runs, and a mismatch gives 400 `VALIDATION_FAILED` with one
            `details[]` entry per violation. `false`: live calls are not checked (the samples are
            still checked at publish). The Hub always returns the effective value.
          type: boolean
          default: true
        request_schema: { $ref: '#/components/schemas/OperationRequestSchema' }
    IntegrationOperations:
      description: Operation name -> definition. At least one. Single-operation integrations use the key `default`.
      type: object
      minProperties: 1
      propertyNames: { $ref: '#/components/schemas/OperationName' }
      additionalProperties: { $ref: '#/components/schemas/IntegrationOperation' }
    TransformerPair:
      description: |
        The request and response transformers a target uses for one operation (or, as `transformer`,
        for every operation not listed in `operations`). `request` is required and names a `request`
        transformer. `response` is optional: omitted or null means pass-through (the caller gets the
        vendor's status and body unchanged, with only `Content-Type` and `Retry-After` vendor
        headers, see hub-public). When set, it names a `response` transformer whose output is
        returned to the caller unchanged, without a schema check.
      type: object
      required: [request]
      properties:
        request: { $ref: '#/components/schemas/TransformerRef' }
        response:
          description: Response transformer, or null for pass-through. Optional since 2.0.0.
          oneOf:
            - $ref: '#/components/schemas/TransformerRef'
            - type: 'null'
    TargetRef:
      type: object
      required: [vendor_id, account_id, transformer]
      properties:
        vendor_id: { $ref: '#/components/schemas/Slug' }
        account_id: { $ref: '#/components/schemas/Slug' }
        transformer:
          description: Default pair. Used for every operation in `spec.operations` that the target's `operations` does not list (for a single-operation integration, the only pair).
          $ref: '#/components/schemas/TransformerPair'
        operations:
          description: |
            Optional per-operation pairs for an integration whose operations go to different vendor
            endpoints (e.g. an OTP flow with `generate` and `verify`). Keys are operation names
            declared in `spec.operations`. The pair of a listed operation replaces `transformer` for
            that operation, both request and response; operations not listed use `transformer`. The
            same selection applies wherever the target is used: weighted targets, the failover chain,
            shadow, sync/wait/async delivery, session steps and dry-run. Omit it for single-operation
            integrations. Listing every operation is allowed; `transformer` is still required and
            must still reference existing transformers. Validation and publish fail check
            `operations_have_transformers` (pointer `/targets/<i>/operations/<operation>`;
            `/failover/<i>/...` and `/shadow/target/...` likewise) for a key that `spec.operations`
            does not declare. Added in 1.2.0.
          type: object
          minProperties: 1
          propertyNames: { $ref: '#/components/schemas/OperationName' }
          additionalProperties: { $ref: '#/components/schemas/TransformerPair' }
        params: { description: 'Target-level parameters (e.g. LLM `model`).', type: object }
    Target:
      allOf:
        - $ref: '#/components/schemas/TargetRef'
        - type: object
          required: [weight]
          properties:
            weight: { type: integer, minimum: 0, maximum: 100 }
    DeliveryPolicy:
      type: object
      required: [mode]
      properties:
        mode: { $ref: '#/components/schemas/DeliveryMode' }
        wait_ms: { type: [integer, 'null'], minimum: 0, default: 3000 }
        ttl_ms: { description: 'How long an accepted request may wait for delivery. Omitted or null: the Hub default TTL.', type: [integer, 'null'], minimum: 0 }
        on_circuit_open: { type: string, enum: [fail_fast, failover, queue_if_allowed], default: fail_fast }
        pending: { type: string, enum: [re_resolve, pinned], default: re_resolve }
        retry:
          type: object
          properties:
            schedule_ms:
              type: array
              items: { type: integer, minimum: 0 }
            max_attempts: { type: integer, minimum: 1 }
    BreakerOverride:
      type: object
      properties:
        override:
          type: object
          properties:
            open_after_consecutive_timeouts: { type: integer, minimum: 1 }
            failure_ratio: { type: number, minimum: 0, maximum: 1 }
            min_calls: { type: integer, minimum: 1 }
    WebhookSubscription:
      type: object
      required: [event, endpoint_id]
      properties:
        event: { type: string, enum: [request.completed, request.failed, request.expired, delivery.status] }
        endpoint_id: { $ref: '#/components/schemas/Slug' }
    AuditPolicy:
      type: object
      required: [payloads]
      properties:
        payloads: { type: string, enum: [full, masked, sealed, metadata_only], default: masked }
        retention_ms: { type: [integer, 'null'], minimum: 0 }
    ShadowPolicy:
      description: Shadow traffic. The result is logged, never returned. `dry_run` only transforms (for vendors with side effects).
      type: object
      required: [target, mode]
      properties:
        target: { $ref: '#/components/schemas/TargetRef' }
        mode: { type: string, enum: [send, dry_run] }
        sample_ratio: { type: number, minimum: 0, maximum: 1, default: 1 }
    IntegrationSpec:
      description: Content of an integration version (DESIGN §3.4, ADR-0023). Durations are in ms.
      type: object
      required: [operations, targets, delivery, audit]
      properties:
        operations:
          description: The operations callers invoke, each with the caller's `request_schema`. Required since 2.0.0.
          $ref: '#/components/schemas/IntegrationOperations'
        targets:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/Target' }
        failover:
          type: array
          items: { $ref: '#/components/schemas/TargetRef' }
        delivery: { $ref: '#/components/schemas/DeliveryPolicy' }
        breaker: { $ref: '#/components/schemas/BreakerOverride' }
        webhooks:
          type: array
          items: { $ref: '#/components/schemas/WebhookSubscription' }
        audit: { $ref: '#/components/schemas/AuditPolicy' }
        shadow:
          oneOf:
            - $ref: '#/components/schemas/ShadowPolicy'
            - type: 'null'
    IntegrationVersionState:
      type: string
      enum: [draft, published]
    IntegrationVersion:
      type: object
      required: [integration_id, version, state, spec, author, reason, created_at]
      properties:
        integration_id: { $ref: '#/components/schemas/Slug' }
        version: { type: integer, minimum: 1 }
        state: { $ref: '#/components/schemas/IntegrationVersionState' }
        spec: { $ref: '#/components/schemas/IntegrationSpec' }
        based_on: { type: [integer, 'null'] }
        copied_from_version: { description: 'Set on rollback / weights versions.', type: [integer, 'null'] }
        author: { type: string }
        reason: { type: string }
        created_at: { type: string, format: date-time }
        published_at: { type: [string, 'null'], format: date-time }
        published_by: { type: [string, 'null'] }
        snapshot_version: { type: [integer, 'null'] }
    IntegrationVersionSummary:
      type: object
      required: [integration_id, version, state, author, reason, created_at, is_active]
      properties:
        integration_id: { $ref: '#/components/schemas/Slug' }
        version: { type: integer }
        state: { $ref: '#/components/schemas/IntegrationVersionState' }
        based_on: { type: [integer, 'null'] }
        author: { type: string }
        reason: { type: string }
        created_at: { type: string, format: date-time }
        published_at: { type: [string, 'null'], format: date-time }
        is_active: { type: boolean }
    IntegrationVersionList:
      allOf:
        - $ref: '#/components/schemas/Pagination'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/IntegrationVersionSummary' }
    IntegrationVersionChange:
      type: object
      required: [change_id, integration_version]
      properties:
        change_id: { $ref: '#/components/schemas/ChangeId' }
        integration_version: { $ref: '#/components/schemas/IntegrationVersion' }
    Integration:
      type: object
      required: [integration_id, owner_tenant, grants, interactive, moves_money_or_quota, active_version, latest_version, has_draft, paused, created_at, updated_at]
      properties:
        integration_id: { $ref: '#/components/schemas/Slug' }
        owner_tenant: { $ref: '#/components/schemas/Slug' }
        description: { type: [string, 'null'] }
        grants:
          description: Other tenants allowed to invoke.
          type: array
          items: { $ref: '#/components/schemas/Slug' }
        interactive:
          description: The operations are steps of one session a person is waiting on (`X-Hub-Session`). Only `sync` delivery is allowed. Set at creation and never changed. Since 2.0.0.
          type: boolean
        moves_money_or_quota:
          description: Requires Idempotency-Key from callers and confirmation in MCP tools.
          type: boolean
        active_version: { type: [integer, 'null'] }
        latest_version: { type: [integer, 'null'] }
        has_draft: { type: boolean }
        paused: { type: boolean }
        paused_reason: { type: [string, 'null'] }
        active:
          description: Active version in full (detail view). Null in mutation responses and when there is none.
          oneOf:
            - $ref: '#/components/schemas/IntegrationVersion'
            - type: 'null'
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    IntegrationSummary:
      type: object
      required: [integration_id, owner_tenant, interactive, operations, active_version, latest_version, has_draft, paused, targets, updated_at]
      properties:
        integration_id: { $ref: '#/components/schemas/Slug' }
        owner_tenant: { $ref: '#/components/schemas/Slug' }
        description: { type: [string, 'null'] }
        interactive: { description: 'See `Integration.interactive`. Since 2.0.0.', type: boolean }
        operations:
          description: Operation names of the active version (empty when there is none). Since 2.0.0.
          type: array
          items: { $ref: '#/components/schemas/OperationName' }
        active_version: { type: [integer, 'null'] }
        latest_version: { type: [integer, 'null'] }
        has_draft: { type: boolean }
        paused: { type: boolean }
        delivery_mode:
          oneOf:
            - $ref: '#/components/schemas/DeliveryMode'
            - type: 'null'
        targets:
          type: array
          items:
            type: object
            required: [vendor_id, account_id, weight]
            properties:
              vendor_id: { $ref: '#/components/schemas/Slug' }
              account_id: { $ref: '#/components/schemas/Slug' }
              weight: { type: integer }
        updated_at: { type: string, format: date-time }
    IntegrationList:
      allOf:
        - $ref: '#/components/schemas/Pagination'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/IntegrationSummary' }
    IntegrationCreate:
      type: object
      required: [integration_id, owner_tenant, reason]
      properties:
        integration_id: { $ref: '#/components/schemas/Slug' }
        owner_tenant: { $ref: '#/components/schemas/Slug' }
        description: { type: [string, 'null'], maxLength: 1024 }
        grants:
          type: array
          items: { $ref: '#/components/schemas/Slug' }
        interactive:
          description: Operations are steps of one session using `X-Hub-Session`; only `sync` delivery is allowed. Cannot be changed later. Since 2.0.0.
          type: boolean
          default: false
        moves_money_or_quota: { type: boolean, default: false }
        reason: { $ref: '#/components/schemas/Reason' }
    IntegrationUpdate:
      type: object
      required: [reason]
      properties:
        description: { type: [string, 'null'], maxLength: 1024 }
        grants:
          type: array
          items: { $ref: '#/components/schemas/Slug' }
        moves_money_or_quota: { type: boolean }
        reason: { $ref: '#/components/schemas/Reason' }
    IntegrationChange:
      type: object
      required: [change_id, integration]
      properties:
        change_id: { $ref: '#/components/schemas/ChangeId' }
        integration: { $ref: '#/components/schemas/Integration' }
    IntegrationDraftCreate:
      type: object
      required: [reason]
      properties:
        based_on: { description: 'Version to start from. Defaults to the active version.', type: [integer, 'null'] }
        spec: { $ref: '#/components/schemas/IntegrationSpec' }
        reason: { $ref: '#/components/schemas/Reason' }
    IntegrationDraftUpdate:
      type: object
      required: [spec, reason]
      properties:
        spec: { $ref: '#/components/schemas/IntegrationSpec' }
        reason: { $ref: '#/components/schemas/Reason' }
    ValidationCheck:
      type: object
      required: [check, status]
      properties:
        check:
          description: |
            Known: schemas_compile, expressions_typecheck, goldens_pass, input_schema (2.0.0),
            endpoint_schema (2.0.0), references_exist, accounts_not_retired, interactive_sync_only,
            weights_sum_100, delivery_path_declared, failover_requires_idempotency,
            supports_features, operations_have_transformers (1.2.0). `response_conforms` was removed
            in 2.0.0 (response transformer output is not checked against a schema). Clients must
            tolerate unknown check names.
          type: string
        status: { type: string, enum: [pass, fail, warn, skipped] }
        message: { type: [string, 'null'] }
        pointer: { description: 'JSON pointer into the submitted document (the spec, or the TransformerVersionCreate body).', type: [string, 'null'] }
        sample: { description: 'Sample (golden fixture) name, for goldens_pass, endpoint_schema and input_schema. Since 2.0.0.', type: [string, 'null'] }
        field: { description: 'JSON pointer of the offending field in the checked object (see AdminError details `field`). Since 2.0.0.', type: [string, 'null'] }
    ValidationReport:
      type: object
      required: [valid, checks]
      properties:
        valid: { type: boolean }
        checks:
          type: array
          items: { $ref: '#/components/schemas/ValidationCheck' }
    PublishRequest:
      type: object
      required: [expected_active_version, reason]
      properties:
        expected_active_version: { description: 'null when publishing the first version.', type: [integer, 'null'] }
        reason: { $ref: '#/components/schemas/Reason' }
    RollbackRequest:
      type: object
      required: [to_version, expected_active_version, reason]
      properties:
        to_version: { type: integer, minimum: 1 }
        expected_active_version: { type: integer, minimum: 1 }
        reason: { $ref: '#/components/schemas/Reason' }
    WeightsUpdate:
      type: object
      required: [expected_active_version, weights, reason]
      properties:
        expected_active_version: { type: integer, minimum: 1 }
        weights:
          type: array
          minItems: 1
          items:
            type: object
            required: [vendor_id, account_id, weight]
            properties:
              vendor_id: { $ref: '#/components/schemas/Slug' }
              account_id: { $ref: '#/components/schemas/Slug' }
              weight: { type: integer, minimum: 0, maximum: 100 }
        publish: { type: boolean, default: true }
        reason: { $ref: '#/components/schemas/Reason' }
    PublishResult:
      type: object
      required: [change_id, integration_id, active_version]
      properties:
        change_id: { $ref: '#/components/schemas/ChangeId' }
        integration_id: { $ref: '#/components/schemas/Slug' }
        previous_active_version: { type: [integer, 'null'] }
        active_version: { description: 'Active version after the call (unchanged if a weights draft was not published).', type: [integer, 'null'] }
        created_version: { description: 'Version created by rollback/weights (equals active_version when published).', type: [integer, 'null'] }
        copied_from_version: { type: [integer, 'null'] }
        snapshot_version: { type: [integer, 'null'] }
        published_at: { type: [string, 'null'], format: date-time }
    DiffOp:
      type: object
      required: [op, path]
      properties:
        op: { type: string, enum: [add, remove, replace] }
        path: { description: 'JSON pointer.', type: string }
        before: {}
        after: {}
    VersionDiff:
      type: object
      required: [integration_id, from, to, changes, unified]
      properties:
        integration_id: { $ref: '#/components/schemas/Slug' }
        from: { type: integer }
        to: { type: integer }
        changes:
          type: array
          items: { $ref: '#/components/schemas/DiffOp' }
        unified: { description: 'Unified diff of the YAML renderings.', type: string }

    # ---------------- tenants
    RateLimit:
      type: object
      properties:
        rps: { type: number, minimum: 0 }
        burst: { type: integer, minimum: 0 }
    Tenant:
      type: object
      required: [tenant_id, display_name, disabled, rate_limit, integrations_owned, active_api_keys, created_at, updated_at]
      properties:
        tenant_id: { $ref: '#/components/schemas/Slug' }
        display_name: { type: string }
        description: { type: [string, 'null'] }
        contact: { type: [string, 'null'] }
        rate_limit: { $ref: '#/components/schemas/RateLimit' }
        disabled: { type: boolean }
        integrations_owned: { type: integer, minimum: 0 }
        active_api_keys: { type: integer, minimum: 0 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    TenantSummary:
      type: object
      required: [tenant_id, display_name, disabled, integrations_owned, active_api_keys, updated_at]
      properties:
        tenant_id: { $ref: '#/components/schemas/Slug' }
        display_name: { type: string }
        disabled: { type: boolean }
        integrations_owned: { type: integer }
        active_api_keys: { type: integer }
        updated_at: { type: string, format: date-time }
    TenantList:
      allOf:
        - $ref: '#/components/schemas/Pagination'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/TenantSummary' }
    TenantCreate:
      type: object
      required: [tenant_id, display_name, reason]
      properties:
        tenant_id: { $ref: '#/components/schemas/Slug' }
        display_name: { type: string, maxLength: 128 }
        description: { type: [string, 'null'] }
        contact: { type: [string, 'null'] }
        rate_limit: { $ref: '#/components/schemas/RateLimit' }
        reason: { $ref: '#/components/schemas/Reason' }
    TenantUpdate:
      type: object
      required: [reason]
      properties:
        display_name: { type: string, maxLength: 128 }
        description: { type: [string, 'null'] }
        contact: { type: [string, 'null'] }
        rate_limit: { $ref: '#/components/schemas/RateLimit' }
        disabled: { type: boolean }
        reason: { $ref: '#/components/schemas/Reason' }
    TenantChange:
      type: object
      required: [change_id, tenant]
      properties:
        change_id: { $ref: '#/components/schemas/ChangeId' }
        tenant: { $ref: '#/components/schemas/Tenant' }

    # ---------------- api keys
    ApiKeyState:
      type: string
      enum: [active, expiring, revoked, expired]
    ApiKeyScope:
      type: string
      pattern: '^(invoke|dry_run|requests_read)(:[A-Za-z0-9][A-Za-z0-9_-]{2,63})?$'
    ApiKey:
      type: object
      required: [key_id, tenant_id, prefix, scopes, state, created_at]
      properties:
        key_id: { $ref: '#/components/schemas/KeyIdValue' }
        tenant_id: { $ref: '#/components/schemas/Slug' }
        prefix: { description: 'First 12 characters of the secret, for identification.', type: string }
        description: { type: [string, 'null'] }
        scopes:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/ApiKeyScope' }
        state: { $ref: '#/components/schemas/ApiKeyState' }
        created_at: { type: string, format: date-time }
        expires_at: { type: [string, 'null'], format: date-time }
        last_used_at: { type: [string, 'null'], format: date-time }
        replaced_by:
          oneOf:
            - $ref: '#/components/schemas/KeyIdValue'
            - type: 'null'
    ApiKeyList:
      allOf:
        - $ref: '#/components/schemas/Pagination'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/ApiKey' }
    ApiKeyCreate:
      type: object
      required: [tenant_id, scopes, reason]
      properties:
        tenant_id: { $ref: '#/components/schemas/Slug' }
        description: { type: [string, 'null'] }
        scopes:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/ApiKeyScope' }
        expires_at: { type: [string, 'null'], format: date-time }
        reason: { $ref: '#/components/schemas/Reason' }
    ApiKeyChange:
      type: object
      required: [change_id, api_key]
      properties:
        change_id: { $ref: '#/components/schemas/ChangeId' }
        api_key: { $ref: '#/components/schemas/ApiKey' }
    ApiKeySecretChange:
      type: object
      required: [change_id, api_key, secret]
      properties:
        change_id: { $ref: '#/components/schemas/ChangeId' }
        api_key: { $ref: '#/components/schemas/ApiKey' }
        secret: { description: 'Shown exactly once.', type: string, pattern: '^hk_(live|test)_[A-Za-z0-9]{28,}$' }
    ApiKeyRotate:
      type: object
      required: [overlap_ms, reason]
      properties:
        overlap_ms: { type: integer, minimum: 0, maximum: 2592000000 }
        reason: { $ref: '#/components/schemas/Reason' }
    ApiKeyRotateResult:
      type: object
      required: [change_id, old_key, api_key, secret]
      properties:
        change_id: { $ref: '#/components/schemas/ChangeId' }
        old_key: { $ref: '#/components/schemas/ApiKey' }
        api_key: { $ref: '#/components/schemas/ApiKey' }
        secret: { description: 'Shown exactly once.', type: string, pattern: '^hk_(live|test)_[A-Za-z0-9]{28,}$' }

    # ---------------- registrar endpoints
    RegistrarEndpoint:
      type: object
      required: [endpoint_id, tenant_id, url, disabled, secret_version, subscribed_by, created_at, updated_at]
      properties:
        endpoint_id: { $ref: '#/components/schemas/Slug' }
        tenant_id: { $ref: '#/components/schemas/Slug' }
        url: { type: string, format: uri }
        description: { type: [string, 'null'] }
        disabled: { type: boolean }
        secret_version: { type: integer, minimum: 1 }
        secret_overlap_until: { description: 'While set, callbacks are signed with both the new and old secrets.', type: [string, 'null'], format: date-time }
        subscribed_by: { description: 'Number of active/draft integration versions subscribing.', type: integer, minimum: 0 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    RegistrarEndpointList:
      allOf:
        - $ref: '#/components/schemas/Pagination'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/RegistrarEndpoint' }
    RegistrarEndpointCreate:
      type: object
      required: [endpoint_id, tenant_id, url, reason]
      properties:
        endpoint_id: { $ref: '#/components/schemas/Slug' }
        tenant_id: { $ref: '#/components/schemas/Slug' }
        url: { type: string, format: uri, pattern: '^https://' }
        description: { type: [string, 'null'] }
        reason: { $ref: '#/components/schemas/Reason' }
    RegistrarEndpointUpdate:
      type: object
      required: [reason]
      properties:
        url: { type: string, format: uri, pattern: '^https://' }
        description: { type: [string, 'null'] }
        disabled: { type: boolean }
        reason: { $ref: '#/components/schemas/Reason' }
    RegistrarEndpointChange:
      type: object
      required: [change_id, endpoint]
      properties:
        change_id: { $ref: '#/components/schemas/ChangeId' }
        endpoint: { $ref: '#/components/schemas/RegistrarEndpoint' }
    RegistrarEndpointSecretChange:
      type: object
      required: [change_id, endpoint, signing_secret]
      properties:
        change_id: { $ref: '#/components/schemas/ChangeId' }
        endpoint: { $ref: '#/components/schemas/RegistrarEndpoint' }
        signing_secret: { description: 'Shown exactly once.', type: string, pattern: '^whsec_[A-Za-z0-9]{26,}$' }
    SecretRotate:
      type: object
      required: [overlap_ms, reason]
      properties:
        overlap_ms: { type: integer, minimum: 0, maximum: 2592000000 }
        reason: { $ref: '#/components/schemas/Reason' }

    # ---------------- snapshots
    Snapshot:
      type: object
      required: [version, checksum, author, created_at, blob_url]
      properties:
        version: { type: integer, minimum: 1 }
        checksum: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        author: { type: string }
        change_id:
          oneOf:
            - $ref: '#/components/schemas/ChangeId'
            - type: 'null'
        summary: { type: [string, 'null'] }
        size_bytes: { type: integer, minimum: 0 }
        created_at: { type: string, format: date-time }
        blob_url: { description: 'Relative URL of the blob (getSnapshotBlob).', type: string }
    SnapshotDetail:
      allOf:
        - $ref: '#/components/schemas/Snapshot'
        - type: object
          required: [previous_version, changed_objects]
          properties:
            previous_version: { type: [integer, 'null'] }
            changed_objects:
              type: array
              items:
                type: object
                required: [object_type, object_id, change]
                properties:
                  object_type: { $ref: '#/components/schemas/ObjectType' }
                  object_id: { type: string }
                  change: { type: string, enum: [created, updated, deleted] }
    SnapshotList:
      allOf:
        - $ref: '#/components/schemas/Pagination'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/Snapshot' }

    # ---------------- requests
    Timings:
      type: object
      properties:
        total_ms: { type: integer, minimum: 0 }
        hub_overhead_ms: { type: integer, minimum: 0 }
        vendor_ms: { type: integer, minimum: 0 }
        queue_wait_ms: { type: integer, minimum: 0 }
    RequestSummary:
      type: object
      required: [request_id, tenant_id, integration_id, operation, mode, status, attempts, created_at]
      properties:
        request_id: { $ref: '#/components/schemas/RequestIdValue' }
        tenant_id: { $ref: '#/components/schemas/Slug' }
        integration_id: { $ref: '#/components/schemas/Slug' }
        operation: { $ref: '#/components/schemas/OperationName' }
        mode: { $ref: '#/components/schemas/DeliveryMode' }
        status: { $ref: '#/components/schemas/RequestState' }
        code: { description: 'Final canonical error code, if any.', type: [string, 'null'] }
        final_version: { description: 'Integration version of the last attempt.', type: [integer, 'null'] }
        vendor_id: { type: [string, 'null'] }
        account_id: { type: [string, 'null'] }
        attempts: { type: integer, minimum: 0 }
        created_at: { type: string, format: date-time }
        completed_at: { type: [string, 'null'], format: date-time }
        duration_ms: { type: [integer, 'null'], minimum: 0 }
        hub_overhead_ms: { type: [integer, 'null'], minimum: 0 }
    RequestSummaryList:
      allOf:
        - $ref: '#/components/schemas/Pagination'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/RequestSummary' }
    RequestDetail:
      allOf:
        - $ref: '#/components/schemas/RequestSummary'
        - type: object
          required: [payload_policy, sealed]
          properties:
            idempotency_key: { type: [string, 'null'] }
            expires_at: { type: [string, 'null'], format: date-time }
            next_attempt_at: { type: [string, 'null'], format: date-time }
            payload_policy: { type: string, enum: [full, masked, sealed, metadata_only] }
            sealed: { type: boolean }
            timings: { $ref: '#/components/schemas/Timings' }
            result: { description: 'Response body returned to the caller (response transformer output, or the vendor body in pass-through), subject to the payload policy. Null until succeeded.' }
            error: { description: 'Canonical error object (public CanonicalError shape).', type: [object, 'null'] }
            snapshot_version: { type: [integer, 'null'] }
            trace_id: { type: [string, 'null'] }
    TimelineEventType:
      type: string
      enum:
        - request.received
        - request.validated
        - integration.resolved
        - idempotency.checked
        - request.transformed
        - policy.applied
        - request.persisted
        - request.accepted
        - request.parked
        - vendor.sent
        - vendor.responded
        - response.transformed
        - response.transform_failed
        - callback.delivered
        - request.completed
        - request.failed
        - request.expired
    TimelineEvent:
      type: object
      required: [seq, type, at, sha256, bytes, sealed, truncated]
      properties:
        seq: { type: integer, minimum: 1 }
        type: { $ref: '#/components/schemas/TimelineEventType' }
        at: { type: string, format: date-time }
        attempt_no: { type: [integer, 'null'] }
        payload: { description: 'Event payload per policy (masked values are hashed). Null when sealed or metadata_only.', type: [object, 'null'] }
        payload_ref: { description: 'Object-storage reference when the payload exceeded 64 KB.', type: [string, 'null'] }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        bytes: { type: integer, minimum: 0 }
        sealed: { type: boolean }
        truncated: { type: boolean }
    RequestTimeline:
      type: object
      required: [request_id, payload_policy, events]
      properties:
        request_id: { $ref: '#/components/schemas/RequestIdValue' }
        payload_policy: { type: string, enum: [full, masked, sealed, metadata_only] }
        events:
          type: array
          items: { $ref: '#/components/schemas/TimelineEvent' }
    Attempt:
      type: object
      required: [attempt_no, integration_version, vendor_id, account_id, endpoint_ref, started_at]
      properties:
        attempt_no: { type: integer, minimum: 1 }
        integration_version: { type: integer }
        vendor_id: { $ref: '#/components/schemas/Slug' }
        account_id: { $ref: '#/components/schemas/Slug' }
        endpoint_ref: { $ref: '#/components/schemas/EndpointRefValue' }
        served_by: { type: string, pattern: '^(primary|failover:[1-9][0-9]*|shadow)$' }
        started_at: { type: string, format: date-time }
        duration_ms: { type: [integer, 'null'], minimum: 0 }
        vendor_status: { type: [integer, 'null'] }
        error_code: { type: [string, 'null'] }
        breaker_state:
          oneOf:
            - $ref: '#/components/schemas/BreakerState'
            - type: 'null'
        cred_version: { type: [integer, 'null'] }
    AttemptList:
      type: object
      required: [request_id, items]
      properties:
        request_id: { $ref: '#/components/schemas/RequestIdValue' }
        items:
          type: array
          items: { $ref: '#/components/schemas/Attempt' }
    UnsealRequest:
      type: object
      required: [reason]
      properties:
        event_seqs:
          type: array
          items: { type: integer, minimum: 1 }
        reason: { type: string, minLength: 10, maxLength: 1024 }
    UnsealResult:
      type: object
      required: [change_id, request_id, events]
      properties:
        change_id: { $ref: '#/components/schemas/ChangeId' }
        request_id: { $ref: '#/components/schemas/RequestIdValue' }
        events:
          type: array
          items: { $ref: '#/components/schemas/TimelineEvent' }

    # ---------------- dlq
    DeadLetter:
      type: object
      required: [request_id, tenant_id, integration_id, reason, attempts, dead_lettered_at, expires_at]
      properties:
        request_id: { $ref: '#/components/schemas/RequestIdValue' }
        tenant_id: { $ref: '#/components/schemas/Slug' }
        integration_id: { $ref: '#/components/schemas/Slug' }
        vendor_id: { type: [string, 'null'] }
        account_id: { type: [string, 'null'] }
        reason: { description: 'Canonical error code, or `poison`.', type: string }
        message: { type: [string, 'null'] }
        attempts: { type: integer, minimum: 0 }
        dead_lettered_at: { type: string, format: date-time }
        replayed_at: { type: [string, 'null'], format: date-time }
        expires_at: { type: string, format: date-time }
    DeadLetterDetail:
      allOf:
        - $ref: '#/components/schemas/DeadLetter'
        - type: object
          required: [canonical, attempt_history]
          properties:
            canonical: { description: 'Canonical payload (per policy).', type: [object, 'null'] }
            last_vendor_request: { type: [object, 'null'] }
            last_vendor_response: { type: [object, 'null'] }
            attempt_history:
              type: array
              items: { $ref: '#/components/schemas/Attempt' }
    DeadLetterList:
      allOf:
        - $ref: '#/components/schemas/Pagination'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/DeadLetter' }
    DlqFilter:
      type: object
      properties:
        tenant_id: { $ref: '#/components/schemas/Slug' }
        integration_id: { $ref: '#/components/schemas/Slug' }
        vendor_id: { $ref: '#/components/schemas/Slug' }
        account_id: { $ref: '#/components/schemas/Slug' }
        reason: { type: string }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        replayed: { type: boolean }
    DlqReplayRequest:
      description: Exactly one of `request_ids` or `filter`.
      type: object
      required: [reason]
      properties:
        request_ids:
          type: array
          minItems: 1
          maxItems: 1000
          items: { $ref: '#/components/schemas/RequestIdValue' }
        filter: { $ref: '#/components/schemas/DlqFilter' }
        dry_run: { type: boolean, default: false }
        reason: { $ref: '#/components/schemas/Reason' }
    DlqPurgeRequest:
      description: Exactly one of `request_ids` or `filter`.
      type: object
      required: [reason]
      properties:
        request_ids:
          type: array
          minItems: 1
          maxItems: 1000
          items: { $ref: '#/components/schemas/RequestIdValue' }
        filter: { $ref: '#/components/schemas/DlqFilter' }
        dry_run: { type: boolean, default: false }
        reason: { $ref: '#/components/schemas/Reason' }
    DlqBulkResult:
      type: object
      required: [matched, affected, truncated, dry_run]
      properties:
        change_id:
          description: Null for dry runs.
          oneOf:
            - $ref: '#/components/schemas/ChangeId'
            - type: 'null'
        matched: { type: integer, minimum: 0 }
        affected: { type: integer, minimum: 0 }
        truncated: { type: boolean }
        dry_run: { type: boolean }

    # ---------------- breakers
    Breaker:
      type: object
      required: [account_id, endpoint_ref, vendor_id, state, forced, updated_at]
      properties:
        account_id: { $ref: '#/components/schemas/Slug' }
        endpoint_ref: { $ref: '#/components/schemas/EndpointRefValue' }
        vendor_id: { $ref: '#/components/schemas/Slug' }
        state: { $ref: '#/components/schemas/BreakerState' }
        forced: { type: string, enum: [none, open, closed] }
        forced_until: { type: [string, 'null'], format: date-time }
        failure_ratio: { type: number, minimum: 0, maximum: 1 }
        window_calls: { type: integer, minimum: 0 }
        consecutive_timeouts: { type: integer, minimum: 0 }
        opened_at: { type: [string, 'null'], format: date-time }
        open_until: { type: [string, 'null'], format: date-time }
        reopen_count: { type: integer, minimum: 0 }
        parked_count: { type: integer, minimum: 0 }
        parked_oldest_age_ms: { type: [integer, 'null'], minimum: 0 }
        updated_at: { type: string, format: date-time }
    BreakerDetail:
      allOf:
        - $ref: '#/components/schemas/Breaker'
        - type: object
          required: [config, transitions, integrations]
          properties:
            config: { $ref: '#/components/schemas/BreakerConfig' }
            transitions:
              type: array
              items:
                type: object
                required: [at, from, to, cause]
                properties:
                  at: { type: string, format: date-time }
                  from: { $ref: '#/components/schemas/BreakerState' }
                  to: { $ref: '#/components/schemas/BreakerState' }
                  cause: { type: string, enum: [failure_ratio, consecutive_timeouts, open_elapsed, probe_failed, probes_succeeded, forced, force_cleared] }
                  actor: { type: [string, 'null'] }
            last_probe:
              type: [object, 'null']
              properties:
                at: { type: string, format: date-time }
                ok: { type: boolean }
                status: { type: [integer, 'null'] }
                latency_ms: { type: [integer, 'null'] }
            integrations:
              type: array
              items: { $ref: '#/components/schemas/Slug' }
    BreakerList:
      allOf:
        - $ref: '#/components/schemas/Pagination'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/Breaker' }
    BreakerForceOpen:
      type: object
      required: [reason]
      properties:
        duration_ms: { description: 'Auto-clear after this long. Null means until cleared.', type: [integer, 'null'], minimum: 1000, maximum: 86400000 }
        reason: { $ref: '#/components/schemas/Reason' }
    BreakerForceClose:
      type: object
      required: [reason]
      properties:
        duration_ms: { description: 'Auto-clear after this long. Null means until cleared.', type: [integer, 'null'], minimum: 1000, maximum: 86400000 }
        reason: { $ref: '#/components/schemas/Reason' }
    BreakerChange:
      type: object
      required: [change_id, breaker]
      properties:
        change_id: { $ref: '#/components/schemas/ChangeId' }
        breaker: { $ref: '#/components/schemas/Breaker' }

    # ---------------- change log
    ChangeLogSummary:
      type: object
      required: [change_id, at, actor, action, object_type, object_id, reason]
      properties:
        change_id: { $ref: '#/components/schemas/ChangeId' }
        at: { type: string, format: date-time }
        actor: { type: string }
        actor_roles:
          type: array
          items: { $ref: '#/components/schemas/Role' }
        action: { description: 'operationId of the mutation.', type: string }
        object_type: { $ref: '#/components/schemas/ObjectType' }
        object_id: { type: string }
        reason: { type: string }
        snapshot_version: { description: 'Snapshot produced by this change, if any.', type: [integer, 'null'] }
    ChangeLogEntry:
      allOf:
        - $ref: '#/components/schemas/ChangeLogSummary'
        - type: object
          required: [before, after]
          properties:
            before: { type: [object, 'null'] }
            after: { type: [object, 'null'] }
    ChangeLogList:
      allOf:
        - $ref: '#/components/schemas/Pagination'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/ChangeLogSummary' }
