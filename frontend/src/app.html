<!doctype html>
<html lang="en" data-theme="light">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="light dark" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<script>
			// Apply the saved theme before first paint (no light flash in dark mode).
			// Keep the key and logic in sync with src/lib/stores/theme.svelte.ts.
			(function () {
				var pref = 'system';
				try {
					pref = localStorage.getItem('hub-console:theme') || 'system';
				} catch (e) {}
				var dark =
					pref === 'dark' ||
					(pref !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
				document.documentElement.dataset.theme = dark ? 'dark' : 'light';
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
