  /integrations/{integration_id}/weights:
    parameters:
      - $ref: '#/components/parameters/IntegrationId'
    post:
      operationId: updateIntegrationWeights
      tags: [integrations]
      x-required-role: editor
      summary: Change target weights (creates a new version)
      description: |
        A shortcut for gradual cutover. It copies the active version, applies the new weights (targets
        are matched by `vendor_id` + `account_id`, and the set must equal the active version's targets),
        and creates version `n+1`. With `publish: true` (default) it also publishes. Otherwise it is
        left as a draft. Weights must sum to 100.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WeightsUpdate'
            example:
              expected_active_version: 8
              weights:
                - { vendor_id: clevertap, account_id: ct-brandA-in, weight: 50 }
                - { vendor_id: clevertap, account_id: ct-brandA-in-v2, weight: 50 }
              publish: true
              reason: Canary healthy for 24 h, go 50/50
      responses:
        '200':
          description: New version created (and published if requested).
