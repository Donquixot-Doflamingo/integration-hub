# EXAMPLE ONLY (HUB-342). Fictional vendor "demo-kyc" (see DEMO-BANK-REQ@1 for the invented shape).
# The vendor's 0-100 name score becomes a yes/no name_match at 80; callers never see the score.
transformer: DEMO-BANK-RES
version: 1
kind: response
capability: demo.bank_account_verify@v1
response:
  account_status: 'res.body.result == "VALID" ? "valid" : "invalid"'
  name_at_bank:   res.body.beneficiary_name
  name_match:     'res.body.name_match_score == nil ? nil : res.body.name_match_score >= 80'
  vendor_ref:     res.body.ref
errors:
  - when: res.status == 401 || res.status == 403
    code: UPSTREAM_AUTH_FAILED
    retryable: false
  - when: res.status == 429
    code: UPSTREAM_RATE_LIMITED
    retryable: true
    retry_after_ms: int(header(res, "Retry-After") ?? "1") * 1000
  - when: res.status >= 500
    code: UPSTREAM_UNAVAILABLE
    retryable: true
  - when: res.status >= 400
    code: UPSTREAM_REJECTED
    retryable: false
    message: res.body.message
