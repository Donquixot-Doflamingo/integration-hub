# EXAMPLE ONLY (HUB-351). Aadhaar OKYC step 1 on Cashfree Secure ID, checked on 2026-11-07 against
# https://www.cashfree.com/docs/api-reference/vrs/v2/aadhaar/generate-otp-to-verify-aadhaar
# (operation VrsOfflineAadhaarSendOtp, AGENTS §3.3):
#   POST {base}/offline-aadhaar/otp   headers x-client-id, x-client-secret (x-cf-signature optional)
#   body {"aadhaar_number": "<12 digits>"}
#   200 {"status": "SUCCESS" | "INVALID", "message", "ref_id"}; errors {"type", "code", "message", "error"?}
# consent and purpose stay in the Hub (sealed audit): the provider's API has no field for them.
transformer: CF-OKYC-OTP-REQ
version: 1
kind: request
docs_url: https://www.cashfree.com/docs/api-reference/vrs/v2/aadhaar/generate-otp-to-verify-aadhaar
vendor_endpoint: cashfree-sid.okyc_otp@1
request:
  method: POST
  path: /offline-aadhaar/otp
  headers:
    Content-Type:    '"application/json"'
    X-Client-Id:     creds.client_id
    X-Client-Secret: creds.client_secret
  body:
    aadhaar_number: req.aadhaar_number
