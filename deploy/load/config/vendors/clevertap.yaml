# Load-test overlay (deploy/load/run.sh copies backend/config, then this directory on top).
# Same vendor as dev, pointed at the load mockvendor (:28799) with a vendor rate limit high
# enough that the Hub, not a quota, is what the load test measures. Breaker settings are the
# dev/production defaults on purpose: the soak exercises them.
vendor: clevertap
auth: static_headers
regions:
  in: http://127.0.0.1:28799
  us: http://127.0.0.1:28799
endpoints:
  upload@1: { method: POST, path: /1/upload, timeout_ms: 3000, connect_timeout_ms: 500, idempotent: true, batch_max: 1000, request_schema: {} }
defaults:
  rate_limit: { per_account_rps: 100000 }
  breaker: { window_s: 30, min_calls: 20, failure_ratio: 0.5, consecutive_timeouts: 5, open_s: 30, open_max_s: 600, half_open_probes: 3 }
  health_probe: { endpoint: upload@1, dry: true, every_s: 30 }
