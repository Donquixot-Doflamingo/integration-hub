        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of keys.
          headers:
            X-Hub-Request-Id:
              $ref: '#/components/headers/X-Hub-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyList'
              example:
                items:
                  - { key_id: key_01J9Z7F6G7H8J9K0M1N2P3Q4RS, tenant_id: orders-service, prefix: hk_live_7Qm2, description: orders prod, scopes: [invoke], state: active, created_at: '2026-10-01T10:00:00Z', expires_at: null, last_used_at: '2026-10-31T09:14:59Z', replaced_by: null }
