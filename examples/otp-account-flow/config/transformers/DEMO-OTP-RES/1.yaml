# EXAMPLE ONLY (HUB-342). Fictional vendor "demo-kyc" (see DEMO-OTP-REQ@1 for the invented shape).
# On a successful step 1 the session: section keeps ONLY the vendor txn id; the Hub stores it for
# 10 minutes, pinned to this version and account (DESIGN §14). Later steps never open a session.
# Wrong or expired OTPs map to UPSTREAM_REJECTED with a fixed, vendor-neutral message.
transformer: DEMO-OTP-RES
version: 1
kind: response
capability: demo.mobile_otp@v1
response:
  status:       'res.body.status == "OTP_SENT" ? "otp_sent" : "verified"'
  expires_in_s: res.body.expires_in
  vendor_ref:   res.body.ref
session:
  vendor_txn_id: res.body.txn_id
errors:
  - when: res.status == 401 || res.status == 403
    code: UPSTREAM_AUTH_FAILED
    retryable: false
  - when: res.status == 429
    code: UPSTREAM_RATE_LIMITED
    retryable: true
    retry_after_ms: int(header(res, "Retry-After") ?? "1") * 1000
  - when: res.status >= 500
    code: UPSTREAM_UNAVAILABLE
    retryable: true
  - when: 'res.status == 422 && res.body.error == "OTP_MISMATCH"'
    code: UPSTREAM_REJECTED
    retryable: false
    message: '"The OTP does not match"'
  - when: 'res.status == 422 && res.body.error == "OTP_EXPIRED"'
    code: UPSTREAM_REJECTED
    retryable: false
    message: '"The OTP has expired; request a new one"'
  - when: res.status >= 400
    code: UPSTREAM_REJECTED
    retryable: false
