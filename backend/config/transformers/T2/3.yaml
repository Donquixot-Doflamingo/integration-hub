# CleverTap Upload Events API, checked against https://developer.clevertap.com/docs/upload-events-api on 2026-10-31 (AGENTS §3.3):
# POST /1/upload, headers X-CleverTap-Account-Id + X-CleverTap-Passcode, body {"d": [records]},
# record = identity, type "event", evtName, evtData (object), ts (epoch seconds); max 1000 records.
# Response {"status", "processed", "unprocessed": [{"status", "code", "error", "record"}]}.
# Dev only: regions point at mockvendor. Goldens in fixtures/ (hubctl transform test).
# T2 = T1 + brand and campaign inside the event (shape change, DESIGN §3.3).
transformer: T2
version: 3
kind: request
docs_url: https://developer.clevertap.com/docs/upload-events-api
vendor_endpoint: clevertap.upload@1
request:
  method: POST
  path: /1/upload
  headers:
    X-CleverTap-Account-Id: creds.account_id
    X-CleverTap-Passcode:   creds.passcode
    Content-Type:           '"application/json; charset=utf-8"'
  body:
    d:
      - identity: req.user.id
        type:     '"event"'
        evtName:  req.event.name
        ts:       epochSeconds(req.event.timestamp ?? now())
        # A multi-line expression with "key: value" pairs must be a block scalar to be valid YAML.
        evtData: >-
          merge(req.event.properties, {
            brand:    account.config.brand_code,
            campaign: req.context.campaign ?? "organic" })
batch: { path: d, max: 1000 }
