    post:
      operationId: createIntegrationDraft
      tags: [integrations]
      x-required-role: editor
      summary: Create a draft version
      description: |
        Creates draft version `n+1` from a full spec. Omit `spec` to copy `based_on` (default is the
        active version). Drafts are editable until published. Only one draft may exist at a time
        (409 `CONFLICT`).

        Since 2.0.0 the spec carries `operations` (required, at least one): the operation names
        callers invoke (`default` for a single-operation integration) and, per operation, the
        caller's `request_schema` (`body`, optional `headers`), `idempotent` and `validate_input`.
        A draft is stored even when a schema does not compile or a sample does not fit it; those
        problems are reported by `validateIntegrationVersion` and block `publishIntegrationVersion`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntegrationDraftCreate'
            examples:
              canary:
                summary: Weighted canary (single operation `default`, one pair per target)
                value:
                  based_on: 7
                  spec:
                    operations:
                      default:
                        description: Track a single event for a user.
                        idempotent: true
                        validate_input: true
                        request_schema:
                          body:
                            type: object
                            required: [user, event]
                            properties:
                              user: { type: object, required: [id], properties: { id: { type: string, x-pii: identifier } } }
                              event: { type: object, required: [name], properties: { name: { type: string }, timestamp: { type: string, format: date-time }, properties: { type: object, x-pii: free_text } } }
                              context: { type: object, properties: { campaign: { type: string } } }
                          headers: { type: object, properties: { X-Request-Source: { type: string } } }
                    targets:
                      - { vendor_id: clevertap, account_id: ct-brandA-in, transformer: { request: T1@7, response: R1@2 }, weight: 90 }
                      - { vendor_id: clevertap, account_id: ct-brandA-in-v2, transformer: { request: T1@8, response: R1@2 }, weight: 10 }
                    failover: []
                    delivery: { mode: wait, wait_ms: 3000, ttl_ms: 21600000, on_circuit_open: queue_if_allowed, pending: re_resolve }
                    breaker: { override: { open_after_consecutive_timeouts: 3 } }
                    webhooks: [ { event: delivery.status, endpoint_id: reg_orders_cb } ]
                    audit: { payloads: masked, retention_ms: 2592000000 }
                  reason: Canary 10% to the new workspace
              per_operation:
                summary: Two operations (generate and verify on different vendor endpoints)
                description: |
                  Draft for an interactive OTP integration. `transformer` is the default pair (used by
                  `generate`); `operations.verify` gives `verify` its own pair.
                value:
                  spec:
                    operations:
                      generate:
                        description: Send an OTP to the mobile number linked to the Aadhaar number.
                        idempotent: false
                        validate_input: true
                        request_schema:
                          body: { type: object, required: [aadhaar_number], properties: { aadhaar_number: { type: string, pattern: '^[0-9]{12}$', x-pii: government_id } } }
                      verify:
                        description: Verify the OTP and return the e-KYC result.
                        idempotent: false
                        validate_input: true
                        request_schema:
                          body: { type: object, required: [otp], properties: { otp: { type: string, pattern: '^[0-9]{6}$', x-pii: free_text } } }
                    targets:
                      - vendor_id: kycdemo
                        account_id: kycdemo-in
                        transformer: { request: AOTP_GEN@1, response: AOTP_GEN_R@1 }
                        operations:
                          verify: { request: AOTP_VER@1, response: AOTP_VER_R@1 }
                        weight: 100
                    failover: []
                    delivery: { mode: sync, on_circuit_open: fail_fast, pending: re_resolve }
                    webhooks: []
                    audit: { payloads: sealed, retention_ms: 7776000000 }
                  reason: Verify OTP through its own vendor endpoint
              pass_through:
                summary: Caller headers in the schema, no response transformer
                description: |
                  `request_schema.body` lists `firstName` and `lastName` as required;
                  `X-Request-Source` is an optional caller header the request transformer may read as
