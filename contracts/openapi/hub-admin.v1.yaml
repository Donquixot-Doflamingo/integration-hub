  /requests/{request_id}/attempts:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    get:
      operationId: listRequestAttempts
      tags: [requests]
      x-required-role: tenant_viewer
      summary: Upstream attempts of a request
      description: One row per attempt. Each records the integration version it used (DESIGN §6.3).
      responses:
        '200':
          description: Attempts.
          headers:
            X-Hub-Request-Id:
              $ref: '#/components/headers/X-Hub-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttemptList'
              example:
                request_id: req_01J9Z3K8X2V7Q4M6N8P0R2S4T6
                items:
                  - { attempt_no: 1, integration_version: 7, vendor_id: clevertap, account_id: ct-brandA-in, endpoint_ref: upload@1, served_by: primary, started_at: '2026-10-31T09:15:00.003Z', duration_ms: 211, vendor_status: 200, error_code: null, breaker_state: closed, cred_version: 3 }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /requests/{request_id}/unseal:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    post:
      operationId: unsealRequest
      tags: [requests]
      x-required-role: admin
      summary: Unseal sealed payloads (audited)
      description: |
        Decrypts sealed payloads of the selected events (all events if `event_seqs` is omitted) and
        returns them in this response only. Nothing is stored decrypted. It always writes a
        `change_log` entry with the reason. The reason must be at least 10 characters and should
        cite a ticket. A request that is not sealed gives 409 `CONFLICT`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnsealRequest'
            example:
              event_seqs: [1, 4]
              reason: 'Customer dispute SUP-4411: verify bureau response'
      responses:
        '200':
          description: Unsealed events.
          headers:
            X-Hub-Request-Id:
              $ref: '#/components/headers/X-Hub-Request-Id'
            Cache-Control:
              description: Always `no-store`.
              schema:
                type: string
              example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnsealResult'
              example:
                change_id: chg_01J9Z4B2C3D4E5F6G7H8J9K0NK
                request_id: req_01J9Z3K8X2V7Q4M6N8P0R2S4T8
                events:
                  - { seq: 1, type: request.received, at: '2026-10-31T09:20:00Z', payload: { body: { pan: ABCDE1234F } }, payload_ref: null, sha256: 3a7bd3e2360a3d29eea436fcfb7e44c735d117c42d1c1835420b6b9942dd4f1b, bytes: 31, sealed: false, truncated: false }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  # ------------------------------------------------------------------ dlq
  /dlq:
    get:
      operationId: listDeadLetters
      tags: [dlq]
      x-required-role: tenant_viewer
      summary: List dead-lettered requests
      description: Kept for 14 days. Newest first.
      parameters:
        - $ref: '#/components/parameters/TenantFilter'
        - name: integration_id
          in: query
          description: Filter by integration.
          schema:
            $ref: '#/components/schemas/Slug'
          example: int_evt_brandA
        - name: vendor_id
          in: query
          description: Filter by vendor.
          schema:
            $ref: '#/components/schemas/Slug'
          example: clevertap
        - name: account_id
          in: query
          description: Filter by account.
          schema:
            $ref: '#/components/schemas/Slug'
          example: ct-brandA-in
        - name: reason
          in: query
          description: Filter by dead-letter reason (canonical error code or `poison`).
          schema:
            type: string
          example: UPSTREAM_REJECTED
        - name: replayed
          in: query
          description: Filter by whether the entry was already replayed.
          schema:
            type: boolean
          example: false
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of DLQ entries.
          headers:
            X-Hub-Request-Id:
              $ref: '#/components/headers/X-Hub-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeadLetterList'
              example:
                items:
                  - { request_id: req_01J9Z3M1A5B7C9D1E3F5G7H9JK, tenant_id: orders-service, integration_id: int_evt_brandA, vendor_id: clevertap, account_id: ct-brandA-in, reason: UPSTREAM_REJECTED, message: event name must not contain spaces, attempts: 1, dead_lettered_at: '2026-10-31T11:02:40Z', replayed_at: null, expires_at: '2026-11-14T11:02:40Z' }
                next_cursor: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /dlq/{request_id}:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    get:
      operationId: getDeadLetter
      tags: [dlq]
      x-required-role: tenant_viewer
      summary: Get a DLQ entry
      description: Includes the canonical payload, last vendor request and response (per payload policy), and attempt history.
      responses:
        '200':
          description: DLQ entry.
          headers:
            X-Hub-Request-Id:
              $ref: '#/components/headers/X-Hub-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeadLetterDetail'
              example:
                request_id: req_01J9Z3M1A5B7C9D1E3F5G7H9JK
                tenant_id: orders-service
                integration_id: int_evt_brandA
                vendor_id: clevertap
                account_id: ct-brandA-in
                reason: UPSTREAM_REJECTED
                message: event name must not contain spaces
                attempts: 1
                dead_lettered_at: '2026-10-31T11:02:40Z'
                replayed_at: null
                expires_at: '2026-11-14T11:02:40Z'
                canonical: { user: { id: 'hmac:7f1a' }, event: { name: order placed } }
                last_vendor_request: { method: POST, url: 'https://in1.api.clevertap.com/1/upload', headers: { X-CleverTap-Passcode: '***' } }
                last_vendor_response: { status: 400, body: { status: fail, error: E_INVALID_EVENT } }
                attempt_history:
                  - { attempt_no: 1, integration_version: 7, vendor_id: clevertap, account_id: ct-brandA-in, endpoint_ref: upload@1, served_by: primary, started_at: '2026-10-31T11:02:40Z', duration_ms: 140, vendor_status: 400, error_code: UPSTREAM_REJECTED, breaker_state: closed, cred_version: 3 }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /dlq/replay:
    post:
      operationId: replayDeadLetters
      tags: [dlq]
      x-required-role: editor
      summary: Replay DLQ entries by ids or by filter
      description: |
        Moves the matching entries back to `accepted`. They re-resolve and re-transform, so a
        transformer fix applies (DESIGN §10.6). Give exactly one of `request_ids` (≤ 1000) or
        `filter`. `dry_run: true` returns the match count without replaying. At most 10 000
        entries per call. `truncated: true` means call again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DlqReplayRequest'
            example:
              filter: { integration_id: int_evt_brandA, reason: UPSTREAM_REJECTED, from: '2026-10-31T00:00:00Z', to: '2026-10-31T12:00:00Z', replayed: false }
              dry_run: false
              reason: Fixed T1 event-name sanitising (T1@8)
      responses:
        '200':
          description: Replay result.
          headers:
            X-Hub-Request-Id:
              $ref: '#/components/headers/X-Hub-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DlqBulkResult'
              example:
                change_id: chg_01J9Z4B2C3D4E5F6G7H8J9K0NM
                matched: 42
                affected: 42
                truncated: false
                dry_run: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /dlq/purge:
    post:
      operationId: purgeDeadLetters
      tags: [dlq]
      x-required-role: admin
      summary: Purge DLQ entries by ids or by filter
      description: 'Permanently removes the DLQ entries. The request ledger and audit stay (retention rules apply). The same selection rules as replay apply. `dry_run: true` counts only.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DlqPurgeRequest'
            example:
              request_ids: [req_01J9Z3M1A5B7C9D1E3F5G7H9JK]
              dry_run: false
              reason: Test traffic from a misconfigured staging client
      responses:
        '200':
          description: Purge result.
          headers:
            X-Hub-Request-Id:
              $ref: '#/components/headers/X-Hub-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DlqBulkResult'
              example:
                change_id: chg_01J9Z4B2C3D4E5F6G7H8J9K0NP
                matched: 1
                affected: 1
                truncated: false
                dry_run: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  # ------------------------------------------------------------------ breakers
  /breakers:
    get:
      operationId: listBreakers
      tags: [breakers]
      x-required-role: viewer
      summary: List circuit breakers (per account + endpoint)
      description: The vendor health board. One row per `(account, endpoint)` that has seen traffic or is forced.
      parameters:
        - name: vendor_id
          in: query
          description: Filter by vendor.
          schema:
            $ref: '#/components/schemas/Slug'
          example: clevertap
        - name: account_id
          in: query
          description: Filter by account.
          schema:
            $ref: '#/components/schemas/Slug'
          example: ct-brandA-in
        - name: state
          in: query
          description: Filter by state.
          schema:
            $ref: '#/components/schemas/BreakerState'
          example: open
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of breakers.
          headers:
            X-Hub-Request-Id:
              $ref: '#/components/headers/X-Hub-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BreakerList'
              example:
                items:
                  - { account_id: ct-brandA-in, endpoint_ref: upload@1, vendor_id: clevertap, state: open, forced: none, failure_ratio: 0.82, window_calls: 57, consecutive_timeouts: 5, opened_at: '2026-10-31T09:40:00Z', open_until: '2026-10-31T09:41:00Z', reopen_count: 1, parked_count: 1290, parked_oldest_age_ms: 61000, updated_at: '2026-10-31T09:40:30Z' }
                next_cursor: null
        '400':
