  /transformers/dry-run:
    post:
      operationId: dryRunTransformer
      tags: [transformers]
      x-required-role: editor
      summary: Run a transformer (stored or draft) without sending anything
      description: |
        For a request transformer: canonical input -> exact vendor request (secrets redacted). For a
        response transformer: vendor response -> canonical response or canonical error. Give
        either `ref` (a stored version) or `draft` (unsaved YAML), not both. It is non-mutating.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransformerDryRunRequest'
            example:
              ref: T1@7
              account_id: ct-brandA-in
              input:
                user: { id: u_48213 }
                event: { name: order_placed, timestamp: '2026-10-31T09:15:00Z', properties: { order_id: ord_8821 } }
      responses:
        '200':
          description: Transformation output.
          headers:
