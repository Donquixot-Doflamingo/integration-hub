  /transformers/dry-run:
    post:
      operationId: dryRunTransformer
      tags: [transformers]
      x-required-role: editor
      summary: Run a transformer (stored or draft) without sending anything
      description: |
        For a request transformer: the caller's input (`input` body and `input_headers`) -> exact
        vendor request (secrets redacted). For a response transformer: vendor response -> its
        output, or a canonical error from its `errors` rules. Give either `ref` (a stored version) or
        `draft` (unsaved YAML), not both. It is non-mutating.

        For a request transformer the produced request is also checked against the vendor
        endpoint's `request_schema`. Violations are listed in `schema_errors` (the same check as
        `endpoint_schema` on samples). They do not make `ok` false here, because nothing is stored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransformerDryRunRequest'
            example:
              ref: T1@7
              account_id: ct-brandA-in
              input:
                user: { id: u_48213 }
                event: { name: order_placed, timestamp: '2026-10-31T09:15:00Z', properties: { order_id: ord_8821 } }
              input_headers: { X-Request-Source: checkout }
      responses:
