              interactive: false
              operations:
                default:
                  description: Track a single event for a user.
                  idempotent: true
                  request_schema: { $schema: 'https://json-schema.org/draft/2020-12/schema', type: object, required: [user, event] }
                  response_schema: { $schema: 'https://json-schema.org/draft/2020-12/schema', type: object, required: [status] }
