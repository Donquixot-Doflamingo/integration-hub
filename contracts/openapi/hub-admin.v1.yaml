              scopes: [invoke]
              expires_at: null
              reason: Initial production key
      responses:
        '201':
          description: Created. Store `secret` now. It cannot be retrieved again.
          headers:
            X-Hub-Request-Id:
              $ref: '#/components/headers/X-Hub-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeySecretChange'
              example:
                change_id: chg_01J9Z4B2C3D4E5F6G7H8J9K0NC
                api_key: { key_id: key_01J9Z7F6G7H8J9K0M1N2P3Q4RS, tenant_id: orders-service, prefix: hk_live_7Qm2, description: orders prod, scopes: [invoke], state: active, created_at: '2026-10-31T09:00:00Z', expires_at: null, last_used_at: null, replaced_by: null }
                secret: hk_live_7Qm2EXAMPLEexampleEXAMPLE0000
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
