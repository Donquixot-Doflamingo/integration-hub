# EXAMPLE ONLY (HUB-342, HUB-343). Fictional vendor "demo-kyc": there is no vendor documentation
# to cite (AGENTS §3.3 applies to real vendors only). Invented shape:
#   POST /v1/otp/send  {"mobile": "+91..."}  -> 200 {"status": "OTP_SENT", "txn_id", "expires_in", "ref"}
# The bearer token is injected by the vendor's auth scheme: no credential appears in this file.
transformer: DEMO-OTP-SEND-REQ
version: 1
kind: request
capability: demo.mobile_otp@v1
operation: send_otp
vendor_endpoint: demo-kyc.otp_send@1
request:
  method: POST
  path: /v1/otp/send
  headers:
    Content-Type: '"application/json"'
    X-Client-Id:  account.config.client_id
  body:
    mobile: req.mobile
