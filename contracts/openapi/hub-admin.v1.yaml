openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Integration Hub - Admin (Control Plane) API
  version: 1.1.0
  summary: Control plane for vendors, accounts, capabilities, transformers, integrations, tenants and operations.
  description: |
    The control plane (DESIGN §16.1). Unlike the caller API, this API **does** show vendors,
    accounts and versions. Do not proxy it to callers.

    **Auth and RBAC.** OpenID Connect bearer tokens. Each operation declares the minimum role in
    `x-required-role`. Roles are hierarchical: `admin` ⊃ `editor` ⊃ `viewer`. `tenant_viewer` is a
    `viewer` restricted to the tenants in the token's `hub_tenants` claim. Operations marked
    `tenant_viewer` filter their results to those tenants and return 404 for objects outside them.
    Roles come from the token's `hub_roles` claim. A missing role gives 403 `FORBIDDEN`.

    **Change log.** Every mutating operation takes a required `reason` (in the JSON body, or the
    `reason` query parameter for DELETE). It writes a `change_log` row (actor, action, object,
    before, after, reason) and returns its id as `change_id`. Non-mutating actions (validate,
    dry-run, run-goldens, test-connection) take no reason and return no `change_id`.

    **Concurrency.** Live objects (vendors, accounts, tenants, integrations, registrar endpoints)
    return an `ETag`. PUT/PATCH accept `If-Match` and return 412 `PRECONDITION_FAILED` on mismatch.
    Publish and rollback take `expected_active_version` and return 409 `CONFLICT` if another
    publish happened first.

    **Immutability.** Transformer versions, capability versions, published integration versions and
    snapshots are never changed or deleted. Rollback publishes a copy (DESIGN §6.4).

    **Secrets** are write-only (`writeOnly: true`). They are never returned, except a newly minted
    API key or registrar signing secret, which is shown exactly once in the create/rotate response.

    **Request ids.** Every response, success or error, carries `X-Hub-Request-Id` (`req_` + ULID).
    On errors it equals `error.request_id`. Clients show it wherever they report a failure, also
    when the body is not the error envelope (for example a proxy 502).

    Conventions: timestamps RFC 3339 UTC; durations integer ms; cursor pagination (`cursor`,
    `limit` ≤ 200, response `next_cursor`); errors use the canonical envelope
    `{"error": AdminError}` with the admin superset of codes.
  contact:
    name: Platform team (contract-steward)
  license:
    name: Proprietary - internal use only
    identifier: LicenseRef-Proprietary
servers:
  - url: http://localhost:8081/admin/v1
    description: Local control plane (`hub admin`)
  - url: https://hub-admin.{env}.internal/admin/v1
    description: Deployed control plane
    variables:
      env:
        default: staging
        enum: [dev, staging, prod]
security:
  - oidc: []
tags:
  - name: me
  - name: vendors
  - name: accounts
  - name: capabilities
  - name: transformers
  - name: integrations
  - name: tenants
  - name: api-keys
  - name: registrar-endpoints
  - name: snapshots
  - name: requests
  - name: dlq
  - name: breakers
  - name: change-log

paths:
  # ------------------------------------------------------------------ me
  /me:
    get:
      operationId: getMe
      tags: [me]
      x-required-role: tenant_viewer
      summary: Current user and roles
      description: Identity, roles and tenant scope of the caller. The console uses it to show or hide actions.
      responses:
        '200':
          description: Current user.
          headers:
            X-Hub-Request-Id:
              $ref: '#/components/headers/X-Hub-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
              example:
                subject: 00u1abcd2EFGH3ijk4l5
                email: priya@example.com
                name: Priya Sharma
                roles: [editor]
                tenants: []
                permissions: ['integrations:publish', 'integrations:pause', 'dlq:replay', 'transformers:write']
                token_expires_at: '2026-10-31T10:15:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  # ------------------------------------------------------------------ vendors
  /vendors:
    get:
      operationId: listVendors
      tags: [vendors]
      x-required-role: viewer
      summary: List vendors
      description: Vendor definitions with summary fields for the list view.
      parameters:
        - $ref: '#/components/parameters/Q'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of vendors.
          headers:
            X-Hub-Request-Id:
              $ref: '#/components/headers/X-Hub-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VendorList'
              example:
                items:
                  - vendor_id: clevertap
                    display_name: CleverTap
                    auth_scheme: static_headers
                    regions: [in, us]
                    endpoint_count: 1
                    account_count: 2
                    revision: 3
                    updated_at: '2026-10-30T12:00:00Z'
                next_cursor: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createVendor
      tags: [vendors]
      x-required-role: admin
      summary: Create a vendor definition
      description: Creates a vendor (base URLs per region, auth scheme shape, defaults). Endpoints are added with `createVendorEndpoint`. Egress is restricted to the hosts declared here.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VendorCreate'
            example:
              vendor_id: clevertap
              display_name: CleverTap
              auth_scheme: static_headers
              regions:
                in: https://in1.api.clevertap.com
                us: https://us1.api.clevertap.com
              defaults:
                rate_limit: { per_account_rps: 50 }
                breaker: { window_ms: 30000, min_calls: 20, failure_ratio: 0.5, consecutive_timeouts: 5, open_ms: 30000, open_max_ms: 600000, half_open_probes: 3 }
                health_probe: { endpoint: upload@1, dry: true, every_ms: 30000 }
              webhook_verification: { scheme: hmac_sha256, header: X-CleverTap-Signature, max_skew_ms: 300000 }
              docs_url: https://developer.clevertap.com/docs/upload-events-api
              reason: Onboard CleverTap for brand A/B engagement events
      responses:
        '201':
          description: Created.
          headers:
            X-Hub-Request-Id:
              $ref: '#/components/headers/X-Hub-Request-Id'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VendorChange'
              example:
                change_id: chg_01J9Z4B2C3D4E5F6G7H8J9K0MN
                vendor:
                  vendor_id: clevertap
                  display_name: CleverTap
                  auth_scheme: static_headers
                  regions:
                    in: https://in1.api.clevertap.com
                    us: https://us1.api.clevertap.com
                  defaults:
                    rate_limit: { per_account_rps: 50 }
                    breaker: { window_ms: 30000, min_calls: 20, failure_ratio: 0.5, consecutive_timeouts: 5, open_ms: 30000, open_max_ms: 600000, half_open_probes: 3 }
                    health_probe: { endpoint: upload@1, dry: true, every_ms: 30000 }
                  webhook_verification: { scheme: hmac_sha256, header: X-CleverTap-Signature, max_skew_ms: 300000 }
                  docs_url: https://developer.clevertap.com/docs/upload-events-api
                  endpoints: []
                  revision: 1
                  created_at: '2026-10-31T09:00:00Z'
                  updated_at: '2026-10-31T09:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /vendors/{vendor_id}:
    parameters:
      - $ref: '#/components/parameters/VendorId'
    get:
      operationId: getVendor
      tags: [vendors]
      x-required-role: viewer
      summary: Get a vendor definition
      description: Full vendor record including endpoints (all versions).
      responses:
        '200':
          description: Vendor.
          headers:
            X-Hub-Request-Id:
              $ref: '#/components/headers/X-Hub-Request-Id'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vendor'
              example:
                vendor_id: clevertap
                display_name: CleverTap
                auth_scheme: static_headers
                regions:
                  in: https://in1.api.clevertap.com
                  us: https://us1.api.clevertap.com
                defaults:
                  rate_limit: { per_account_rps: 50 }
                  breaker: { window_ms: 30000, min_calls: 20, failure_ratio: 0.5, consecutive_timeouts: 5, open_ms: 30000, open_max_ms: 600000, half_open_probes: 3 }
                  health_probe: { endpoint: upload@1, dry: true, every_ms: 30000 }
                webhook_verification: { scheme: hmac_sha256, header: X-CleverTap-Signature, max_skew_ms: 300000 }
                docs_url: https://developer.clevertap.com/docs/upload-events-api
                endpoints:
                  - endpoint_ref: upload@1
                    name: upload
                    version: 1
                    method: POST
                    path: /1/upload
                    timeout_ms: 3000
                    connect_timeout_ms: 500
                    idempotent: true
                    batch_max: 1000
                    created_at: '2026-10-31T09:01:00Z'
                revision: 3
                created_at: '2026-10-31T09:00:00Z'
                updated_at: '2026-10-31T09:30:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      operationId: updateVendor
      tags: [vendors]
      x-required-role: admin
      summary: Update a vendor definition
      description: Replaces the mutable fields of a vendor (regions, auth scheme, defaults). It increments `revision`, and integrations pick up the change on the next publish or snapshot. Endpoints are not edited here.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VendorUpdate'
            example:
              display_name: CleverTap
              auth_scheme: static_headers
              regions:
                in: https://in1.api.clevertap.com
                us: https://us1.api.clevertap.com
                sg: https://sg1.api.clevertap.com
              defaults:
                rate_limit: { per_account_rps: 50 }
                breaker: { window_ms: 30000, min_calls: 20, failure_ratio: 0.5, consecutive_timeouts: 5, open_ms: 30000, open_max_ms: 600000, half_open_probes: 3 }
                health_probe: { endpoint: upload@1, dry: true, every_ms: 30000 }
              webhook_verification: { scheme: hmac_sha256, header: X-CleverTap-Signature, max_skew_ms: 300000 }
              docs_url: https://developer.clevertap.com/docs/upload-events-api
              reason: Add SG region
      responses:
        '200':
          description: Updated.
          headers:
            X-Hub-Request-Id:
              $ref: '#/components/headers/X-Hub-Request-Id'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VendorChange'
              example:
                change_id: chg_01J9Z4B2C3D4E5F6G7H8J9K0MP
                vendor:
                  vendor_id: clevertap
                  display_name: CleverTap
                  auth_scheme: static_headers
                  regions:
                    in: https://in1.api.clevertap.com
                    us: https://us1.api.clevertap.com
                    sg: https://sg1.api.clevertap.com
                  defaults:
                    rate_limit: { per_account_rps: 50 }
                  endpoints: []
                  revision: 4
                  created_at: '2026-10-31T09:00:00Z'
                  updated_at: '2026-10-31T10:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '500':
          $ref: '#/components/responses/InternalError'
  /vendors/{vendor_id}/endpoints:
    parameters:
      - $ref: '#/components/parameters/VendorId'
    get:
      operationId: listVendorEndpoints
      tags: [vendors]
      x-required-role: viewer
      summary: List a vendor's endpoints (all versions)
      description: Endpoints are versioned and immutable (`upload@1`, `upload@2`).
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of endpoints.
          headers:
            X-Hub-Request-Id:
              $ref: '#/components/headers/X-Hub-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VendorEndpointList'
              example:
                items:
                  - endpoint_ref: upload@1
                    name: upload
                    version: 1
                    method: POST
                    path: /1/upload
                    timeout_ms: 3000
                    connect_timeout_ms: 500
                    idempotent: true
                    batch_max: 1000
                    created_at: '2026-10-31T09:01:00Z'
                next_cursor: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createVendorEndpoint
      tags: [vendors]
      x-required-role: admin
      summary: Add an endpoint or a new endpoint version
      description: Creates `<name>@<n+1>`, or `<name>@1` if the name is new. Existing endpoint versions are immutable.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VendorEndpointCreate'
            example:
              name: upload
              method: POST
              path: /1/upload
              timeout_ms: 3000
              connect_timeout_ms: 500
              idempotent: true
              batch_max: 1000
              reason: Upload events endpoint
      responses:
        '201':
          description: Created.
          headers:
            X-Hub-Request-Id:
              $ref: '#/components/headers/X-Hub-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VendorEndpointChange'
              example:
                change_id: chg_01J9Z4B2C3D4E5F6G7H8J9K0MQ
                endpoint:
                  endpoint_ref: upload@1
                  name: upload
                  version: 1
                  method: POST
                  path: /1/upload
                  timeout_ms: 3000
                  connect_timeout_ms: 500
                  idempotent: true
                  batch_max: 1000
                  created_at: '2026-10-31T09:01:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /vendors/{vendor_id}/endpoints/{endpoint_ref}:
    parameters:
      - $ref: '#/components/parameters/VendorId'
      - $ref: '#/components/parameters/EndpointRef'
    get:
      operationId: getVendorEndpoint
      tags: [vendors]
      x-required-role: viewer
      summary: Get one endpoint version
      description: One immutable endpoint version.
      responses:
        '200':
          description: Endpoint.
          headers:
            X-Hub-Request-Id:
              $ref: '#/components/headers/X-Hub-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VendorEndpoint'
              example:
                endpoint_ref: upload@1
                name: upload
                version: 1
                method: POST
                path: /1/upload
                timeout_ms: 3000
                connect_timeout_ms: 500
                idempotent: true
                batch_max: 1000
                created_at: '2026-10-31T09:01:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  # ------------------------------------------------------------------ accounts
  /accounts:
    get:
      operationId: listAccounts
      tags: [accounts]
      x-required-role: viewer
      summary: List accounts
      description: Credentialed vendor instances with lifecycle state and credential-slot summary. Secrets are never returned.
      parameters:
        - name: vendor_id
          in: query
          description: Filter by vendor.
          schema:
            $ref: '#/components/schemas/Slug'
          example: clevertap
        - name: state
          in: query
          description: Filter by lifecycle state.
          schema:
            $ref: '#/components/schemas/AccountState'
          example: active
        - $ref: '#/components/parameters/Q'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of accounts.
          headers:
            X-Hub-Request-Id:
              $ref: '#/components/headers/X-Hub-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountList'
              example:
                items:
                  - account_id: ct-brandA-in
                    vendor_id: clevertap
                    region: in
                    state: active
                    active_cred_version: 3
                    next_cred_version: null
                    credential_expires_at: null
                    integrations_using: 1
                    breaker_states: { open: 0, half_open: 0, closed: 1 }
                    updated_at: '2026-10-30T12:00:00Z'
                next_cursor: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createAccount
      tags: [accounts]
      x-required-role: admin
      summary: Create an account
      description: Creates an account in state `active`. Initial credentials (write-only) become the `active` slot at cred version 1.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountCreate'
            example:
              account_id: ct-brandA-in
              vendor_id: clevertap
              region: in
              config: { project_id: 4RW-XXX-XXXX, brand_code: A }
              quota: { rps: 50, daily: 5000000 }
              credentials: { account_id: 4RW-XXX-XXXX, passcode: example-passcode-not-real }
              credential_expires_at: null
              reason: Brand A India workspace
      responses:
        '201':
          description: Created.
          headers:
            X-Hub-Request-Id:
              $ref: '#/components/headers/X-Hub-Request-Id'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountChange'
              example:
                change_id: chg_01J9Z4B2C3D4E5F6G7H8J9K0MR
                account:
                  account_id: ct-brandA-in
                  vendor_id: clevertap
                  region: in
                  state: active
                  config: { project_id: 4RW-XXX-XXXX, brand_code: A }
                  quota: { rps: 50, daily: 5000000 }
                  credentials:
                    - { slot: active, cred_version: 1, fingerprint: 'sha256:9f2c1e', created_at: '2026-10-31T09:05:00Z', expires_at: null }
                  integrations_using: []
                  pinned_requests: 0
                  open_sessions: 0
                  created_at: '2026-10-31T09:05:00Z'
                  updated_at: '2026-10-31T09:05:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /accounts/{account_id}:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    get:
      operationId: getAccount
      tags: [accounts]
      x-required-role: viewer
      summary: Get an account
      description: Full account record. Credential slots show metadata only (version, fingerprint, timestamps).
      responses:
        '200':
          description: Account.
          headers:
            X-Hub-Request-Id:
              $ref: '#/components/headers/X-Hub-Request-Id'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
              example:
                account_id: ct-brandA-in
                vendor_id: clevertap
                region: in
                state: active
                config: { project_id: 4RW-XXX-XXXX, brand_code: A }
                quota: { rps: 50, daily: 5000000 }
                credentials:
                  - { slot: active, cred_version: 3, fingerprint: 'sha256:9f2c1e', created_at: '2026-09-01T10:00:00Z', expires_at: null }
                integrations_using:
                  - { integration_id: int_evt_brandA, version: 7, role: target }
                pinned_requests: 0
                open_sessions: 0
                created_at: '2026-06-01T10:00:00Z'
                updated_at: '2026-10-30T12:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      operationId: updateAccount
      tags: [accounts]
      x-required-role: admin
      summary: Update account config or quota
      description: JSON merge-patch of `config` and `quota`. Vendor and region are immutable. Credentials change only through the rotation endpoints.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountUpdate'
            example:
              quota: { rps: 80 }
              reason: Vendor raised our quota to 80 rps (ticket VND-221)
      responses:
        '200':
          description: Updated.
          headers:
            X-Hub-Request-Id:
              $ref: '#/components/headers/X-Hub-Request-Id'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountChange'
              example:
                change_id: chg_01J9Z4B2C3D4E5F6G7H8J9K0MS
                account:
                  account_id: ct-brandA-in
                  vendor_id: clevertap
                  region: in
                  state: active
                  config: { project_id: 4RW-XXX-XXXX, brand_code: A }
                  quota: { rps: 80, daily: 5000000 }
                  credentials:
                    - { slot: active, cred_version: 3, fingerprint: 'sha256:9f2c1e', created_at: '2026-09-01T10:00:00Z', expires_at: null }
                  integrations_using: []
                  pinned_requests: 0
                  open_sessions: 0
                  created_at: '2026-06-01T10:00:00Z'
                  updated_at: '2026-10-31T10:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '500':
          $ref: '#/components/responses/InternalError'
  /accounts/{account_id}/test-connection:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    post:
      operationId: testAccountConnection
      tags: [accounts]
      x-required-role: editor
      summary: Test the account's credentials against the vendor
      description: |
        Runs the vendor's health probe (dry where the vendor supports it) with the chosen credential
        slot. It is non-mutating (no `change_id`) but audited. Use `slot: next` before promoting a
        rotated credential.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectionTestRequest'
            example:
              slot: next
              endpoint_ref: upload@1
      responses:
        '200':
          description: Probe outcome (also 200 when the probe fails; see `ok`).
          headers:
            X-Hub-Request-Id:
              $ref: '#/components/headers/X-Hub-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionTestResult'
              example:
                ok: true
                slot: next
                cred_version: 4
                endpoint_ref: upload@1
                upstream_status: 200
                latency_ms: 184
                error_code: null
                message: null
                checked_at: '2026-10-31T10:05:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /accounts/{account_id}/credentials/next:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    post:
      operationId: addNextCredential
      tags: [accounts]
      x-required-role: admin
      summary: 'Rotation step 1: add the `next` credential'
      description: Stores a new credential version in the `next` slot. It replaces an existing un-promoted `next`. In-flight and new calls keep using `active` until promotion (DESIGN §6.6).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialAddNext'
            example:
              credentials: { account_id: 4RW-XXX-XXXX, passcode: example-new-passcode }
              expires_at: '2027-10-31T00:00:00Z'
              reason: Quarterly passcode rotation
      responses:
        '200':
          description: Next credential stored.
          headers:
            X-Hub-Request-Id:
              $ref: '#/components/headers/X-Hub-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialSlotsChange'
              example:
                change_id: chg_01J9Z4B2C3D4E5F6G7H8J9K0MT
                account_id: ct-brandA-in
                credentials:
                  - { slot: active, cred_version: 3, fingerprint: 'sha256:9f2c1e', created_at: '2026-09-01T10:00:00Z', expires_at: null }
                  - { slot: next, cred_version: 4, fingerprint: 'sha256:7ab3d0', created_at: '2026-10-31T10:00:00Z', expires_at: '2027-10-31T00:00:00Z' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /accounts/{account_id}/credentials/promote:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    post:
      operationId: promoteNextCredential
      tags: [accounts]
      x-required-role: admin
      summary: 'Rotation step 2: promote `next` to `active`'
      description: |
        `next` becomes `active`. The old `active` moves to the `previous` slot. It is kept, not used,
        so it can be deleted after the 15 min watch. Every later attempt, including a parked drain,
        uses the new `active`. Returns 409 `CONFLICT` if there is no `next` or if
        `expected_next_version` does not match.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialPromote'
            example:
              expected_next_version: 4
              reason: Connection test passed
      responses:
        '200':
          description: Promoted.
          headers:
            X-Hub-Request-Id:
              $ref: '#/components/headers/X-Hub-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialSlotsChange'
              example:
                change_id: chg_01J9Z4B2C3D4E5F6G7H8J9K0MV
                account_id: ct-brandA-in
                credentials:
                  - { slot: active, cred_version: 4, fingerprint: 'sha256:7ab3d0', created_at: '2026-10-31T10:00:00Z', expires_at: '2027-10-31T00:00:00Z' }
                  - { slot: previous, cred_version: 3, fingerprint: 'sha256:9f2c1e', created_at: '2026-09-01T10:00:00Z', expires_at: null }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /accounts/{account_id}/credentials/delete-old:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    post:
      operationId: deleteOldCredential
      tags: [accounts]
      x-required-role: admin
      summary: 'Rotation step 3: delete the `previous` credential'
      description: Destroys the `previous` slot's ciphertext. Returns 409 `CONFLICT` if there is no `previous` slot or `expected_previous_version` does not match.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialDeleteOld'
            example:
              expected_previous_version: 3
              reason: No UPSTREAM_AUTH_FAILED for 15 min after promotion
      responses:
        '200':
          description: Deleted.
          headers:
            X-Hub-Request-Id:
              $ref: '#/components/headers/X-Hub-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialSlotsChange'
              example:
                change_id: chg_01J9Z4B2C3D4E5F6G7H8J9K0MW
                account_id: ct-brandA-in
                credentials:
                  - { slot: active, cred_version: 4, fingerprint: 'sha256:7ab3d0', created_at: '2026-10-31T10:00:00Z', expires_at: '2027-10-31T00:00:00Z' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /accounts/{account_id}/lifecycle:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    post:
      operationId: transitionAccountLifecycle
      tags: [accounts]
      x-required-role: admin
      summary: Move an account through active -> draining -> retired
      description: |
        Allowed transitions: `active -> draining`, `draining -> active`, `draining -> retired`.
        The Hub also moves accounts to `draining` automatically when no active integration version
        targets them (DESIGN §6.5). `retired` is refused with 409 `RETIRE_BLOCKED` while pinned
        requests or open vendor sessions reference the account, or while any active integration
        version targets it. Retire deletes all credentials. Other invalid transitions give 409
        `CONFLICT`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LifecycleTransition'
            example:
              target_state: retired
              reason: Brand B moved to MoEngage
      responses:
        '200':
          description: Transitioned.
          headers:
            X-Hub-Request-Id:
              $ref: '#/components/headers/X-Hub-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountChange'
              example:
                change_id: chg_01J9Z4B2C3D4E5F6G7H8J9K0MX
                account:
                  account_id: ct-brandB-us
                  vendor_id: clevertap
                  region: us
                  state: retired
                  config: { project_id: 8ZZ-XXX-XXXX, brand_code: B }
                  quota: { rps: 50, daily: 5000000 }
                  credentials: []
                  integrations_using: []
                  pinned_requests: 0
                  open_sessions: 0
                  created_at: '2026-06-01T10:00:00Z'
                  updated_at: '2026-10-31T11:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/LifecycleConflict'
        '500':
          $ref: '#/components/responses/InternalError'

