# EXAMPLE ONLY (HUB-342, HUB-343). Fictional vendor "demo-kyc" (see DEMO-OTP-SEND-REQ@1).
# On success the session: section keeps ONLY the vendor txn id; the Hub stores it for 10 minutes,
# pinned to this version and account (DESIGN §14), and verify_otp reads it.
transformer: DEMO-OTP-SEND-RES
version: 1
kind: response
response:
  status:       '"otp_sent"'
  expires_in_s: res.body.expires_in
  vendor_ref:   res.body.ref
session:
  vendor_txn_id: res.body.txn_id
errors:
  - when: res.status == 401 || res.status == 403
    code: UPSTREAM_AUTH_FAILED
    retryable: false
  - when: res.status == 429
    code: UPSTREAM_RATE_LIMITED
    retryable: true
    retry_after_ms: int(header(res, "Retry-After") ?? "1") * 1000
  - when: res.status >= 500
    code: UPSTREAM_UNAVAILABLE
    retryable: true
  - when: res.status >= 400
    code: UPSTREAM_REJECTED
    retryable: false
