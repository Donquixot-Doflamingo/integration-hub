        Creates version `n+1` (or version 1 with a new transformer id). The YAML must compile, pass
        the budget checks and **every sample (golden fixture) must pass**. Otherwise it returns 422
        `PUBLISH_VALIDATION_FAILED` and nothing is stored, so a transformer with failing samples
        cannot exist (AGENTS §3.4). Production transformers must cite `docs_url`.

        * **`kind: request`**: `vendor_endpoint` is required. At least one sample is required. Each
          sample is `input` (the caller body) + optional `input_headers` + `expected_request`. The
          Hub runs the transformer on the sample and refuses the version with check `goldens_pass`
          when the produced request differs from `expected_request`, and with check
          `endpoint_schema` when the produced request (path parameters, query, non-credential
          headers, body) breaks the endpoint's `request_schema` (a required field missing, a wrong
          type). Each failing check names the sample (`sample`) and the JSON pointer of the field in
          the produced request (`field`, e.g. `/query/name`), in `error.details[]` and in
          `error.meta.report.checks[]`.
        * **`kind: response`**: `vendor_endpoint` must be absent (or null): a response transformer
          stands alone. At least one sample is required. Each sample is `vendor_response`
          (`status`, `headers`, `body`) + `expected_response` or `expected_error`; check
          `goldens_pass`. The output is not checked against any schema.
        * **`kind: inbound`**: unchanged; `vendor_endpoint` is required.

        A transformer no longer knows a caller schema. Its field references (`req.x`, `hdr.X`) and
        its samples' inputs are checked against the operation's `request_schema` when an
        integration version that uses it is validated or published (`validateIntegrationVersion`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransformerVersionCreate'
            examples:
              request:
                summary: Request transformer (POST body) with one sample
                value:
                  kind: request
                  vendor_endpoint: clevertap.upload@1
                  expected_latest_version: 7
                  yaml: "transformer: T1\nkind: request\nvendor_endpoint: clevertap.upload@1\nrequest:\n  method: POST\n  path: /1/upload\n"
                  fixtures:
                    - name: order_placed
                      input: { user: { id: u_48213 }, event: { name: order_placed, timestamp: '2026-10-31T09:15:00Z' } }
                      input_headers: { X-Request-Source: checkout }
                      expected_request: { method: POST, path: /1/upload, body: { d: [ { identity: u_48213, type: event, evtName: order_placed, ts: 1793438100 } ] } }
                  docs_url: https://developer.clevertap.com/docs/upload-events-api
                  reason: Map context.campaign
              request_query:
                summary: Request transformer (GET with a query parameter), first version of a new id
                value:
                  kind: request
                  vendor_endpoint: agify.estimate@1
                  expected_latest_version: null
                  yaml: "transformer: AGE_REQ\nkind: request\nvendor_endpoint: agify.estimate@1\nrequest:\n  method: GET\n  path: /\n  query:\n    name: req.firstName + req.lastName\n"
                  fixtures:
                    - name: full_name
                      input: { firstName: Mich, lastName: ael }
                      expected_request: { method: GET, path: /, query: { name: Michael } }
                  docs_url: https://agify.io/documentation
                  reason: Age estimate request mapping
              response:
                summary: Response transformer (no vendor endpoint)
                value:
                  kind: response
                  expected_latest_version: null
                  yaml: "transformer: AGE_RES\nkind: response\nresponse:\n  age: res.body.age\n"
                  fixtures:
                    - name: known_name
                      vendor_response: { status: 200, headers: { Content-Type: application/json }, body: { count: 21, name: Michael, age: 57 } }
                      expected_response: { age: 57 }
                  docs_url: https://agify.io/documentation
                  reason: Return only the age
      responses:
        '201':
          description: Created.
          headers:
            X-Hub-Request-Id:
              $ref: '#/components/headers/X-Hub-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransformerVersionChange'
              example:
                change_id: chg_01J9Z4B2C3D4E5F6G7H8J9K0N0
                transformer_version:
                  transformer_id: T1
                  version: 8
                  ref: T1@8
                  kind: request
                  vendor_endpoint: clevertap.upload@1
                  yaml: "transformer: T1\nkind: request\n..."
                  fixtures:
                    - name: order_placed
                      input: { user: { id: u_48213 }, event: { name: order_placed } }
                      input_headers: { X-Request-Source: checkout }
                      expected_request: { method: POST, path: /1/upload }
                  docs_url: https://developer.clevertap.com/docs/upload-events-api
                  goldens: { passed: true, total: 1, failed: 0 }
                  author: priya@example.com
                  reason: Map context.campaign
                  created_at: '2026-10-31T10:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          description: |
            A check failed and nothing was stored, for example `expressions_typecheck`,
            `goldens_pass` (a sample's output differs from what it expects) or `endpoint_schema` (a
            request sample's produced request breaks the endpoint's `request_schema`). `details[]` and `meta.report.checks[]`
            name the sample and the JSON pointer of the field.
          headers:
            X-Hub-Request-Id:
              $ref: '#/components/headers/X-Hub-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminErrorEnvelope'
              examples:
                endpoint_schema:
                  summary: Produced request breaks the endpoint's request_schema
                  value:
                    error:
                      code: PUBLISH_VALIDATION_FAILED
                      message: 1 sample check failed
                      retryable: false
                      retry_after_ms: null
                      details:
                        - { pointer: /fixtures/1, keyword: endpoint_schema, sample: empty_name, field: /query/name, message: "sample 'empty_name': /query/name must NOT have fewer than 1 characters" }
                      meta:
                        report:
                          valid: false
                          checks:
                            - { check: goldens_pass, status: pass, message: null, pointer: null }
                            - { check: endpoint_schema, status: fail, message: "/query/name must NOT have fewer than 1 characters", pointer: /fixtures/1, sample: empty_name, field: /query/name }
                      request_id: req_01J9Z3M1A5B7C9D1E3F5G7H9KP
                goldens_pass:
                  summary: Produced request differs from the expected request
                  value:
                    error:
                      code: PUBLISH_VALIDATION_FAILED
                      message: 1 sample check failed
                      retryable: false
                      retry_after_ms: null
                      details:
                        - { pointer: /fixtures/0/expected_request/query/name, keyword: goldens_pass, sample: full_name, field: /query/name, message: "sample 'full_name': expected 'Michael', got 'Mich ael'" }
                      meta:
                        report:
                          valid: false
                          checks:
                            - { check: goldens_pass, status: fail, message: "expected 'Michael', got 'Mich ael'", pointer: /fixtures/0/expected_request/query/name, sample: full_name, field: /query/name }
                            - { check: endpoint_schema, status: pass, message: null, pointer: null }
                      request_id: req_01J9Z3M1A5B7C9D1E3F5G7H9KQ
        '500':
          $ref: '#/components/responses/InternalError'
