# Local dev and integration-test dependencies (TECH_SPEC §14.1, HUB-023).
# Images are pinned by digest; bump tag and digest together.
name: integration-hub

services:
  postgres:
    image: postgres:16.15-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
    environment:
      POSTGRES_USER: hub
      POSTGRES_PASSWORD: hub # dev-only credential
      POSTGRES_DB: hub
    ports: ["127.0.0.1:5432:5432"] # loopback only: hub/hub is a dev credential
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hub -d hub"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.4.12-alpine@sha256:8da19c7399dca900c6822a1cf30f9d2285585e2c4b457ff4095b0f4500054d3f
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports: ["127.0.0.1:6379:6379"] # loopback only: no auth
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
