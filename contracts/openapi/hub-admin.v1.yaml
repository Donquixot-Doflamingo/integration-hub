    parameters:
      - $ref: '#/components/parameters/KeyId'
    post:
      operationId: revokeApiKey
      tags: [api-keys]
      x-required-role: admin
      summary: Revoke an API key immediately
      description: Effective on all nodes within the snapshot propagation window (about 10 s). Revoking an already-revoked key gives 409 `CONFLICT`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonBody'
