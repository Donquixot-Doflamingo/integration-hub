            X-Hub-Request-Id:
              $ref: '#/components/headers/X-Hub-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransformerDryRunResult'
              example:
                ok: true
                kind: request
                vendor_request:
                  method: POST
                  url: https://in1.api.clevertap.com/1/upload
                  headers: { Content-Type: application/json, X-CleverTap-Account-Id: '***', X-CleverTap-Passcode: '***' }
                  body: { d: [ { identity: u_48213, type: event, evtName: order_placed, ts: 1793438100, evtData: { order_id: ord_8821 } } ] }
                canonical_response: null
                canonical_error: null
                schema_errors: []
                compile_errors: []
                duration_us: 142
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /transformers/run-goldens:
    post:
      operationId: runTransformerGoldens
      tags: [transformers]
      x-required-role: editor
      summary: Run the samples (golden fixtures) of a stored or draft transformer
      description: |
        Runs every sample and reports per-sample results. Non-mutating. `createTransformerVersion`
        runs the same checks and refuses the version if any sample fails:

        * Request samples: `input` (+ `input_headers`) -> the produced request must equal
          `expected_request` (`diff` lists the differences) and must fit the vendor endpoint's
          `request_schema` (`schema_errors` lists each violation with the JSON pointer of the field).
        * Response samples: `vendor_response` -> the output must equal `expected_response`, or the
          canonical error must equal `expected_error`.

        A sample passes only when `diff` and `schema_errors` are both empty and `error` is null.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoldensRunRequest'
            example:
              ref: T1@7
      responses:
        '200':
          description: Golden results (200 even when some fail; see `passed`).
          headers:
            X-Hub-Request-Id:
              $ref: '#/components/headers/X-Hub-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoldensRunResult'
              examples:
                passed:
                  summary: Every sample passes
                  value:
                    passed: true
                    total: 2
                    failed: 0
                    results:
                      - { fixture: order_placed, passed: true, diff: [], schema_errors: [] }
                      - { fixture: no_timestamp, passed: true, diff: [], schema_errors: [] }
                    duration_ms: 12
                failed:
                  summary: One sample differs from its expected request and breaks the endpoint schema
                  value:
                    passed: false
                    total: 2
                    failed: 1
                    results:
                      - { fixture: full_name, passed: true, diff: [], schema_errors: [] }
                      - fixture: empty_last_name
                        passed: false
                        diff:
                          - { op: replace, path: /query/name, before: Michael, after: '' }
                        schema_errors:
                          - { field: /query/name, keyword: minLength, message: must NOT have fewer than 1 characters }
                        error: null
                    duration_ms: 4
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
