# EXAMPLE ONLY (HUB-342). Fictional vendor "demo-kyc": no vendor documentation to cite. Invented shape:
#   POST /v1/bank-accounts/verify {"account_number", "ifsc", "name_to_match"?, "reference"}
#     -> 200 {"result": "VALID" | "INVALID", "beneficiary_name", "name_match_score", "ref"}
#     -> 400 {"error": "INVALID_IFSC", "message"}
# The Idempotency-Key the caller sends is passed as the vendor reference, so a vendor that
# dedupes by reference never moves the penny twice.
transformer: DEMO-BANK-REQ
version: 1
kind: request
capability: demo.bank_account_verify@v1
vendor_endpoint: demo-kyc.bank_verify@1
request:
  method: POST
  path: /v1/bank-accounts/verify
  headers:
    Content-Type: '"application/json"'
    X-Client-Id:  account.config.client_id
  body:
    account_number: req.account_number
    ifsc:           req.ifsc
    name_to_match:  req.name
    reference:      hdr.idempotency_key
