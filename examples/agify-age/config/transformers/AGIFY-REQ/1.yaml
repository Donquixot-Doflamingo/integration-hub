# EXAMPLE ONLY (HUB-435). agify.io age estimate, checked on 2026-11-07 against
# https://agify.io/documentation/api/reference (AGENTS §3.3): GET https://api.agify.io?name=<name>.
# The name is the first name followed by the last name, as the integration owner asked
# ({"firstName": "har", "lastName": "sh"} -> ?name=harsh). The docs recommend sending the full name
# ("Sarah Johnson"); a mapping with a space would be 'req.firstName + " " + req.lastName'.
# No credential: the vendor's auth scheme is none (a paid key would go in query.apikey from creds.*).
transformer: AGIFY-REQ
version: 1
kind: request
docs_url: https://agify.io/documentation/api/reference
vendor_endpoint: agify.estimate@1
request:
  method: GET
  path: /
  query:
    name: req.firstName + req.lastName
