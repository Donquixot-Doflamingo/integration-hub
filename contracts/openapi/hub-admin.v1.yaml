  /integrations/{integration_id}/versions/{version}/publish:
    parameters:
      - $ref: '#/components/parameters/IntegrationId'
      - $ref: '#/components/parameters/Version'
    post:
      operationId: publishIntegrationVersion
      tags: [integrations]
      x-required-role: editor
      summary: Publish a draft version (cutover)
      description: |
        Validates (same checks as `validate`), makes the version immutable and active, and builds a
        new config snapshot. Nodes swap within about 10 s. A failed validation gives 422
        `PUBLISH_VALIDATION_FAILED` with the report in `error.meta.report`. If the active version
        is not `expected_active_version`, it returns 409 `CONFLICT`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishRequest'
            example:
              expected_active_version: 7
              reason: Canary 20% to the new workspace
      responses:
        '200':
          description: Published.
          headers:
            X-Hub-Request-Id:
              $ref: '#/components/headers/X-Hub-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishResult'
              example:
                change_id: chg_01J9Z4B2C3D4E5F6G7H8J9K0N5
                integration_id: int_evt_brandA
                previous_active_version: 7
                active_version: 8
                snapshot_version: 413
                published_at: '2026-10-31T09:30:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/PublishValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'
  /integrations/{integration_id}/rollback:
    parameters:
