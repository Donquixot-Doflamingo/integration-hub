  /snapshots:
    get:
      operationId: listSnapshots
      tags: [snapshots]
      x-required-role: viewer
      summary: List config snapshots
      description: Newest first. Retained 90 days.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of snapshots.
          headers:
            X-Hub-Request-Id:
              $ref: '#/components/headers/X-Hub-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotList'
              example:
                items:
                  - { version: 413, checksum: 'sha256:5e88489c3b1a8f6e2d1c0b9a8f7e6d5c4b3a291807f6e5d4c3b2a1908f7e6d5c', author: priya@example.com, change_id: chg_01J9Z4B2C3D4E5F6G7H8J9K0N5, summary: 'publish int_evt_brandA v8', size_bytes: 48213, created_at: '2026-10-31T09:30:00Z', blob_url: /admin/v1/snapshots/413/blob }
                next_cursor: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /snapshots/latest:
    get:
      operationId: getLatestSnapshot
      tags: [snapshots]
      x-required-role: viewer
      summary: Latest snapshot (long-poll)
      description: |
        Used by nodes (service-account tokens with role `viewer`). With `If-None-Match: "<version>"` and
        `wait` > 0, the server holds the request until a newer snapshot exists or `wait` elapses.
        It then returns 200 with the newer metadata, or 304. The ETag is the quoted snapshot version.
      parameters:
        - name: wait
          in: query
          description: Max long-poll time in ms (0 = return immediately).
          schema:
            type: integer
            minimum: 0
            maximum: 30000
            default: 0
          example: 25000
        - name: If-None-Match
          in: header
          description: ETag of the snapshot the node already has.
          schema:
            type: string
          example: '"412"'
      responses:
        '200':
          description: Latest snapshot metadata.
          headers:
            X-Hub-Request-Id:
              $ref: '#/components/headers/X-Hub-Request-Id'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Snapshot'
              example: { version: 413, checksum: 'sha256:5e88489c3b1a8f6e2d1c0b9a8f7e6d5c4b3a291807f6e5d4c3b2a1908f7e6d5c', author: priya@example.com, change_id: chg_01J9Z4B2C3D4E5F6G7H8J9K0N5, summary: 'publish int_evt_brandA v8', size_bytes: 48213, created_at: '2026-10-31T09:30:00Z', blob_url: /admin/v1/snapshots/413/blob }
        '304':
          description: No newer snapshot within `wait`.
          headers:
            X-Hub-Request-Id:
              $ref: '#/components/headers/X-Hub-Request-Id'
            ETag:
              $ref: '#/components/headers/ETag'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /snapshots/{snapshot_version}:
    parameters:
      - $ref: '#/components/parameters/SnapshotVersion'
    get:
      operationId: getSnapshot
      tags: [snapshots]
      x-required-role: viewer
      summary: Get snapshot metadata and diff summary
      description: Metadata plus the list of objects changed versus the previous snapshot.
      responses:
        '200':
          description: Snapshot.
          headers:
            X-Hub-Request-Id:
              $ref: '#/components/headers/X-Hub-Request-Id'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotDetail'
              example:
                version: 413
                checksum: 'sha256:5e88489c3b1a8f6e2d1c0b9a8f7e6d5c4b3a291807f6e5d4c3b2a1908f7e6d5c'
                author: priya@example.com
                change_id: chg_01J9Z4B2C3D4E5F6G7H8J9K0N5
                summary: 'publish int_evt_brandA v8'
                size_bytes: 48213
                created_at: '2026-10-31T09:30:00Z'
                blob_url: /admin/v1/snapshots/413/blob
                previous_version: 412
                changed_objects:
                  - { object_type: integration, object_id: int_evt_brandA, change: updated }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /snapshots/{snapshot_version}/blob:
    parameters:
      - $ref: '#/components/parameters/SnapshotVersion'
    get:
      operationId: getSnapshotBlob
      tags: [snapshots]
      x-required-role: viewer
      summary: Download the snapshot blob
      description: The full registry content (no secrets; credentials only as references) that nodes compile. Verify `checksum` after download. The format is internal to the backend (`x-internal-format`).
      responses:
        '200':
          description: Snapshot blob.
          headers:
            X-Hub-Request-Id:
              $ref: '#/components/headers/X-Hub-Request-Id'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                type: object
              example:
                version: 413
                tenants: {}
                capabilities: {}
                vendors: {}
                accounts: {}
                transformers: {}
                integrations: {}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  # ------------------------------------------------------------------ requests
  /requests:
    get:
      operationId: searchRequests
      tags: [requests]
      x-required-role: tenant_viewer
      summary: Search requests
      description: Request explorer. Filters combine with AND. Multi-value filters (`status`, `code`) are OR within the filter. The time range applies to `created_at` and is required to span ≤ 31 days. Sorted newest first.
      parameters:
        - $ref: '#/components/parameters/TenantFilter'
        - name: integration_id
          in: query
          description: Filter by integration.
          schema:
            $ref: '#/components/schemas/Slug'
          example: int_evt_brandA
        - name: status
          in: query
          description: One or more request states.
          style: form
          explode: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/RequestState'
          example: [dead_lettered, parked]
        - name: code
          in: query
          description: One or more canonical error codes.
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
          example: [UPSTREAM_TIMEOUT]
        - name: vendor_id
          in: query
          description: Filter by vendor of the last attempt.
          schema:
            $ref: '#/components/schemas/Slug'
          example: clevertap
        - name: account_id
          in: query
          description: Filter by account of the last attempt.
          schema:
            $ref: '#/components/schemas/Slug'
          example: ct-brandA-in
        - name: idempotency_key
          in: query
          description: Exact idempotency key.
          schema:
            type: string
          example: order-8821-created
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
