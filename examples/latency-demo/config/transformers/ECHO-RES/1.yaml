# EXAMPLE ONLY (HUB-353). Postman Echo response (see ECHO-REQ@1): 200 {"args", "data", "files",
# "form", "headers", "json": <our body>, "url"}. Only the echoed message and seq go back; the
# echoed request headers (which include X-Hub-Demo-Client) never reach the caller.
transformer: ECHO-RES
version: 1
kind: response
capability: demo.echo@v1
docs_url: https://learning.postman.com/docs/reference/developer-resources/echo-api
response:
  status:  '"echoed"'
  message: res.body.json.message
  seq:     'res.body.json.seq == nil ? nil : int(res.body.json.seq)'
errors:
  - when: 'res.status < 300 && res.body == nil'
    code: UPSTREAM_UNAVAILABLE
    retryable: true
  - when: res.status == 429
    code: UPSTREAM_RATE_LIMITED
    retryable: true
    retry_after_ms: int(header(res, "Retry-After") ?? "1") * 1000
  - when: res.status >= 500
    code: UPSTREAM_UNAVAILABLE
    retryable: true
  - when: res.status >= 400
    code: UPSTREAM_REJECTED
    retryable: false
