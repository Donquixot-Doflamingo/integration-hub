# EXAMPLE ONLY (HUB-353). The only account of postman-echo. region: public (the internet) or mock
# (mockvendor); run.sh sets it from LATENCY_TARGET. The vendor's auth scheme is none: the account
# has no credentials (no credentials_ref, nothing to store with hubctl creds set).
account: echo-public
