  /integrations/{integration_id}/versions/{version}/validate:
    parameters:
      - $ref: '#/components/parameters/IntegrationId'
      - $ref: '#/components/parameters/Version'
    post:
      operationId: validateIntegrationVersion
      tags: [integrations]
      x-required-role: editor
      summary: Run the publish validation without publishing
      description: |
        Runs every DESIGN §6.4 check and returns a report. It is non-mutating, so the request body is
        empty. `publishIntegrationVersion` runs the same checks. Since 2.0.0 (ADR-0023) they include:

        * `schemas_compile`: every operation's `request_schema` compiles as JSON Schema 2020-12, and
          every field reference of the request transformers (`req.x`, `hdr.X`) exists in the
          operation's `request_schema` (`body` for `req.*`, `headers` for `hdr.*`). Pointer
          `/operations/<op>/request_schema/...` or the target's transformer pair.
        * `input_schema`: every sample input of each request transformer used by an operation
          (`input` and `input_headers`) fits that operation's `request_schema`. The check names the
          `sample` and the `field` (`/body/firstName`, `/headers/X-Request-Source`).
        * `goldens_pass` and `endpoint_schema`: the same sample checks as `createTransformerVersion`
          (the produced request equals `expected_request` and fits the vendor endpoint's
          `request_schema`), run again for every referenced transformer.
        * `operations_have_transformers`: every key of a target's `operations` is declared in
          `spec.operations`.
        * `interactive_sync_only`: an `interactive` integration uses `sync` delivery.

        Response transformers are optional (`response: null` = pass-through) and their output is not
        checked against any schema.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
            example: {}
      responses:
        '200':
          description: Validation report (200 even when invalid; see `valid`).
          headers:
            X-Hub-Request-Id:
              $ref: '#/components/headers/X-Hub-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationReport'
              example:
                valid: true
                checks:
                  - { check: schemas_compile, status: pass, message: null, pointer: null }
                  - { check: expressions_typecheck, status: pass, message: null, pointer: null }
                  - { check: input_schema, status: pass, message: null, pointer: null }
                  - { check: goldens_pass, status: pass, message: null, pointer: null }
                  - { check: endpoint_schema, status: pass, message: null, pointer: null }
                  - { check: references_exist, status: pass, message: null, pointer: null }
                  - { check: accounts_not_retired, status: pass, message: null, pointer: null }
                  - { check: interactive_sync_only, status: pass, message: null, pointer: null }
                  - { check: weights_sum_100, status: pass, message: null, pointer: null }
                  - { check: delivery_path_declared, status: pass, message: null, pointer: null }
                  - { check: operations_have_transformers, status: pass, message: null, pointer: null }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
