        '500':
          $ref: '#/components/responses/InternalError'
  /integrations/{integration_id}/pause:
    parameters:
      - $ref: '#/components/parameters/IntegrationId'
    post:
      operationId: pauseIntegration
      tags: [integrations]
      x-required-role: editor
      summary: Pause (kill switch)
      description: sync/wait calls get 503 `INTEGRATION_PAUSED`. Nothing new is parked, and workers hold queued envelopes. Other integrations on the same account are unaffected. Pause is not a version. It propagates through the snapshot within about 10 s. Pausing again is a no-op that still logs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonBody'
            example:
              reason: Vendor reports data corruption on brand A workspace
      responses:
        '200':
          description: Paused.
          headers:
            X-Hub-Request-Id:
              $ref: '#/components/headers/X-Hub-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationChange'
              example:
                change_id: chg_01J9Z4B2C3D4E5F6G7H8J9K0N7
                integration:
                  integration_id: int_evt_brandA
                  owner_tenant: orders-service
                  capability: events.track@v1
                  description: Brand A product analytics events
                  grants: []
                  moves_money_or_quota: false
                  active_version: 7
                  latest_version: 8
                  has_draft: true
                  paused: true
                  paused_reason: Vendor reports data corruption on brand A workspace
                  active: null
                  created_at: '2026-06-01T10:00:00Z'
                  updated_at: '2026-10-31T10:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
