  /integrations:
    get:
      operationId: listIntegrations
      tags: [integrations]
      x-required-role: tenant_viewer
      summary: List integrations
      description: |
        Summary rows for the integrations list view, including the current targets of the active
        version. Filters combine with AND and apply before pagination, so every page holds only
        matching rows. `has_active_version` and `active_version_behind` (since 1.1.0) find
        integrations that were never published and those with a newer version or draft waiting.
      parameters:
        - $ref: '#/components/parameters/TenantFilter'
        - name: capability
          in: query
          description: Filter by capability key.
          schema:
            $ref: '#/components/schemas/CapabilityKeyValue'
          example: events.track@v1
        - name: vendor_id
          in: query
          description: Integrations whose active version targets this vendor (primary or failover).
          schema:
            $ref: '#/components/schemas/Slug'
          example: clevertap
        - name: account_id
          in: query
          description: Integrations whose active version targets this account.
          schema:
            $ref: '#/components/schemas/Slug'
          example: ct-brandA-in
        - name: paused
          in: query
          description: Filter by paused flag.
          schema:
            type: boolean
          example: false
        - name: has_active_version
          in: query
          description: |
            `true`: only integrations with an active (published) version. `false`: only integrations
            without one (created but never published; invocations answer 503 `INTEGRATION_PAUSED`
            with reason `no_active_version`). Omitted: no filter. Since 1.1.0.
          schema:
            type: boolean
          example: false
        - name: active_version_behind
          in: query
          description: |
            `true`: only integrations that have an active version and something newer waiting: a
            newer version (`latest_version` > `active_version`) or a draft (`has_draft`). `false`:
            only integrations whose active version is the latest, with no draft. Integrations
            without an active version match neither value (use `has_active_version=false`).
            Omitted: no filter. Since 1.1.0.
          schema:
            type: boolean
          example: true
        - $ref: '#/components/parameters/Q'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of integrations.
          headers:
            X-Hub-Request-Id:
              $ref: '#/components/headers/X-Hub-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationList'
              example:
                items:
                  - integration_id: int_evt_brandA
                    owner_tenant: orders-service
                    capability: events.track@v1
                    description: Brand A product analytics events
                    active_version: 7
                    latest_version: 8
                    has_draft: true
                    paused: false
                    delivery_mode: wait
                    targets: [ { vendor_id: clevertap, account_id: ct-brandA-in, weight: 100 } ]
                    updated_at: '2026-10-30T12:00:00Z'
                next_cursor: null
