          $ref: '#/components/responses/InternalError'
    post:
      operationId: createApiKey
      tags: [api-keys]
      x-required-role: admin
      summary: Create an API key (secret shown once)
      description: Mints a key. `secret` appears only in this response. The Hub stores only its hash. Scopes are `invoke`, `dry_run` and `requests_read`, each optionally narrowed to one integration as `<scope>:<integration_id>`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiKeyCreate'
            example:
