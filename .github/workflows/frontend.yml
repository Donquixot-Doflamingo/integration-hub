# Admin console (frontend/) CI: type check, lint, unit tests and production build.
# Runs only when the console (or this workflow) changes. See frontend/AGENTS.md.
name: frontend

on:
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  console:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Type check (svelte-check)
        run: npm run check
      - name: Lint (prettier + eslint)
        run: npm run lint
      - name: Unit tests (vitest)
        run: npm test
      - name: Build
        run: npm run build
