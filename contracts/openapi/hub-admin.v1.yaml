openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Integration Hub - Admin (Control Plane) API
  version: 2.0.0
  summary: Control plane for vendors, accounts, transformers, integrations, tenants and operations.
  description: |
    The control plane (DESIGN §16.1). Unlike the caller API, this API **does** show vendors,
    accounts and versions. Do not proxy it to callers.

    **Auth and RBAC.** OpenID Connect bearer tokens. Each operation declares the minimum role in
    `x-required-role`. Roles are hierarchical: `admin` ⊃ `editor` ⊃ `viewer`. `tenant_viewer` is a
    `viewer` restricted to the tenants in the token's `hub_tenants` claim. Operations marked
    `tenant_viewer` filter their results to those tenants and return 404 for objects outside them.
    Roles come from the token's `hub_roles` claim. A missing role gives 403 `FORBIDDEN`.

    **Change log.** Every mutating operation takes a required `reason` (in the JSON body, or the
    `reason` query parameter for DELETE). It writes a `change_log` row (actor, action, object,
    before, after, reason) and returns its id as `change_id`. Non-mutating actions (validate,
    dry-run, run-goldens, test-connection) take no reason and return no `change_id`.

    **Concurrency.** Live objects (vendors, accounts, tenants, integrations, registrar endpoints)
    return an `ETag`. PUT/PATCH accept `If-Match` and return 412 `PRECONDITION_FAILED` on mismatch.
    Publish and rollback take `expected_active_version` and return 409 `CONFLICT` if another
    publish happened first.

    **Immutability.** Vendor endpoint versions, transformer versions, published integration
    versions and snapshots are never changed or deleted. Rollback publishes a copy (DESIGN §6.4).

    **Schemas (2.0.0, ADR-0023).** Each integration version declares its `operations`, and each operation carries the caller's `request_schema` (`body`, optional
    `headers`). Each vendor endpoint version declares the `request_schema` it accepts (`path`,
    `query`, `headers`, `body`) and an optional, informational `response_schema`. Request
    transformers turn the caller's input into the vendor request. Their samples (golden fixtures)
    are checked against the endpoint's `request_schema` when the transformer is created and when
    an integration version is validated or published, never on live calls. Response transformers
    are optional: without one the vendor's status and body are passed through (hub-public).

    **Secrets** are write-only (`writeOnly: true`). They are never returned, except a newly minted
    API key or registrar signing secret, which is shown exactly once in the create/rotate response.

    **Request ids.** Every response, success or error, carries `X-Hub-Request-Id` (`req_` + ULID).
    On errors it equals `error.request_id`. Clients show it wherever they report a failure, also
    when the body is not the error envelope (for example a proxy 502).

    Conventions: timestamps RFC 3339 UTC; durations integer ms; cursor pagination (`cursor`,
    `limit` ≤ 200, response `next_cursor`); errors use the canonical envelope
    `{"error": AdminError}` with the admin superset of codes.
  contact:
    name: Platform team (contract-steward)
  license:
    name: Proprietary - internal use only
    identifier: LicenseRef-Proprietary
servers:
  - url: http://localhost:8081/admin/v1
    description: Local control plane (`hub admin`)
  - url: https://hub-admin.{env}.internal/admin/v1
    description: Deployed control plane
    variables:
      env:
        default: staging
        enum: [dev, staging, prod]
security:
  - oidc: []
tags:
  - name: me
  - name: vendors
  - name: accounts
  - name: transformers
  - name: integrations
  - name: tenants
  - name: api-keys
  - name: registrar-endpoints
  - name: snapshots
  - name: requests
  - name: dlq
  - name: breakers
  - name: change-log

paths:
  # ------------------------------------------------------------------ me
  /me:
    get:
      operationId: getMe
      tags: [me]
      x-required-role: tenant_viewer
      summary: Current user and roles
      description: Identity, roles and tenant scope of the caller. The console uses it to show or hide actions.
      responses:
        '200':
          description: Current user.
          headers:
            X-Hub-Request-Id:
              $ref: '#/components/headers/X-Hub-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
              example:
                subject: 00u1abcd2EFGH3ijk4l5
                email: priya@example.com
                name: Priya Sharma
                roles: [editor]
                tenants: []
                permissions: ['integrations:publish', 'integrations:pause', 'dlq:replay', 'transformers:write']
                token_expires_at: '2026-10-31T10:15:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  # ------------------------------------------------------------------ vendors
  /vendors:
    get:
      operationId: listVendors
      tags: [vendors]
      x-required-role: viewer
      summary: List vendors
      description: Vendor definitions with summary fields for the list view.
      parameters:
        - $ref: '#/components/parameters/Q'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of vendors.
          headers:
            X-Hub-Request-Id:
              $ref: '#/components/headers/X-Hub-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VendorList'
              example:
                items:
                  - vendor_id: clevertap
                    display_name: CleverTap
                    auth_scheme: static_headers
                    regions: [in, us]
                    endpoint_count: 1
                    account_count: 2
                    revision: 3
                    updated_at: '2026-10-30T12:00:00Z'
                next_cursor: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createVendor
      tags: [vendors]
      x-required-role: admin
      summary: Create a vendor definition
      description: |
        Creates a vendor (base URLs per region, auth scheme shape, defaults). Endpoints are added with
        `createVendorEndpoint`. Egress is restricted to the hosts declared here. Use auth scheme
        `none` (since 2.0.0) for public APIs that need no credentials: its accounts carry none.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VendorCreate'
            examples:
              static_headers:
                summary: Vendor with per-account header credentials
                value:
                  vendor_id: clevertap
                  display_name: CleverTap
                  auth_scheme: static_headers
                  regions:
                    in: https://in1.api.clevertap.com
                    us: https://us1.api.clevertap.com
                  defaults:
                    rate_limit: { per_account_rps: 50 }
                    breaker: { window_ms: 30000, min_calls: 20, failure_ratio: 0.5, consecutive_timeouts: 5, open_ms: 30000, open_max_ms: 600000, half_open_probes: 3 }
                    health_probe: { endpoint: upload@1, dry: true, every_ms: 30000 }
                  webhook_verification: { scheme: hmac_sha256, header: X-CleverTap-Signature, max_skew_ms: 300000 }
                  docs_url: https://developer.clevertap.com/docs/upload-events-api
                  reason: Onboard CleverTap for brand A/B engagement events
              public_api:
                summary: Public API without credentials (auth scheme none)
                value:
                  vendor_id: agify
                  display_name: Agify
                  auth_scheme: none
                  regions:
                    global: https://api.agify.io
                  defaults:
                    rate_limit: { per_account_rps: 1 }
                  webhook_verification: null
                  docs_url: https://agify.io/documentation
                  reason: Age estimate from first and last name (no credentials needed)
      responses:
        '201':
          description: Created.
          headers:
            X-Hub-Request-Id:
              $ref: '#/components/headers/X-Hub-Request-Id'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VendorChange'
              example:
                change_id: chg_01J9Z4B2C3D4E5F6G7H8J9K0MN
                vendor:
                  vendor_id: clevertap
                  display_name: CleverTap
                  auth_scheme: static_headers
                  regions:
                    in: https://in1.api.clevertap.com
                    us: https://us1.api.clevertap.com
                  defaults:
                    rate_limit: { per_account_rps: 50 }
                    breaker: { window_ms: 30000, min_calls: 20, failure_ratio: 0.5, consecutive_timeouts: 5, open_ms: 30000, open_max_ms: 600000, half_open_probes: 3 }
                    health_probe: { endpoint: upload@1, dry: true, every_ms: 30000 }
                  webhook_verification: { scheme: hmac_sha256, header: X-CleverTap-Signature, max_skew_ms: 300000 }
                  docs_url: https://developer.clevertap.com/docs/upload-events-api
                  endpoints: []
                  revision: 1
                  created_at: '2026-10-31T09:00:00Z'
                  updated_at: '2026-10-31T09:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /vendors/{vendor_id}:
    parameters:
      - $ref: '#/components/parameters/VendorId'
    get:
      operationId: getVendor
      tags: [vendors]
      x-required-role: viewer
      summary: Get a vendor definition
      description: Full vendor record including endpoints (all versions).
      responses:
        '200':
          description: Vendor.
          headers:
            X-Hub-Request-Id:
              $ref: '#/components/headers/X-Hub-Request-Id'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vendor'
              example:
                vendor_id: clevertap
                display_name: CleverTap
                auth_scheme: static_headers
                regions:
                  in: https://in1.api.clevertap.com
                  us: https://us1.api.clevertap.com
                defaults:
                  rate_limit: { per_account_rps: 50 }
                  breaker: { window_ms: 30000, min_calls: 20, failure_ratio: 0.5, consecutive_timeouts: 5, open_ms: 30000, open_max_ms: 600000, half_open_probes: 3 }
                  health_probe: { endpoint: upload@1, dry: true, every_ms: 30000 }
                webhook_verification: { scheme: hmac_sha256, header: X-CleverTap-Signature, max_skew_ms: 300000 }
                docs_url: https://developer.clevertap.com/docs/upload-events-api
                endpoints:
                  - endpoint_ref: upload@1
                    name: upload
                    version: 1
                    method: POST
                    path: /1/upload
                    timeout_ms: 3000
                    connect_timeout_ms: 500
                    idempotent: true
                    batch_max: 1000
                    request_schema:
                      headers: { type: object, required: [Content-Type], properties: { Content-Type: { const: application/json } } }
                      body: { type: object, required: [d], properties: { d: { type: array, minItems: 1, maxItems: 1000 } } }
                    response_schema: null
                    created_at: '2026-10-31T09:01:00Z'
                revision: 3
                created_at: '2026-10-31T09:00:00Z'
                updated_at: '2026-10-31T09:30:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      operationId: updateVendor
      tags: [vendors]
      x-required-role: admin
      summary: Update a vendor definition
      description: Replaces the mutable fields of a vendor (regions, auth scheme, defaults). It increments `revision`, and integrations pick up the change on the next publish or snapshot. Endpoints are not edited here.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VendorUpdate'
            example:
              display_name: CleverTap
              auth_scheme: static_headers
              regions:
                in: https://in1.api.clevertap.com
                us: https://us1.api.clevertap.com
                sg: https://sg1.api.clevertap.com
              defaults:
                rate_limit: { per_account_rps: 50 }
                breaker: { window_ms: 30000, min_calls: 20, failure_ratio: 0.5, consecutive_timeouts: 5, open_ms: 30000, open_max_ms: 600000, half_open_probes: 3 }
                health_probe: { endpoint: upload@1, dry: true, every_ms: 30000 }
              webhook_verification: { scheme: hmac_sha256, header: X-CleverTap-Signature, max_skew_ms: 300000 }
              docs_url: https://developer.clevertap.com/docs/upload-events-api
              reason: Add SG region
      responses:
        '200':
          description: Updated.
          headers:
            X-Hub-Request-Id:
              $ref: '#/components/headers/X-Hub-Request-Id'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VendorChange'
              example:
                change_id: chg_01J9Z4B2C3D4E5F6G7H8J9K0MP
                vendor:
                  vendor_id: clevertap
                  display_name: CleverTap
                  auth_scheme: static_headers
                  regions:
                    in: https://in1.api.clevertap.com
                    us: https://us1.api.clevertap.com
                    sg: https://sg1.api.clevertap.com
                  defaults:
                    rate_limit: { per_account_rps: 50 }
                  endpoints: []
                  revision: 4
                  created_at: '2026-10-31T09:00:00Z'
                  updated_at: '2026-10-31T10:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '500':
          $ref: '#/components/responses/InternalError'
  /vendors/{vendor_id}/endpoints:
    parameters:
      - $ref: '#/components/parameters/VendorId'
    get:
      operationId: listVendorEndpoints
      tags: [vendors]
      x-required-role: viewer
      summary: List a vendor's endpoints (all versions)
      description: Endpoints are versioned and immutable (`upload@1`, `upload@2`).
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of endpoints.
          headers:
            X-Hub-Request-Id:
              $ref: '#/components/headers/X-Hub-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VendorEndpointList'
              example:
                items:
                  - endpoint_ref: upload@1
                    name: upload
                    version: 1
                    method: POST
                    path: /1/upload
                    timeout_ms: 3000
                    connect_timeout_ms: 500
                    idempotent: true
                    batch_max: 1000
                    request_schema:
                      headers: { type: object, required: [Content-Type], properties: { Content-Type: { const: application/json } } }
                      body: { type: object, required: [d], properties: { d: { type: array, minItems: 1, maxItems: 1000 } } }
                    response_schema: null
                    created_at: '2026-10-31T09:01:00Z'
                next_cursor: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createVendorEndpoint
      tags: [vendors]
      x-required-role: admin
      summary: Add an endpoint or a new endpoint version
      description: |
        Creates `<name>@<n+1>`, or `<name>@1` if the name is new. Existing endpoint versions are
        immutable.

        `request_schema` is required (since 2.0.0): the request this endpoint version accepts, as JSON
        Schemas (2020-12) of the path parameters, the query parameters, the non-credential headers
        and the body. Each key is optional, and `{}` means the endpoint takes nothing besides its
        method and path. Request transformer samples are checked against it when a transformer is
        created (`createTransformerVersion`) and when an integration version is validated or
        published; live calls are never checked against it. Credential headers and query values set
        from `creds.*` are not part of the checked request, so never declare them here.
        `response_schema` is optional and informational: the Hub never enforces it.

        A schema that is not a valid JSON Schema 2020-12 document gives 400 `VALIDATION_FAILED` with
        a `pointer` into `request_schema` or `response_schema`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VendorEndpointCreate'
            examples:
              json_body:
                summary: POST endpoint with a JSON body
                value:
                  name: upload
                  method: POST
                  path: /1/upload
                  timeout_ms: 3000
                  connect_timeout_ms: 500
                  idempotent: true
                  batch_max: 1000
                  request_schema:
                    headers: { type: object, required: [Content-Type], properties: { Content-Type: { const: application/json } } }
                    body:
                      type: object
                      required: [d]
                      properties:
                        d:
                          type: array
                          minItems: 1
                          maxItems: 1000
                          items:
                            type: object
                            required: [identity, type, evtName]
                            properties:
                              identity: { type: string, minLength: 1 }
                              type: { const: event }
                              evtName: { type: string, minLength: 1 }
                              ts: { type: integer }
                              evtData: { type: object }
                  reason: Upload events endpoint
              query_only:
                summary: GET endpoint with one required query parameter
                description: For the vendor `agify` (auth scheme `none`). `response_schema` documents the answer and is never enforced.
                value:
                  name: estimate
                  method: GET
                  path: /
                  timeout_ms: 2000
                  connect_timeout_ms: 500
                  idempotent: true
                  request_schema:
                    query: { type: object, required: [name], properties: { name: { type: string, minLength: 1 } } }
                  response_schema:
                    type: object
                    properties:
                      count: { type: integer }
                      name: { type: string }
                      age: { type: [integer, 'null'] }
                  reason: Age estimate endpoint
      responses:
        '201':
          description: Created.
          headers:
            X-Hub-Request-Id:
              $ref: '#/components/headers/X-Hub-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VendorEndpointChange'
              example:
                change_id: chg_01J9Z4B2C3D4E5F6G7H8J9K0MQ
                endpoint:
                  endpoint_ref: upload@1
                  name: upload
                  version: 1
                  method: POST
                  path: /1/upload
                  timeout_ms: 3000
                  connect_timeout_ms: 500
                  idempotent: true
                  batch_max: 1000
                  request_schema:
                    headers: { type: object, required: [Content-Type], properties: { Content-Type: { const: application/json } } }
                    body: { type: object, required: [d], properties: { d: { type: array, minItems: 1, maxItems: 1000 } } }
                  response_schema: null
                  created_at: '2026-10-31T09:01:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /vendors/{vendor_id}/endpoints/{endpoint_ref}:
    parameters:
      - $ref: '#/components/parameters/VendorId'
      - $ref: '#/components/parameters/EndpointRef'
    get:
      operationId: getVendorEndpoint
      tags: [vendors]
      x-required-role: viewer
      summary: Get one endpoint version
      description: One immutable endpoint version, with its `request_schema` and optional `response_schema`.
      responses:
        '200':
          description: Endpoint.
          headers:
            X-Hub-Request-Id:
              $ref: '#/components/headers/X-Hub-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VendorEndpoint'
              example:
                endpoint_ref: upload@1
                name: upload
                version: 1
                method: POST
                path: /1/upload
                timeout_ms: 3000
                connect_timeout_ms: 500
                idempotent: true
                batch_max: 1000
                request_schema:
                  headers: { type: object, required: [Content-Type], properties: { Content-Type: { const: application/json } } }
                  body: { type: object, required: [d], properties: { d: { type: array, minItems: 1, maxItems: 1000 } } }
                response_schema: null
                created_at: '2026-10-31T09:01:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  # ------------------------------------------------------------------ accounts
  /accounts:
    get:
      operationId: listAccounts
      tags: [accounts]
      x-required-role: viewer
      summary: List accounts
      description: |
        Credentialed vendor instances with lifecycle state and credential-slot summary. Secrets are
        never returned. Since 1.1.0 each row also carries `dead_letter_count` and
        `dead_letter_oldest_at` (dead letters whose last attempt used the account, within retention;
        filter them with `listDeadLetters?account_id=`).
      parameters:
        - name: vendor_id
          in: query
          description: Filter by vendor.
          schema:
            $ref: '#/components/schemas/Slug'
          example: clevertap
        - name: state
          in: query
          description: Filter by lifecycle state.
          schema:
            $ref: '#/components/schemas/AccountState'
          example: active
        - $ref: '#/components/parameters/Q'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of accounts.
          headers:
            X-Hub-Request-Id:
              $ref: '#/components/headers/X-Hub-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountList'
              example:
                items:
                  - account_id: ct-brandA-in
                    vendor_id: clevertap
                    region: in
                    state: active
                    active_cred_version: 3
                    next_cred_version: null
                    credential_expires_at: null
                    integrations_using: 1
                    breaker_states: { open: 0, half_open: 0, closed: 1 }
                    dead_letter_count: 1
                    dead_letter_oldest_at: '2026-10-31T11:02:40Z'
                    updated_at: '2026-10-30T12:00:00Z'
                  - account_id: ct-brandA-in-v2
                    vendor_id: clevertap
                    region: in
                    state: active
                    active_cred_version: 1
                    next_cred_version: null
                    credential_expires_at: null
                    integrations_using: 1
                    breaker_states: { open: 0, half_open: 0, closed: 1 }
                    dead_letter_count: 0
                    dead_letter_oldest_at: null
                    updated_at: '2026-10-30T12:00:00Z'
                next_cursor: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createAccount
      tags: [accounts]
      x-required-role: admin
      summary: Create an account
      description: |
        Creates an account in state `active`. Initial credentials (write-only) become the `active`
        slot at cred version 1.

        `credentials` is required unless the vendor's auth scheme is `none` (since 2.0.0). For a
        `none` vendor it must be omitted or `{}`: the account has no credential slots
        (`credentials: []`, `active_cred_version: null`), and the credential operations
        (`addNextCredential`, `promoteNextCredential`, `deleteOldCredential`) answer 409 `CONFLICT`.
        Missing credentials for any other scheme, or non-empty credentials for `none`, give 400
        `VALIDATION_FAILED` (pointer `/credentials`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountCreate'
            examples:
              with_credentials:
                summary: Account of a vendor that needs credentials
                value:
                  account_id: ct-brandA-in
                  vendor_id: clevertap
                  region: in
                  config: { project_id: 4RW-XXX-XXXX, brand_code: A }
                  quota: { rps: 50, daily: 5000000 }
                  credentials: { account_id: 4RW-XXX-XXXX, passcode: example-passcode-not-real }
                  credential_expires_at: null
                  reason: Brand A India workspace
              auth_none:
                summary: Account of an auth `none` vendor (no credentials)
