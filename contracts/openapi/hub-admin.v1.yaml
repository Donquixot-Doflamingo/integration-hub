      tags: [api-keys]
      x-required-role: admin
      summary: Rotate an API key with overlap
      description: Mints a replacement key with the same tenant and scopes. The old key stays valid for `overlap_ms` (state `expiring`) and is then revoked automatically. The new secret is shown once.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiKeyRotate'
            example:
              overlap_ms: 86400000
              reason: Scheduled rotation
      responses:
        '200':
          description: Rotated.
          headers:
            X-Hub-Request-Id:
              $ref: '#/components/headers/X-Hub-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyRotateResult'
              example:
                change_id: chg_01J9Z4B2C3D4E5F6G7H8J9K0NE
                old_key: { key_id: key_01J9Z7F6G7H8J9K0M1N2P3Q4RS, tenant_id: orders-service, prefix: hk_live_7Qm2, description: orders prod, scopes: [invoke], state: expiring, created_at: '2026-10-01T10:00:00Z', expires_at: '2026-11-01T10:00:00Z', last_used_at: '2026-10-31T09:14:59Z', replaced_by: key_01J9Z7F6G7H8J9K0M1N2P3Q4RT }
                api_key: { key_id: key_01J9Z7F6G7H8J9K0M1N2P3Q4RT, tenant_id: orders-service, prefix: hk_live_Z9a1, description: orders prod, scopes: [invoke], state: active, created_at: '2026-10-31T10:00:00Z', expires_at: null, last_used_at: null, replaced_by: null }
                secret: hk_live_Z9a1EXAMPLEexampleEXAMPLE0000
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  # ------------------------------------------------------------------ registrar endpoints
  /registrar-endpoints:
    get:
      operationId: listRegistrarEndpoints
      tags: [registrar-endpoints]
      x-required-role: tenant_viewer
      summary: List registrar endpoints
      description: Tenant webhook destinations. Signing secrets are never returned.
      parameters:
        - $ref: '#/components/parameters/TenantFilter'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of endpoints.
          headers:
            X-Hub-Request-Id:
              $ref: '#/components/headers/X-Hub-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrarEndpointList'
              example:
                items:
                  - { endpoint_id: reg_orders_cb, tenant_id: orders-service, url: 'https://orders.internal/hub/callbacks', description: Orders callbacks, disabled: false, secret_version: 1, secret_overlap_until: null, subscribed_by: 2, created_at: '2026-10-01T10:00:00Z', updated_at: '2026-10-01T10:00:00Z' }
                next_cursor: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createRegistrarEndpoint
      tags: [registrar-endpoints]
      x-required-role: admin
      summary: Register a webhook endpoint (signing secret shown once)
      description: The URL host must be allowlisted. The SSRF guard resolves the host and rejects private or link-local ranges (400 `VALIDATION_FAILED`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrarEndpointCreate'
            example:
              endpoint_id: reg_orders_cb
              tenant_id: orders-service
              url: https://orders.internal/hub/callbacks
              description: Orders callbacks
              reason: Callbacks for async integrations
      responses:
        '201':
          description: Created.
          headers:
            X-Hub-Request-Id:
              $ref: '#/components/headers/X-Hub-Request-Id'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrarEndpointSecretChange'
              example:
                change_id: chg_01J9Z4B2C3D4E5F6G7H8J9K0NF
                endpoint: { endpoint_id: reg_orders_cb, tenant_id: orders-service, url: 'https://orders.internal/hub/callbacks', description: Orders callbacks, disabled: false, secret_version: 1, secret_overlap_until: null, subscribed_by: 0, created_at: '2026-10-31T09:00:00Z', updated_at: '2026-10-31T09:00:00Z' }
                signing_secret: whsec_EXAMPLEexampleEXAMPLEexample00
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /registrar-endpoints/{endpoint_id}:
    parameters:
      - $ref: '#/components/parameters/EndpointId'
    get:
      operationId: getRegistrarEndpoint
      tags: [registrar-endpoints]
      x-required-role: tenant_viewer
      summary: Get a registrar endpoint
      description: Endpoint detail, including which integration versions subscribe to it.
      responses:
        '200':
          description: Endpoint.
          headers:
            X-Hub-Request-Id:
              $ref: '#/components/headers/X-Hub-Request-Id'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrarEndpoint'
              example: { endpoint_id: reg_orders_cb, tenant_id: orders-service, url: 'https://orders.internal/hub/callbacks', description: Orders callbacks, disabled: false, secret_version: 1, secret_overlap_until: null, subscribed_by: 2, created_at: '2026-10-01T10:00:00Z', updated_at: '2026-10-01T10:00:00Z' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      operationId: updateRegistrarEndpoint
      tags: [registrar-endpoints]
      x-required-role: admin
      summary: Update URL, description or disabled flag
      description: Merge-patch. The same SSRF guard applies to a new URL.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrarEndpointUpdate'
            example:
              url: https://orders.internal/hub/v2/callbacks
              reason: New callback route
      responses:
        '200':
          description: Updated.
          headers:
            X-Hub-Request-Id:
              $ref: '#/components/headers/X-Hub-Request-Id'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrarEndpointChange'
              example:
                change_id: chg_01J9Z4B2C3D4E5F6G7H8J9K0NG
                endpoint: { endpoint_id: reg_orders_cb, tenant_id: orders-service, url: 'https://orders.internal/hub/v2/callbacks', description: Orders callbacks, disabled: false, secret_version: 1, secret_overlap_until: null, subscribed_by: 2, created_at: '2026-10-01T10:00:00Z', updated_at: '2026-10-31T10:00:00Z' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: deleteRegistrarEndpoint
      tags: [registrar-endpoints]
      x-required-role: admin
      summary: Delete a registrar endpoint
      description: Refused with 409 `CONFLICT` while any active or draft integration version subscribes to it. Pending callback deliveries to it are dead-lettered.
      parameters:
        - $ref: '#/components/parameters/ReasonQuery'
      responses:
        '200':
          description: Deleted.
          headers:
            X-Hub-Request-Id:
              $ref: '#/components/headers/X-Hub-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeRef'
              example:
                change_id: chg_01J9Z4B2C3D4E5F6G7H8J9K0NH
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /registrar-endpoints/{endpoint_id}/rotate-secret:
    parameters:
      - $ref: '#/components/parameters/EndpointId'
    post:
      operationId: rotateRegistrarSecret
      tags: [registrar-endpoints]
      x-required-role: admin
      summary: Rotate the signing secret with overlap
      description: New secret shown once. For `overlap_ms`, callbacks carry two `v1=` signatures (new and old).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecretRotate'
            example:
              overlap_ms: 86400000
              reason: Scheduled rotation
      responses:
        '200':
          description: Rotated.
          headers:
            X-Hub-Request-Id:
              $ref: '#/components/headers/X-Hub-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrarEndpointSecretChange'
              example:
                change_id: chg_01J9Z4B2C3D4E5F6G7H8J9K0NJ
                endpoint: { endpoint_id: reg_orders_cb, tenant_id: orders-service, url: 'https://orders.internal/hub/callbacks', description: Orders callbacks, disabled: false, secret_version: 2, secret_overlap_until: '2026-11-01T10:00:00Z', subscribed_by: 2, created_at: '2026-10-01T10:00:00Z', updated_at: '2026-10-31T10:00:00Z' }
                signing_secret: whsec_NEWexampleEXAMPLEexampleEXAM00
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
