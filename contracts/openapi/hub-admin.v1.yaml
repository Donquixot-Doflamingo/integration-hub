    get:
      operationId: diffIntegrationVersions
      tags: [integrations]
      x-required-role: tenant_viewer
      summary: Diff two versions
      description: Structured diff (RFC 6902-style operations on the spec) plus a unified YAML diff for display.
      parameters:
        - name: from
          in: query
          required: true
          description: Base version.
          schema:
            type: integer
            minimum: 1
          example: 7
        - name: to
          in: query
          required: true
          description: Compared version.
          schema:
            type: integer
            minimum: 1
          example: 8
      responses:
        '200':
          description: Diff.
          headers:
            X-Hub-Request-Id:
              $ref: '#/components/headers/X-Hub-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionDiff'
              example:
                integration_id: int_evt_brandA
                from: 7
                to: 8
                changes:
                  - { op: replace, path: /targets/0/weight, before: 100, after: 90 }
                  - { op: add, path: /targets/1, before: null, after: { vendor_id: clevertap, account_id: ct-brandA-in-v2, transformer: { request: T1@8, response: R1@2 }, weight: 10 } }
                unified: "--- v7\n+++ v8\n@@ targets @@\n-  weight: 100\n+  weight: 90\n+- vendor_id: clevertap\n+  account_id: ct-brandA-in-v2\n"
        '400':
