# EXAMPLE ONLY (HUB-342, HUB-343). "demo-kyc" is a fictional KYC vendor. It does not exist: every
# call goes to mockvendor, which the example test programs per step. There is no vendor
# documentation to cite; the shapes below are invented for the example and must not be copied
# for a real vendor.
#
# Sending and verifying an OTP are two endpoints, like most real KYC vendors: int_demo_otp maps
# the operation send_otp to otp_send@1 and verify_otp to otp_verify@1, each through its own
# transformer pair (per-operation transformers, HUB-343).
vendor: demo-kyc
auth: bearer
regions:
  in: http://127.0.0.1:8099
endpoints:
  # Each endpoint declares the request it accepts (ADR-0023): every request transformer sample
  # must fit it. The bearer token is injected by the auth scheme and is never part of the checked
  # request; X-Client-Id comes from the account's config, so it is checked.
  otp_send@1:
    method: POST
    path: /v1/otp/send
    timeout_ms: 3000
    connect_timeout_ms: 500
    idempotent: false
    request_schema:
      headers:
        type: object
        required: [Content-Type, X-Client-Id]
        properties:
          Content-Type: { type: string, pattern: '^application/json' }
          X-Client-Id: { type: string, minLength: 1 }
      body:
        type: object
        required: [mobile]
        additionalProperties: false
        properties:
          mobile: { type: string, pattern: '^\+[0-9]{8,15}$' }
  otp_verify@1:
    method: POST
    path: /v1/otp/verify
    timeout_ms: 3000
    connect_timeout_ms: 500
    idempotent: false
    request_schema:
      headers:
        type: object
        required: [Content-Type, X-Client-Id]
        properties:
          Content-Type: { type: string, pattern: '^application/json' }
          X-Client-Id: { type: string, minLength: 1 }
      body:
        type: object
        required: [mobile, txn_id, otp]
        additionalProperties: false
        properties:
          mobile: { type: string, pattern: '^\+[0-9]{8,15}$' }
          txn_id: { type: string, minLength: 1 }
          otp: { type: string, minLength: 4, maxLength: 8 }
  bank_verify@1:
    method: POST
    path: /v1/bank-accounts/verify
    timeout_ms: 5000
    connect_timeout_ms: 500
    idempotent: false
    request_schema:
      headers:
        type: object
        required: [Content-Type, X-Client-Id]
        properties:
          Content-Type: { type: string, pattern: '^application/json' }
          X-Client-Id: { type: string, minLength: 1 }
      body:
        type: object
        required: [account_number, ifsc, reference]
        additionalProperties: false
        properties:
          account_number: { type: string, minLength: 1 }
          ifsc: { type: string, minLength: 11, maxLength: 11 }
          name_to_match: { type: string }
          reference: { type: string, minLength: 1 }
defaults:
  rate_limit: { per_account_rps: 20 }
  breaker: { window_s: 30, min_calls: 20, failure_ratio: 0.5, consecutive_timeouts: 5, open_s: 30, open_max_s: 600, half_open_probes: 3 }
