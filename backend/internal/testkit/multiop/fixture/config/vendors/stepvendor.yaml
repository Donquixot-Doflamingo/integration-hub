# TEST ONLY (HUB-343). Fictional vendor with one endpoint per operation; tests point it at
# mockvendor or a fake upstream. No vendor documentation exists (invented shapes). The
# credentials go in static headers (X-Account-Id, X-Api-Key from creds.*), like the dev clevertap vendor.
vendor: stepvendor
auth: static_headers
regions:
  in: http://127.0.0.1:8099
endpoints:
  send@1:
    method: POST
    path: /v1/codes
    timeout_ms: 3000
    connect_timeout_ms: 500
    idempotent: false
    request_schema:
      body: { type: object, required: [phone, channel], properties: { phone: { type: string, minLength: 1 }, channel: { enum: [sms, voice] } } }
  verify@1:
    method: POST
    path: /v1/codes/verify
    timeout_ms: 3000
    connect_timeout_ms: 500
    idempotent: true
    request_schema:
      body: { type: object, required: [phone, code], properties: { phone: { type: string }, code: { type: string } } }
defaults:
  rate_limit: { per_account_rps: 50 }
  breaker: { window_s: 30, min_calls: 20, failure_ratio: 0.5, consecutive_timeouts: 5, open_s: 30, open_max_s: 600, half_open_probes: 3 }
